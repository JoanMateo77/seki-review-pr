function respuestaHtml(c) {
  const larga = c.respuesta.length > 900 || c.respuesta.split('\n').length > 14;
  const abierta = estado.expandidas.has(c.id);
  const costo = c.desdeCache ? 'Respuesta guardada, sin costo' : `${esc(nombreModelo(c.modelo))}${c.costo ? ` · ${usd(c.costo)}${Number(c.lote) > 1 ? ` por el lote de ${Number(c.lote)}` : ''}` : ''}`;
  const investigar = API && c.tipo === 'pregunta' && !c.investigado && c.estado === 'respondido'
    ? `<button type="button" class="btn-texto${c.necesitaCodigo ? ' destacado' : ''}" data-com-investigar="${esc(c.id)}" title="La IA busca y lee el código de la PR y de los otros repos (sin secretos)">${icono('buscar')} Investigar en el código</button>` : '';
  return `<div class="hilo-respuesta">
    ${c.necesitaCodigo && !c.investigado ? '<p class="aviso-codigo">Para responder con certeza hay que revisar el código del repositorio.</p>' : ''}
    <div class="md${larga && !abierta ? ' plegada' : ''}">${md(c.respuesta)}</div>
    ${larga ? `<button type="button" class="btn-texto" data-ver-mas="${esc(c.id)}">${abierta ? 'Ver menos' : 'Ver más'}</button>` : ''}
    ${c.leido?.length ? `<p class="leido muy-tenue">Revisado en: ${c.leido.map((x) => `<span class="mono">${esc(x.repo)}${x.portal && x.portal !== x.repo ? ` (${esc(x.portal)})` : ''} ${esc(x.rama)}@${esc(String(x.sha ?? '').slice(0, 7))}</span>`).join(' · ')}</p>` : ''}
    ${consultadoHtml(c)}
    <div class="hilo-pie muy-tenue"><span>Respuesta de IA</span> · ${c.investigado ? `${icono('buscar')} Revisado en el código · ` : ''}${costo}${valorarHtml(c)}<button type="button" class="btn-texto" data-com-repreguntar="${esc(c.id)}">Repreguntar</button>${investigar}</div></div>`;
}

// Ordena una lista de comentarios como conversación: cada repregunta debajo de la pregunta a la que responde.
function enHilo(cs) {
  const ids = new Set(cs.map((c) => c.id));
  const hijos = new Map();
  for (const c of cs) if (c.respondeA && ids.has(c.respondeA)) hijos.set(c.respondeA, [...(hijos.get(c.respondeA) ?? []), c]);
  const salida = [];
  const poner = (c, n) => { salida.push([c, n]); for (const h of hijos.get(c.id) ?? []) poner(h, n + 1); };
  for (const c of cs) if (!(c.respondeA && ids.has(c.respondeA))) poner(c, 0);
  return salida;
}
const hilosDiv = (cs) => enHilo(cs).map(([c, n]) => hiloCuerpo(c, n)).join('');

// Formato mínimo de las respuestas de la IA: bloques de código, código en línea, negrita, listas y párrafos.
function md(texto) {
  return String(texto ?? '').replace(/\r/g, '').split('```').map((b, i) => (i % 2
    ? `<pre class="md-codigo">${esc(b.replace(/^[a-zA-Z]*\n/, '').replace(/\n$/, ''))}</pre>`
    : mdTexto(b))).join('');
}
const mdEnLinea = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
function mdTexto(t) {
  return t.split(/\n\s*\n/).map((par) => {
    const partes = [];
    let lista = null;
    for (const linea of par.split('\n')) {
      const item = /^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/.exec(linea);
      if (item) {
        const tipo = item[1] ? 'ol' : 'ul';
        if (!lista || lista.tipo !== tipo) { lista = { tipo, items: [] }; partes.push(lista); }
        lista.items.push(item[2]);
      } else if (linea.trim()) {
        lista = null;
        partes.push(linea);
      }
    }
    return partes.map((x) => (typeof x === 'string' ? `<p>${mdEnLinea(x)}</p>` : `<${x.tipo}>${x.items.map((i) => `<li>${mdEnLinea(i)}</li>`).join('')}</${x.tipo}>`)).join('');
  }).join('');
}

function hiloCuerpo(c, nivel = 0) {
  const revisando = c.investigar && (c.estado === 'en_cola' || c.estado === 'en_curso');
  const [txt, cls] = revisando ? ['Revisando el código', 'azul'] : ESTADOS_COMENTARIO[c.estado] ?? [c.estado, ''];
  const editable = (c.estado === 'borrador' || c.estado === 'nota') && !c.ambito;
  const donde = c.ambito === 'pr' ? (c.seccion ? esc(SECCIONES[c.seccion] ?? '') : 'Toda la PR') : rangoTexto(c);
  return `<div class="hilo-com${nivel ? ' respuesta-a' : ''}" style="${nivel ? `margin-left:${Math.min(nivel, 3) * 18}px` : ''}">
    <div class="hilo-cab">${nivel ? '<span class="muy-tenue">Sigue</span>' : ''}<strong>${TIPOS_COMENTARIO[c.tipo]?.etiqueta ?? esc(c.tipo)}</strong><span class="mono muy-tenue">${donde}</span><span class="punto-estado ${cls}">${esc(txt)}</span>
      ${editable ? `<span class="der"><button type="button" class="btn-texto" data-com-editar="${esc(c.id)}">Editar</button><button type="button" class="btn-texto" data-com-borrar="${esc(c.id)}">Borrar</button></span>` : ''}${c.ambito && c.estado === 'borrador' ? `<span class="der"><button type="button" class="btn-texto" data-com-borrar="${esc(c.id)}">Borrar</button></span>` : ''}</div>
    ${c.citado ? `<blockquote class="cita">${esc(c.citado)}</blockquote>` : ''}
    <div class="hilo-texto">${esc(c.texto)}</div>
    ${c.sugerido !== undefined ? `<pre class="sugerido" aria-label="Código sugerido">${esc(c.sugerido)}</pre>` : ''}
    ${c.respuesta ? respuestaHtml(c) : ''}
    ${c.propuestaId ? propuestaHtml(c) : ''}
    ${c.estado === 'error' && c.motivo ? `<div class="hilo-motivo">${esc(c.motivo)}${API && c.tipo !== 'nota' ? ` <button type="button" class="btn-texto" data-com-reintentar="${esc(c.id)}">Reintentar</button>` : ''}</div>` : ''}
  </div>`;
}

// Propuestas de cambio de la IA, pedidas al servidor bajo demanda.
const propuestasPedidas = new Set();
function propuestaDe(c) {
  const prop = estado.propuestas.get(c.propuestaId);
  if (prop || !API || propuestasPedidas.has(c.propuestaId)) return prop;
  propuestasPedidas.add(c.propuestaId);
  api(`/api/propuesta?pr=${encodeURIComponent(estado.seleccion)}&id=${encodeURIComponent(c.propuestaId)}`)
    .then((x) => { estado.propuestas.set(x.id, x); repintarDetalle(); }, (e) => avisar(e.message))
    .finally(() => propuestasPedidas.delete(c.propuestaId));
  return null;
}

function diffPropuesta(prop) {
  return prop.patch.split(/^diff --git /m).slice(1).map((bloque) => {
    const archivo = /^\+\+\+ (?:b\/)?(.+)$/m.exec(bloque)?.[1] ?? bloque.split(' ')[0].replace(/^a\//, '');
    const inicio = bloque.indexOf('\n@@');
    const lineas = inicio >= 0 ? PWAnclaje.lineasDePatch(bloque.slice(inicio + 1).replace(/\n$/, '')) : [];
    const filas = lineas.map((l) => (l.tipo === 'hunk'
      ? `<tr class="hunk"><td class="n"></td><td class="n"></td><td class="c">${esc(l.texto)}</td></tr>`
      : `<tr class="${l.tipo}"><td class="n">${l.viejo ?? ''}</td><td class="n">${l.nuevo ?? ''}</td><td class="c">${esc(l.texto)}</td></tr>`)).join('');
    const fuera = prop.fueraDelComentario.includes(archivo);
    return `<div class="prop-archivo"><div class="ruta"><span>${esc(archivo)}</span>${fuera ? '<span class="estado ambar">Fuera del comentario</span>' : ''}</div><div class="codigo-diff"><table>${filas}</table></div></div>`;
  }).join('');
}

function checksPropuesta(prop) {
  const c = prop.comprobaciones;
  const fila = (nombre, r, configurado = true) => {
    if (!configurado || !r) return check('circulo', '', nombre, 'No se comprobó', configurado ? 'Sin archivos que comprobar' : 'No configurado para este repo');
    if (r.omitido) return check('alerta', 'ambar', nombre, 'Se superó el tiempo máximo', '');
    if (r.ok) return check('ok', 'verde', nombre, 'Sin fallos nuevos', r.sinBaseline ? 'Sin baseline: no se comparó con el estado previo' : '');
    return check('bloqueo', 'rojo', nombre, plural(r.nuevosFallos.length, 'fallo nuevo', 'fallos nuevos'), `${esc(r.nuevosFallos.slice(0, 6).join(' · '))}${r.sinBaseline ? ' · Sin baseline: puede incluir fallos que ya existían' : ''}`);
  };
  const reglas = c.reglas.bloqueantes
    ? check('bloqueo', 'rojo', 'Reglas', plural(c.reglas.bloqueantes, 'bloqueante', 'bloqueantes'), esc(c.reglas.hallazgos.filter((h) => h.severidad === 'bloqueante').map((h) => `${h.archivo}:${h.linea} ${h.titulo}`).join(' · ')))
    : c.reglas.resumen?.alto ? check('alerta', 'ambar', 'Reglas', plural(c.reglas.resumen.alto, 'hallazgo alto', 'hallazgos altos'), esc(c.reglas.hallazgos.filter((h) => h.severidad === 'alto').map((h) => h.titulo).join(' · ')))
    : check('ok', 'verde', 'Reglas', 'Sin hallazgos', '');
  return `<div class="prop-checks">${reglas}${fila('Tipos', c.tipos, c.tipos !== null)}${fila('Tests', c.tests, c.tests !== null)}</div>
    ${(c.avisos ?? []).map((a) => `<p class="muy-tenue" style="margin:6px 0 0">${esc(a)}</p>`).join('')}`;
}

function propuestaHtml(c) {
  const prop = propuestaDe(c);
  if (!prop) return `<div class="propuesta tenue">${API ? 'Cargando la propuesta.' : 'La propuesta solo se ve con el tablero abierto desde Claude Code.'}</div>`;
  const pr = prSel();
  const pie = `<span class="muy-tenue">${esc(nombreModelo(prop.modelo))}${prop.costo ? ` · ${usd(prop.costo)}` : ''}</span>`;
  let acciones = '';
  if (prop.estado === 'lista') {
    const confirmar = estado.confirmarAprobar === prop.id;
    acciones = `<div class="prop-acciones">
      <button type="button" class="btn chico primario" data-prop-aprobar="${esc(prop.id)}">${prop.conFallos ? (confirmar ? 'Confirmar: aprobar con fallos' : 'Aprobar con fallos') : 'Aprobar y subir a la rama'}</button>
      <button type="button" class="btn chico" data-prop-ajustar="${esc(prop.id)}" aria-expanded="${estado.ajustando === prop.id}">Pedir ajuste</button>
      <button type="button" class="btn chico" data-prop-descartar="${esc(prop.id)}">Descartar</button>${pie}
    </div>
    ${confirmar ? '<p class="hilo-motivo">La propuesta tiene fallos en las comprobaciones. El segundo clic la sube igual a la rama.</p>' : ''}
    ${estado.ajustando === prop.id ? `<div class="prop-ajuste"><textarea id="ajusteTexto" placeholder="Qué cambiar de esta propuesta" aria-label="Qué cambiar de esta propuesta"></textarea>
      <div class="prop-acciones"><button type="button" class="btn chico primario" data-prop-enviar-ajuste="${esc(prop.id)}">Enviar ajuste</button></div></div>` : ''}`;
  } else if (prop.estado === 'conflicto' || prop.estado === 'rechazada') {
    acciones = `<p class="hilo-motivo">${esc(prop.motivo ?? '')}</p><div class="prop-acciones">
      <button type="button" class="btn chico" data-prop-regenerar="${esc(prop.id)}" ${pr?.estadoPr === 'OPEN' ? '' : 'disabled title="La PR ya no está abierta"'}>Regenerar</button>
      ${prop.estado === 'rechazada' ? `<button type="button" class="btn chico" data-prop-copiar="${esc(prop.id)}">${icono('copiar')} Copiar parche</button>` : ''}${pie}</div>`;
  } else if (prop.estado === 'aprobada') {
    acciones = `<div class="prop-acciones"><span class="punto-estado violeta">Subida a la rama</span><a href="${esc(pr?.url ?? '')}/commits/${esc(prop.commit)}" target="_blank" rel="noopener" class="mono">${esc(prop.commit.slice(0, 7))} ${icono('externo')}</a>${pie}</div>`;
  }
  return `<div class="propuesta">
    <div class="prop-cab"><strong>Propuesta</strong><span>${esc(prop.resumen)}</span></div>
    ${diffPropuesta(prop)}
    ${checksPropuesta(prop)}
    ${acciones}
  </div>`;
}

async function accionPropuesta(accion, id, extra = {}) {
  const pr = prSel();
  try {
    const r = await api(`/api/propuesta/${accion}`, { pr: pr.id, id, ...extra });
    estado.propuestas.delete(id);
    if (accion === 'aprobar' && !r.ok) {
      if (r.motivo === 'requiere_confirmacion') { estado.confirmarAprobar = id; return repintarDetalle(); }
      avisar(r.motivo);
    }
    if (accion === 'aprobar' && r.ok) avisar(`Cambio subido a la rama (${r.commit.slice(0, 7)}).`);
    estado.confirmarAprobar = null;
    estado.ajustando = null;
    await sincronizarComentarios(pr);
    repintarDetalle();
  } catch (err) { avisar(err.message); }
  sondear();
}

function agregarComentario() {
  leerCaja();
  const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
  const rango = rangoSeleccion();
  const c = estado.caja;
  if (!pr || !rango) return;
  if (!c.texto.trim()) { avisar('Escriba el comentario antes de agregarlo.'); return $('cajaTexto')?.focus(); }
  const previo = c.editando ? comentarios(pr).find((x) => x.id === c.editando) : null;
  const conSugerido = c.tipo === 'nota' && c.conSugerido && rango.lado === 'nuevo';
  guardarComentario(pr, {
    ...(previo ?? { id: nuevoIdComentario(), creado: new Date().toISOString() }),
    tipo: c.tipo,
    estado: c.tipo === 'nota' ? 'nota' : 'borrador',
    archivo: estado.archivosTab[estado.seleccionLineas.archivo],
    lado: rango.lado, desde: rango.desde, hasta: rango.hasta, claves: rango.claves,
    textoOriginal: rango.texto,
    texto: c.texto.trim(),
    sugerido: conSugerido ? PWAnclaje.textoSugerido(c.sugerido ?? rango.texto) : undefined,
    headSha: pr.headSha,
    respondeA: c.tipo === 'pregunta' && !previo ? c.respondeA : previo?.respondeA,
  });
  cerrarCaja(c.tipo);
}

function cerrarCaja(tipo) {
  document.querySelectorAll('.codigo-diff tr.caja').forEach((f) => f.remove());
  estado.seleccionLineas = null;
  estado.caja = cajaVacia(tipo ?? estado.caja.tipo);
  repintarDetalle();
  pintarCola();
}

function repintarDetalle() {
  const y = $('detalle').scrollTop;
  pintarDetalle();
  $('detalle').scrollTop = y;
}

function editarComentario(pr, id) {
  const c = comentarios(pr).find((x) => x.id === id);
  const k = estado.archivosTab.indexOf(c?.archivo);
  if (!c || k < 0) return;
  const claves = c.claves?.length ? c.claves : [`${c.lado === 'viejo' ? 'v' : 'n'}${c.desde}`, `${c.lado === 'viejo' ? 'v' : 'n'}${c.hasta}`];
  estado.seleccionLineas = { archivo: k, claveA: claves[0], claveB: claves[claves.length - 1] };
  estado.caja = { tipo: c.tipo, texto: c.texto, conSugerido: c.sugerido !== undefined, sugerido: c.sugerido ?? null, editando: c.id };
  marcarSeleccion();
}

// Filas de un parche unificado con número de línea viejo y nuevo; los hallazgos se cuelgan bajo su línea nueva.
// k: índice del archivo en la pestaña, para ubicar la selección de líneas.
function filasDiff(lineas, hallazgos, k, hilos = new Map()) {
  const filas = [];
  const porLinea = new Map();
  for (const h of hallazgos) {
    if (!porLinea.has(h.linea)) porLinea.set(h.linea, []);
    porLinea.get(h.linea).push(h);
  }
  const color = { bloqueante: 'rojo', alto: 'ambar', medio: '', aviso: '' };
  const sel = estado.seleccionLineas?.archivo === k ? clavesSeleccion() : new Set();
  const num = (n, clave) => (n === null ? '<td class="n"></td>' : `<td class="n"><button class="n-sel" data-sel="${clave}" aria-label="Seleccionar línea ${n}">${n}</button></td>`);
  for (const l of lineas) {
    if (l.tipo === 'hunk') {
      filas.push(`<tr class="hunk"><td class="n"></td><td class="n"></td><td class="c">${esc(l.texto)}</td></tr>`);
      continue;
    }
    const clave = PWAnclaje.claveLinea(l);
    filas.push(`<tr class="${l.tipo}${sel.has(clave) ? ' sel' : ''}" data-clave="${clave}">${num(l.viejo, clave)}${num(l.nuevo, clave)}<td class="c">${esc(l.texto)}</td></tr>`);
    if (l.tipo !== 'del' && porLinea.has(l.nuevo)) {
      for (const x of porLinea.get(l.nuevo)) {
        filas.push(`<tr class="nota"><td class="n"></td><td class="n"></td><td><span class="estado ${color[x.severidad]}">${esc(x.severidad)}</span> <strong>${esc(x.titulo)}</strong> · <span class="tenue">${esc(x.mensaje)}</span></td></tr>`);
      }
    }
    for (const [c, n] of enHilo(hilos.get(clave) ?? [])) filas.push(hiloHtml(c, n));
  }
  return filas.join('');
}

// Selección de líneas del diff: clic marca una línea, Shift + clic extiende el rango dentro del mismo archivo.
function rangoSeleccion() {
  const s = estado.seleccionLineas;
  if (!s) return null;
  return PWAnclaje.normalizarRango(estado.lineasArchivo[s.archivo] ?? [], s.claveA, s.claveB);
}

const clavesSeleccion = () => new Set(rangoSeleccion()?.claves ?? []);

function marcarSeleccion() {
  leerCaja();
  document.querySelectorAll('.codigo-diff tr.sel').forEach((f) => f.classList.remove('sel'));
  document.querySelectorAll('.codigo-diff tr.caja').forEach((f) => f.remove());
  const s = estado.seleccionLineas;
  const rango = rangoSeleccion();
  if (!s || !rango) return;
  const tabla = document.querySelector(`#${idArchivo(s.archivo)} .codigo-diff`);
  if (!tabla) return;
  tabla.closest('.archivo').removeAttribute('data-plegado');
  let ultima = null;
  for (const clave of rango.claves) {
    const fila = tabla.querySelector(`tr[data-clave="${clave}"]`);
    fila?.classList.add('sel');
    ultima = fila ?? ultima;
  }
  ultima?.insertAdjacentHTML('afterend', cajaHtml(rango));
  const t = $('cajaTexto');
  if (t && document.activeElement?.id !== 'cajaSugerido') { t.focus({ preventScroll: true }); t.setSelectionRange(t.value.length, t.value.length); }
}

function seleccionarLinea(boton, extender) {
  const k = +boton.closest('.archivo').dataset.k;
  const clave = boton.dataset.sel;
  const previa = estado.seleccionLineas;
  const extiende = extender && previa?.archivo === k;
  if (!extiende && !estado.caja.editando) { leerCaja(); estado.caja = { ...cajaVacia(estado.caja.tipo), texto: estado.caja.texto }; }
  estado.seleccionLineas = extiende ? { ...previa, claveB: clave } : { archivo: k, claveA: clave, claveB: clave };
  marcarSeleccion();
}

function barraPendiente(pr) {
  const bs = borradores(pr);
  if (!bs.length) return '';
  const preguntas = bs.filter((c) => c.tipo === 'pregunta').length;
  const cambios = bs.filter((c) => c.tipo === 'cambio').length;
  const partes = [preguntas && plural(preguntas, 'pregunta', 'preguntas'), cambios && plural(cambios, 'pedido de cambio', 'pedidos de cambio')].filter(Boolean).join(' · ');
  return `<div class="barra-pendiente" role="region" aria-label="Revisión pendiente">
    <span><strong>Revisión pendiente (${bs.length})</strong> <span class="tenue">${partes}</span></span>
    <span class="der">
      <button type="button" class="btn chico primario" data-accion="enviarRevision" ${API ? '' : 'disabled title="Disponible con el tablero abierto desde Claude Code (tablero_servir)"'}>${icono('chispa')} Enviar revisión</button>
      <button type="button" class="btn chico" data-accion="descartarBorradores">${estado.confirmarDescarte ? `Confirmar: descartar ${plural(bs.length, 'borrador', 'borradores')}` : 'Descartar borradores'}</button>
    </span>
  </div>`;
}

function ordenarArchivos(pr, archivos) {
  const orden = (pr.explicacion?.orden_lectura ?? []).map((o) => o.archivo);
  const pos = (a) => { const i = orden.findIndex((o) => a.filename === o || a.filename.endsWith('/' + o) || o.endsWith(a.filename)); return i < 0 ? orden.length : i; };
  return archivos.map((a, i) => ({ ...a, i })).sort((a, b) => pos(a) - pos(b) || a.i - b.i);
}

let diffPendiente = null;
function tabArchivos(pr) {
  let archivos = DIFFS[pr.id];
  if (!archivos) {
    if (API) {
      if (diffPendiente !== pr.id) {
        diffPendiente = pr.id;
        api(`/api/diff?id=${encodeURIComponent(pr.id)}`).then((d) => { DIFFS[pr.id] = d; if (estado.seleccion === pr.id) pintarDetalle(); }, (e) => avisar(e.message)).finally(() => { diffPendiente = null; });
      }
      return '<p class="tenue">Cargando los cambios de GitHub.</p>';
    }
    return `<p class="tenue">Este tablero no trae el diff de esta PR. Véalo en <a href="${esc(pr.url)}/files" target="_blank" rel="noopener">GitHub</a> o regenere el tablero.</p>`;
  }
  archivos = ordenarArchivos(pr, archivos);
  estado.lineasArchivo = archivos.map((a) => (a.patch !== undefined ? PWAnclaje.lineasDePatch(a.patch) : []));
  estado.archivosTab = archivos.map((a) => a.filename);
  if (API && !estado.comentariosCargados.has(pr.id)) { estado.comentariosCargados.add(pr.id); sincronizarComentarios(pr); }
  const lista = deLineas(pr);
  const anclados = archivos.map((_, k) => new Map());
  const sueltos = archivos.map(() => []);
  const fuera = [];
  for (const c of lista) {
    const k = estado.archivosTab.indexOf(c.archivo);
    if (k < 0) { fuera.push(c); continue; }
    const a = PWAnclaje.anclar(c, estado.lineasArchivo[k]);
    if (a.desactualizado) { sueltos[k].push(c); continue; }
    if (!anclados[k].has(a.claveFinal)) anclados[k].set(a.claveFinal, []);
    anclados[k].get(a.claveFinal).push(c);
  }
  const bloqueSuelto = (cs, titulo) => (cs.length ? `<div class="desact"><p class="muy-tenue">${titulo}</p><table>${enHilo(cs).map(([c, n]) => hiloHtml(c, n)).join('')}</table></div>` : '');
  const vistos = new Set(almacen.leer(claveVistos(pr), []));
  const hallazgos = pr.verificaciones?.hallazgos ?? [];
  const ajustar = almacen.leer('pw-revision:ajustar', false);
  const totalA = archivos.reduce((n, a) => n + a.additions, 0);
  const totalD = archivos.reduce((n, a) => n + a.deletions, 0);
  const plegarDesde = totalA + totalD > 1200 ? 3 : 99;
  const ordenados = !!pr.explicacion?.orden_lectura?.length;
  return `<div class="${ajustar ? 'ajustar' : ''}">
    <div class="diff-barra">
      <span>${plural(archivos.length, 'archivo', 'archivos')} · <span class="mas">+${totalA}</span> <span class="menos">−${totalD}</span> · ${vistos.size} de ${archivos.length} vistos</span>
      ${ordenados ? '<span class="muy-tenue">En el orden de lectura de la explicación</span>' : ''}
      <span class="der">
        <label><input type="checkbox" data-accion-diff="ajustar" ${ajustar ? 'checked' : ''}> Ajustar líneas largas</label>
        <button class="btn chico" data-accion="plegarTodo">Plegar todo</button>
        <button class="btn chico" data-accion="enfoque" title="Esconde la cola y el lateral; Esc para volver">${document.body.hasAttribute('data-enfoque') ? 'Ver la cola' : 'Ampliar'}</button>
        <a class="btn chico" href="${esc(pr.url)}/files" target="_blank" rel="noopener">Ver en GitHub ${icono('externo')}</a>
      </span>
    </div>
    ${bloqueSuelto(fuera, 'Comentarios sobre archivos que ya no están en la PR')}
    <nav class="indice" aria-label="Archivos de la PR">${archivos.map((a, k) => `<a href="#${idArchivo(k)}" data-saltar="${idArchivo(k)}"><span class="mono muy-tenue">${k + 1}</span><span class="ruta mono ${vistos.has(a.filename) ? 'visto' : ''}" title="${esc(a.filename)}"><bdi>${esc(a.filename)}</bdi></span><span class="mono"><span class="mas">+${a.additions}</span> <span class="menos">−${a.deletions}</span>${barrita(a.additions, a.deletions)}</span></a>`).join('')}</nav>
    ${archivos.map((a, k) => {
      const plegado = vistos.has(a.filename) || k >= plegarDesde;
      const propios = hallazgos.filter((h) => h.archivo === a.filename && h.linea);
      const cuerpo = a.patch !== undefined
        ? `<div class="codigo-diff"><table>${filasDiff(estado.lineasArchivo[k], propios, k, anclados[k])}</table></div>${a.recortado ? `<div class="aviso-diff">El resto de este archivo no viene en el tablero. <a href="${esc(pr.url)}/files" target="_blank" rel="noopener">Ver completo en GitHub</a>.</div>` : ''}`
        : `<div class="aviso-diff">${a.recortado ? 'La PR supera el tope de líneas que trae el tablero.' : 'GitHub no muestra el diff de este archivo (binario o demasiado grande).'} <a href="${esc(pr.url)}/files" target="_blank" rel="noopener">Ver en GitHub</a>.</div>`;
      return `<section class="archivo" id="${idArchivo(k)}" data-k="${k}" ${plegado ? 'data-plegado' : ''}>
        <div class="archivo-cab">
          <button class="plegar" data-plegar="${idArchivo(k)}" aria-label="Plegar o desplegar">${icono('chevron')}</button>
          <span class="estado">${ESTADO_ARCHIVO[a.status] ?? esc(a.status)}</span>
          <span class="ruta mono" title="${esc(a.filename)}">${a.previous_filename ? `${esc(a.previous_filename)} → ` : ''}${esc(a.filename)}</span>
          ${propios.length ? `<span class="senal ambar" title="Hallazgos en este archivo">${icono('alerta')}${propios.length}</span>` : ''}
          <span class="mono"><span class="mas">+${a.additions}</span> <span class="menos">−${a.deletions}</span></span>
          <label><input type="checkbox" data-visto="${esc(a.filename)}" ${vistos.has(a.filename) ? 'checked' : ''}> Visto</label>
        </div>
        ${bloqueSuelto(sueltos[k], 'Comentarios sobre líneas que cambiaron')}
        ${cuerpo}
      </section>`;
    }).join('')}
    ${barraPendiente(pr)}
  </div>`;
}

      ${API

// Mermaid se carga del CDN solo cuando hay un diagrama a la vista; sin red queda el texto del diagrama.
let mermaidListo = null;
function pintarDiagramas() {
  const nodos = $('detalle').querySelectorAll('pre.mermaid');
  if (!nodos.length) return;
  mermaidListo ??= new Promise((ok, falla) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
    s.onload = () => {
      const oscuro = getComputedStyle(document.documentElement).colorScheme === 'dark';
      window.mermaid.initialize({ startOnLoad: false, theme: oscuro ? 'dark' : 'neutral', securityLevel: 'strict' });
      ok(window.mermaid);
    };
    s.onerror = falla;
    document.head.appendChild(s);
  });
  mermaidListo.then((m) => m.run({ nodes: nodos })).catch(() => {});
}

// Últimos 30 días por modelo, frente a las respuestas marcadas como útiles: sirve para ver si la elección de modelo rinde.
function textoResumenCostos(r) {
  const filas = Object.entries(r?.modelos ?? {}).filter(([, m]) => m.trabajos);
  if (!filas.length) return '';
  return [`Últimos ${r.dias} días`, ...filas.map(([n, m]) => `${n}: ${plural(m.trabajos, 'trabajo', 'trabajos')}${m.fallidos ? ` (${m.fallidos} fallidos)` : ''} · ${usd(m.costo)}${m.utiles || m.noUtiles ? ` · útiles ${m.utiles} de ${m.utiles + m.noUtiles}` : ''}${m.costoPorUtil ? ` · ${usd(m.costoPorUtil)} por respuesta útil` : ''}`),
    ...(r.reintentos ? [`Reintentos y análisis repetidos: ${r.reintentos}`] : [])].join('\n');
}

function pintarBarra() {
  if (!API) return;
  const r = estado.ultimoRefresco;
  const gasto = estado.costoHoy?.trabajos ? `Gasto de IA hoy: ${usd(estado.costoHoy.total)} · ${plural(estado.costoHoy.trabajos, 'trabajo', 'trabajos')}` : '';
  const texto = estado.refrescando ? 'Consultando GitHub y git' : r && !r.ok ? 'La última actualización falló' : gasto;
  $('accionesBarra').innerHTML = `<span class="estado-texto" title="${esc(textoResumenCostos(estado.resumenCostos))}">${texto}</span>
    <button class="btn chico" data-accion="refrescar" ${estado.refrescando ? 'disabled' : ''} title="${esc(r && !r.ok ? r.mensaje : 'Vuelve a consultar GitHub y git: qué se mergeó, qué es nuevo y dónde está cada PR')}">${icono('actualizar', estado.refrescando ? 'girando' : '')} ${estado.refrescando ? 'Actualizando' : 'Actualizar estado'}</button>`;
}

async function api(ruta, cuerpo) {
  const r = await fetch(ruta, {
    method: cuerpo === undefined ? 'GET' : 'POST',
    headers: { 'X-PW-Token': API.token, 'Content-Type': 'application/json' },
    body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error ?? `HTTP ${r.status}`);
  return r.json();
}

let sondeo = null;
async function sondear() {
  clearTimeout(sondeo);
  try {
    const previo = new Map([...estado.trabajos].map(([k, t]) => [k, t.estado]));
    const eraRefresco = estado.refrescando;
    const e = await api('/api/estado');
    estado.trabajos = new Map(e.trabajos.map((t) => [t.id, t]));
    estado.refrescando = e.refrescando;
    estado.ultimoRefresco = e.ultimoRefresco;
    if (e.costoHoy?.trabajos !== estado.costoHoy?.trabajos) api('/api/costos').then((r) => { estado.resumenCostos = r; pintarBarra(); }).catch(() => {});
    estado.costoHoy = e.costoHoy;
    const marcas = e.comentarios ?? {};
    for (const [id, marca] of Object.entries(marcas)) {
      const pr = FOTO.prs.find((x) => x.id === id);
      if (pr && estado.marcasComentarios[id] !== marca && estado.comentariosCargados.has(id)) sincronizarComentarios(pr);
    }
    estado.marcasComentarios = marcas;
    const termino = e.trabajos.some((t) => t.estado === 'terminado' && previo.get(t.id) !== 'terminado') || (eraRefresco && !e.refrescando);
    if (termino) FOTO = await api('/api/foto');
    // Si la persona está escribiendo en el detalle, no se repinta: perdería el foco y el texto a medio escribir.
    pintarTodo({ detalle: !$('detalle').contains(document.activeElement) });
    const activo = e.refrescando || e.trabajos.some((t) => t.estado === 'en_cola' || t.estado === 'en_curso');
    if (activo) sondeo = setTimeout(sondear, 3000);
  } catch (err) {
    estado.ultimoRefresco = { ok: false, mensaje: `Sin conexión con el servidor local: ${err.message}. Vuelva a abrirlo con tablero_servir.` };
    pintarBarra();
  }
}

async function accionApi(ruta, cuerpo) {
  try { await api(ruta, cuerpo); } catch (err) { avisar(err.message); }
  sondear();
}

function pintarTodo({ detalle = true } = {}) {
  pintarBarra();
  pintarLateral();
  pintarCola();
  if (detalle) pintarDetalle();
}

function seleccionar(id, { enfocar = false } = {}) {
  if (estado.seleccion !== id) estado.seleccionLineas = null;
  estado.seleccion = id;
  history.replaceState(null, '', `#${encodeURIComponent(id)}/${estado.tab}`);
  document.body.dataset.vista = 'detalle';
  document.querySelectorAll('.fila').forEach((f) => f.setAttribute('aria-current', String(f.dataset.id === id)));
  pintarDetalle();
  $('detalle').scrollTop = 0;
  const fila = document.querySelector(`.fila[data-id="${CSS.escape(id)}"]`);
  if (fila) { fila.scrollIntoView({ block: 'nearest' }); if (enfocar) fila.focus(); }
}

function guardarRevision(pr, cambios) {
  const nueva = { ...(revision(pr) ?? {}), ...cambios, fecha: new Date().toISOString(), headSha: pr.headSha };
  const ok = almacen.escribir(claveRevision(pr), nueva);
  const g = $('guardado');
  if (g) g.textContent = ok ? `Guardado el ${new Date(nueva.fecha).toLocaleString('es-CO')}` : 'No se pudo guardar: el navegador bloquea el almacenamiento local.';
  pintarLateral();
  pintarCola();
}

function revisionesExportables() {
  return FOTO.prs.map((pr) => {
    const r = revision(pr);
    const pasos = almacen.leer(clavePasos(pr), []);
    const cs = comentarios(pr);
    if (!r && !pasos.length && !cs.length) return null;
    return { id: pr.id, repo: pr.repo, numero: pr.numero, titulo: pr.titulo, url: pr.url, headSha: pr.headSha, ...r, pasosProbados: pasos, comentarios: cs };
  }).filter(Boolean);
}

function exportar() {
  const datos = { proyecto: FOTO.proyecto, exportado: new Date().toISOString(), revisiones: revisionesExportables() };
  if (!datos.revisiones.length) return avisar('Todavía no hay decisiones, pasos marcados ni comentarios para exportar.');
  const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `revision-prs-${datos.exportado.slice(0, 10)}.json` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  avisar(`${plural(datos.revisiones.length, 'revisión exportada', 'revisiones exportadas')}.`);
}

function resumenTexto() {
  const notasDe = (r) => (r.comentarios ?? []).filter((c) => c.tipo === 'nota' && c.estado !== 'descartado');
  const rs = revisionesExportables().filter((r) => r.decision || notasDe(r).length);
  if (!rs.length) return 'Sin decisiones de revisión ni notas registradas.';
  const nota = (c) => `  · ${c.archivo}:${rangoTexto(c)} · ${c.texto.replace(/\s+/g, ' ')}${c.sugerido !== undefined ? `\n    Código sugerido:\n${c.sugerido.split('\n').map((l) => `      ${l}`).join('\n')}` : ''}`;
  return rs.map((r) => {
    const cab = `- ${r.repo}#${r.numero} ${r.titulo}${r.decision ? `: ${(DECISIONES[r.decision] ?? [r.decision])[0]}${r.nota ? `. ${r.nota.replace(/\s+/g, ' ')}` : ''}` : ''}\n  ${r.url}`;
    return [cab, ...notasDe(r).map(nota)].join('\n');
  }).join('\n');
}

function importar(archivo) {
  archivo.text().then((t) => {
    const datos = JSON.parse(t);
    let n = 0;
    for (const r of datos.revisiones ?? []) {
      const pr = FOTO.prs.find((p) => p.id === r.id);
      if (!pr) continue;
      const { pasosProbados, comentarios: cs, id, repo, numero, titulo, url, ...decision } = r;
      if (decision.decision) almacen.escribir(claveRevision(pr), decision);
      if (cs?.length) { escribirComentarios(pr, fusionarComentarios(comentarios(pr), cs)); sincronizarComentarios(pr); }
      if (pasosProbados?.length) almacen.escribir(clavePasos(pr, r.headSha), pasosProbados);
      n++;
    }
    pintarTodo();
    avisar(`${plural(n, 'revisión importada', 'revisiones importadas')}.`);
  }).catch(() => avisar('El archivo no es una revisión exportada desde este tablero.'));
}

const prSel = () => FOTO.prs.find((p) => p.id === estado.seleccion);

function repreguntar(pr, id) {
  const c = comentarios(pr).find((x) => x.id === id);
  if (!c) return;
  // La IA recibe el hilo completo desde el servidor; aquí solo se muestra un recordatorio corto.
  const r = c.respuesta.replace(/\s+/g, ' ');
  const resumen = r.length > 90 ? `${r.slice(0, 90)}…` : r;
  if (c.ambito === 'pr') {
    estado.respondeA = { id: c.id, ambito: 'pr', resumen };
    repintarDetalle();
    const caja = $('preguntaPr');
    if (!caja) return;
    if ($('preguntaPrSeccion')) $('preguntaPrSeccion').value = c.seccion ?? '';
    caja.scrollIntoView({ block: 'center' });
    return caja.focus();
  }
  editarComentario(pr, id);
  estado.caja = { ...cajaVacia('pregunta'), respondeA: c.id, resumenRespondeA: resumen };
  marcarSeleccion();
}

async function enviarRevision(pr, soloIds) {
  const pedidos = (soloIds ? comentarios(pr).filter((c) => soloIds.includes(c.id)) : borradores(pr)).filter((c) => c.tipo !== 'nota');
  const viejos = pedidos.filter((c) => deOtroCommit(pr, c));
  const ids = pedidos.filter((c) => !deOtroCommit(pr, c)).map((c) => c.id);
  if (viejos.length) avisar(`Sin enviar por ser de un commit anterior: ${plural(viejos.length, 'comentario', 'comentarios')}. Al editarlos se anclan al commit actual.`);
  if (!ids.length) return;
  try {
    await sincronizarComentarios(pr);
    await api('/api/enviar-revision', { id: pr.id, ids });
    escribirComentarios(pr, comentarios(pr).map((c) => (ids.includes(c.id) ? { ...c, estado: 'en_cola', actualizado: new Date().toISOString() } : c)));
    repintarDetalle();
    pintarCola();
  } catch (err) { avisar(err.message); }
  sondear();
}

function aplicarCola(oculta) {
  document.body.toggleAttribute('data-sin-cola', oculta);
  document.querySelector('[data-accion="cola"]').setAttribute('aria-pressed', String(!oculta));
}

function alternarCola() {
  const oculta = !document.body.hasAttribute('data-sin-cola');
  almacen.escribir('pw-revision:sin-cola', oculta);
  aplicarCola(oculta);
}

function aplicarLateral(oculto) {
  document.body.toggleAttribute('data-sin-lateral', oculto);
  document.querySelector('[data-accion="lateral"]').setAttribute('aria-pressed', String(!oculto));
}

function alternarLateral() {
  const oculto = !document.body.hasAttribute('data-sin-lateral');
  almacen.escribir('pw-revision:sin-lateral', oculto);
  aplicarLateral(oculto);
}

function avisar(texto) {
  const destino = $('guardado') ?? $('foto');
  const previo = destino.textContent;
  destino.textContent = texto;
  setTimeout(() => { if (destino.textContent === texto) destino.textContent = previo; }, 3500);
}

function copiar(boton, texto) {
  const original = boton.innerHTML;
  const fin = (t) => { boton.textContent = t; setTimeout(() => { boton.innerHTML = original; }, 1400); };
  (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject()).then(() => fin('Copiado'), () => fin('No se pudo copiar'));
}

document.addEventListener('click', (ev) => {
  if ($('barraSel') && !ev.target.closest('#barraSel') && window.getSelection()?.isCollapsed) cerrarBarraSel();
  const salto = ev.target.closest('a[data-saltar]');
  if (salto) { ev.preventDefault(); const a = $(salto.dataset.saltar); a.removeAttribute('data-plegado'); a.scrollIntoView({ block: 'start' }); return; }
  const ir = ev.target.closest('a[data-ir]');
  if (ir) { ev.preventDefault(); return seleccionar(ir.dataset.ir); }
  const casilla = ev.target.closest('[data-caja-sugerido]');
  if (casilla) { leerCaja(); estado.caja.conSugerido = casilla.checked; return marcarSeleccion(); }
  const nSel = ev.target.closest('.n-sel');
  if (nSel) return seleccionarLinea(nSel, ev.shiftKey);
  const t = ev.target.closest('button, a[data-tab-ir]');
  if (!t) return;
  const d = t.dataset;
  if (d.id) return seleccionar(d.id);
  if (d.grupoToggle) {
    estado.cerrados.has(d.grupoToggle) ? estado.cerrados.delete(d.grupoToggle) : estado.cerrados.add(d.grupoToggle);
    almacen.escribir('pw-revision:cerrados', [...estado.cerrados]);
    t.closest('.grupo').toggleAttribute('data-cerrado');
    t.setAttribute('aria-expanded', String(!estado.cerrados.has(d.grupoToggle)));
    return;
  }
  if (d.vista) { estado.vista = d.vista; return pintarTodo(); }
  if (d.portal !== undefined) { estado.portal = d.portal || null; return pintarTodo(); }
  if (d.filtro) { estado.filtros.has(d.filtro) ? estado.filtros.delete(d.filtro) : estado.filtros.add(d.filtro); return pintarTodo(); }
  if (d.rol) {
    estado.rol = d.rol;
    almacen.escribir('pw-revision:rol', estado.rol);
    document.querySelectorAll('[data-rol]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.rol === estado.rol)));
    return pintarTodo();
  }
  if (d.tab) { estado.tab = d.tab; history.replaceState(null, '', `#${encodeURIComponent(estado.seleccion)}/${estado.tab}`); return pintarDetalle(); }
  if (d.tabIr) { ev.preventDefault(); estado.tab = d.tabIr; return pintarDetalle(); }
  if (d.copiar) return copiar(t, d.copiar);
  if (d.accion === 'limpiar') { estado.filtros.clear(); estado.portal = null; $('buscar').value = ''; return pintarTodo(); }
  if (d.accion === 'volver') { document.body.dataset.vista = 'cola'; return; }
  if (d.accion === 'exportar') return exportar();
  if (d.accion === 'importar') return $('archivoRevision').click();
  if (d.accion === 'copiarResumen') return copiar(t, resumenTexto());
  if (d.plegar) return $(d.plegar).toggleAttribute('data-plegado');
  if (d.accion === 'lateral') return alternarLateral();
  if (d.accion === 'cola') return alternarCola();
  if (d.accion === 'preguntarPr') return preguntarPr(prSel());
  if (d.accion === 'quitarRespondeA') { estado.respondeA = null; return repintarDetalle(); }
  if (d.verMas) { estado.expandidas.has(d.verMas) ? estado.expandidas.delete(d.verMas) : estado.expandidas.add(d.verMas); return repintarDetalle(); }
  if (d.comInvestigar) return investigar(prSel(), d.comInvestigar);
  if (d.comValorar) return valorar(prSel(), d.comValorar, d.util === 'si');
  if (d.accion === 'agregarPreguntaPr') return preguntarPr(prSel(), undefined, undefined, { enviar: false });
  if (d.bsel || d.bselRapida !== undefined) return accionBarraSel(d.bsel, d.bselRapida === undefined ? undefined : Number(d.bselRapida));
  if (d.bselLineas) return abrirCajaDeSeleccion(d.bselLineas);
  if (d.ampliar) return preguntarPr(prSel(), d.ampliar, `Ampliar la sección «${SECCIONES[d.ampliar]}»: más detalle y ejemplos concretos tomados del diff.`);
  if (d.cajaTipo) { leerCaja(); estado.caja.tipo = d.cajaTipo; return marcarSeleccion(); }
  if (d.accion === 'cajaAgregar') return agregarComentario();
  if (d.accion === 'cajaCancelar') return cerrarCaja();
  if (d.comEditar) return editarComentario(prSel(), d.comEditar);
  if (d.comBorrar) { borrarComentarios(prSel(), [d.comBorrar]); repintarDetalle(); return pintarCola(); }
  if (d.accion === 'descartarBorradores') {
    if (!estado.confirmarDescarte) { estado.confirmarDescarte = true; return repintarDetalle(); }
    estado.confirmarDescarte = false;
    const pr = prSel();
    borrarComentarios(pr, borradores(pr).map((c) => c.id));
    repintarDetalle();
    return pintarCola();
  }
  if (d.accion === 'enviarRevision') return enviarRevision(prSel());
  if (d.comReintentar) return enviarRevision(prSel(), [d.comReintentar]);
  if (d.comRepreguntar) return repreguntar(prSel(), d.comRepreguntar);
  if (d.propAprobar) {
    if (estado.propuestas.get(d.propAprobar)?.conFallos && estado.confirmarAprobar !== d.propAprobar) { estado.confirmarAprobar = d.propAprobar; return repintarDetalle(); }
    t.disabled = true;
    return accionPropuesta('aprobar', d.propAprobar, { confirmarFallos: estado.confirmarAprobar === d.propAprobar });
  }
  if (d.propAjustar) { estado.ajustando = estado.ajustando === d.propAjustar ? null : d.propAjustar; repintarDetalle(); return $('ajusteTexto')?.focus({ preventScroll: true }); }
  if (d.propEnviarAjuste) {
    const indicacion = $('ajusteTexto')?.value.trim();
    if (!indicacion) return avisar('Escriba qué cambiar de la propuesta.');
    return accionPropuesta('ajustar', d.propEnviarAjuste, { indicacion });
  }
  if (d.propDescartar) return accionPropuesta('descartar', d.propDescartar);
  if (d.propRegenerar) return accionPropuesta('regenerar', d.propRegenerar);
  if (d.propCopiar) return copiar(t, estado.propuestas.get(d.propCopiar)?.patch ?? '');
  if (d.accion === 'enfoque') { document.body.toggleAttribute('data-enfoque'); return pintarDetalle(); }
  if (d.accion === 'plegarTodo') { document.querySelectorAll('.archivo').forEach((a) => a.setAttribute('data-plegado', '')); return; }
  if (d.accion === 'refrescar') { estado.refrescando = true; pintarBarra(); return accionApi('/api/refrescar', {}); }
  if (d.accion === 'analizar') {
    const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
    estado.trabajos.set(pr.id, { id: pr.id, estado: 'en_cola' });
    pintarTodo();
    return accionApi('/api/analizar', { prs: [{ repo: pr.repo, numero: pr.numero }] });
  }
  if (d.accion === 'pedirConfirmacion') { estado.confirmarPendientes = true; pintarLateral(); setTimeout(() => { estado.confirmarPendientes = false; pintarLateral(); }, 6000); return; }
  if (d.accion === 'analizarPendientes') {
    estado.confirmarPendientes = false;
    const prs = pendientesDeAnalisis().sort((a, b) => Number(b.seguridad) - Number(a.seguridad)).map((p) => ({ repo: p.repo, numero: p.numero }));
    return accionApi('/api/analizar', { prs });
  }
  if (d.accion === 'cancelarCola') return accionApi('/api/cancelar-cola', {});
});

document.addEventListener('change', (ev) => {
  if (ev.target.id === 'archivoRevision') {
    if (ev.target.files[0]) importar(ev.target.files[0]);
    ev.target.value = '';
    return;
  }
  const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
  if (!pr) return;
  if (ev.target.name === 'decision') return guardarRevision(pr, { decision: ev.target.value });
  if (ev.target.dataset.visto !== undefined) {
    const vistos = new Set(almacen.leer(claveVistos(pr), []));
    ev.target.checked ? vistos.add(ev.target.dataset.visto) : vistos.delete(ev.target.dataset.visto);
    almacen.escribir(claveVistos(pr), [...vistos]);
    const seccion = ev.target.closest('.archivo');
    if (ev.target.checked) seccion.setAttribute('data-plegado', ''); else seccion.removeAttribute('data-plegado');
    const scroll = $('detalle').scrollTop;
    pintarDetalle();
    $('detalle').scrollTop = scroll;
    return;
  }
  if (ev.target.dataset.accionDiff === 'ajustar') { almacen.escribir('pw-revision:ajustar', ev.target.checked); return pintarDetalle(); }
  if (ev.target.dataset.paso !== undefined) {
    const marcados = [...document.querySelectorAll('[data-paso]:checked')].map((x) => +x.dataset.paso);
    almacen.escribir(clavePasos(pr), marcados);
    pintarDetalle();
  }
});

let temporizadorNota;
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'buscar') return pintarCola();
  if (ev.target.id === 'notaRevision') {
    const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
    clearTimeout(temporizadorNota);
    temporizadorNota = setTimeout(() => guardarRevision(pr, { nota: ev.target.value }), 400);
  }
});

document.addEventListener('keydown', (ev) => {
  if ((ev.target.id === 'cajaTexto' || ev.target.id === 'cajaSugerido') && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); return agregarComentario(); }
  if (ev.target.id === 'preguntaPr' && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); return preguntarPr(prSel()); }
  if (ev.target.id === 'barraSelTexto' && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); return accionBarraSel('agregar'); }
  if (ev.key === 'Escape' && $('barraSel')) { ev.preventDefault(); return cerrarBarraSel(); }
  if (ev.target.matches('input, textarea, select')) {
    if (ev.key === 'Escape') ev.target.blur();
    return;
  }
  if (ev.key === 'Escape' && estado.seleccionLineas) { estado.seleccionLineas = null; return marcarSeleccion(); }
  if (ev.key === 'Escape' && document.body.hasAttribute('data-enfoque')) { document.body.removeAttribute('data-enfoque'); return pintarDetalle(); }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const filas = [...document.querySelectorAll('.grupo:not([data-cerrado]) .fila')];
  const i = filas.findIndex((f) => f.dataset.id === estado.seleccion);
  const ir = (f) => f && seleccionar(f.dataset.id, { enfocar: true });
  if (ev.key === 'j' || ev.key === 'ArrowDown') { ev.preventDefault(); ir(filas[i + 1] ?? filas[i]); }
  if (ev.key === 'k' || ev.key === 'ArrowUp') { ev.preventDefault(); ir(filas[Math.max(i - 1, 0)]); }
  if (ev.key === '/') { ev.preventDefault(); $('buscar').focus(); }
  if (ev.key === '[') { ev.preventDefault(); alternarLateral(); }
  if (ev.key === ']') { ev.preventDefault(); alternarCola(); }
  if (ev.key === 'o') { const pr = FOTO.prs.find((p) => p.id === estado.seleccion); if (pr) window.open(pr.url, '_blank', 'noopener'); }
});

$('titulo').textContent = `Revisión de PRs · ${FOTO.proyecto}`;
$('foto').textContent = `Datos de GitHub del ${new Date(FOTO.generado).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' })}`;
document.querySelectorAll('[data-rol]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.rol === estado.rol)));
aplicarLateral(almacen.leer('pw-revision:sin-lateral', false));
aplicarCola(almacen.leer('pw-revision:sin-cola', false));
estado.caja = cajaVacia();
const [inicial, tabInicial] = decodeURIComponent(location.hash.slice(1)).split('/');
if (CUERPOS[tabInicial]) estado.tab = tabInicial;
pintarTodo();
if (FOTO.prs.some((p) => p.id === inicial)) seleccionar(inicial);
if (API) sondear();
</script>

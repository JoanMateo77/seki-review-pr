<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de PRs</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --lateral: #f4f4f2; --hover: #efefec; --sel: #e9eef8;
  --linea: #e4e4e0; --linea-fuerte: #d3d3ce;
  --texto: #1d1f22; --texto-2: #5b5f66; --texto-3: #80848b;
  --acento: #2f5bd3; --acento-texto: #ffffff;
  --verde: #1f7a4a; --verde-bg: #e6f2eb; --ambar: #8f5b00; --ambar-bg: #f8eedb;
  --rojo: #b42318; --rojo-bg: #fbe9e7; --violeta: #6941c6; --violeta-bg: #efeafb; --gris-bg: #efefec;
  --sombra: 0 1px 2px rgba(20, 22, 26, .06), 0 4px 12px rgba(20, 22, 26, .04);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --panel: #1a1b1e; --lateral: #17181a; --hover: #222327; --sel: #1f2a40;
    --linea: #2a2b30; --linea-fuerte: #36383e;
    --texto: #e7e8ea; --texto-2: #a3a7ae; --texto-3: #7d818a;
    --acento: #7a9cff; --acento-texto: #0d1530;
    --verde: #5cc68c; --verde-bg: #15291e; --ambar: #e0b25c; --ambar-bg: #2e2412;
    --rojo: #ff8a7a; --rojo-bg: #351816; --violeta: #b49cff; --violeta-bg: #261e3d; --gris-bg: #232428;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141517; --panel: #1a1b1e; --lateral: #17181a; --hover: #222327; --sel: #1f2a40;
  --linea: #2a2b30; --linea-fuerte: #36383e;
  --texto: #e7e8ea; --texto-2: #a3a7ae; --texto-3: #7d818a;
  --acento: #7a9cff; --acento-texto: #0d1530;
  --verde: #5cc68c; --verde-bg: #15291e; --ambar: #e0b25c; --ambar-bg: #2e2412;
  --rojo: #ff8a7a; --rojo-bg: #351816; --violeta: #b49cff; --violeta-bg: #261e3d; --gris-bg: #232428;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--texto); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
::selection { background: var(--sel); color: var(--texto); }
* { scrollbar-width: thin; scrollbar-color: var(--linea-fuerte) transparent; }
a { color: var(--acento); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; border-radius: 4px; }
input[type=checkbox], input[type=radio] { accent-color: var(--acento); }
.mono { font-family: var(--mono); font-size: 12px; }
.tenue { color: var(--texto-2); }
.muy-tenue { color: var(--texto-3); }
svg.i { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }

/* Estructura: barra superior + lateral + cola + detalle */
.app { display: grid; grid-template-columns: 232px minmax(360px, 1fr) minmax(460px, 1.35fr); grid-template-rows: 48px 1fr; height: 100vh; }
.barra { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--linea); background: var(--panel); }
.btn-lateral { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-left: -6px; border: 0; border-radius: 6px; background: none; color: var(--texto-2); cursor: pointer; }
.btn-lateral:hover { background: var(--hover); color: var(--texto); }
.barra h1 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
.barra .foto { color: var(--texto-3); white-space: nowrap; }
.buscar { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
.buscar input { width: 100%; height: 30px; padding: 0 30px; border: 1px solid var(--linea); border-radius: 6px; background: var(--bg); }
.buscar input:hover { border-color: var(--linea-fuerte); }
.buscar svg { position: absolute; left: 9px; top: 8px; color: var(--texto-3); }
.buscar kbd { position: absolute; right: 8px; top: 6px; }
kbd { font: 12px/1.2 var(--mono); padding: 1px 5px; border: 1px solid var(--linea-fuerte); border-bottom-width: 2px; border-radius: 4px; color: var(--texto-2); background: var(--panel); }
.rol { display: inline-flex; border: 1px solid var(--linea); border-radius: 6px; padding: 2px; background: var(--bg); }
.rol button { border: 0; background: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; color: var(--texto-2); }
.rol button:hover { color: var(--texto); }
.rol button[aria-pressed="true"] { background: var(--panel); color: var(--texto); box-shadow: var(--sombra); }

.lateral { background: var(--lateral); border-right: 1px solid var(--linea); overflow: auto; padding: 12px 8px 24px; }
.lateral h2 { font-size: 12px; font-weight: 600; color: var(--texto-3); margin: 18px 8px 4px; }
.lateral h2:first-child { margin-top: 4px; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; text-align: left; color: var(--texto-2); }
.nav:hover { background: var(--hover); color: var(--texto); }
.nav[aria-pressed="true"] { background: var(--panel); color: var(--texto); box-shadow: var(--sombra); font-weight: 500; }
.nav .n { margin-left: auto; color: var(--texto-3); font-size: 12px; font-weight: 400; }
.punto { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--linea-fuerte); }
.punto.rojo { background: var(--rojo); } .punto.ambar { background: var(--ambar); } .punto.verde { background: var(--verde); } .punto.violeta { background: var(--violeta); }

/* Cola */
.cola { overflow: auto; border-right: 1px solid var(--linea); background: var(--panel); }
.grupo-cab { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 14px; background: var(--lateral); border: 0; border-bottom: 1px solid var(--linea); cursor: pointer; text-align: left; font-weight: 600; }
.grupo-cab:hover { background: var(--hover); }
.grupo-cab > span:nth-of-type(1) { white-space: nowrap; }
.grupo-cab .n { color: var(--texto-3); font-weight: 400; }
.grupo-cab .desc { flex: 1; color: var(--texto-3); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grupo-cab svg { color: var(--texto-3); transition: transform .15s ease-out; }
.grupo[data-cerrado] .grupo-cab svg { transform: rotate(-90deg); }
.grupo[data-cerrado] .filas { display: none; }
.fila { display: grid; grid-template-columns: 8px 92px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 6px 14px; border: 0; border-bottom: 1px solid var(--linea); background: none; cursor: pointer; text-align: left; }
.fila:hover { background: var(--hover); }
.fila[aria-current="true"] { background: var(--sel); }
.fila .id { color: var(--texto-3); white-space: nowrap; }
.fila .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .senales { display: flex; align-items: center; gap: 10px; color: var(--texto-3); font-size: 12px; white-space: nowrap; }
.senal { display: inline-flex; align-items: center; gap: 3px; }
.senal.rojo { color: var(--rojo); } .senal.ambar { color: var(--ambar); } .senal.verde { color: var(--verde); }
.vacio { padding: 48px 24px; text-align: center; color: var(--texto-2); }
.vacio p { max-width: 40ch; margin: 0 auto; }
.vacio button { margin-top: 12px; }

/* Detalle */
.detalle { overflow: auto; background: var(--bg); }
.det { max-width: 820px; padding: 20px 28px 56px; }
.det-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--texto-2); }
.det h2 { font-size: 20px; line-height: 1.35; font-weight: 600; margin: 10px 0 8px; text-wrap: balance; }
.mas { color: var(--verde); } .menos { color: var(--rojo); }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 18px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); cursor: pointer; text-decoration: none; color: var(--texto); white-space: nowrap; transition: background-color .15s ease-out; }
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.btn.primario { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
.btn.primario:hover { filter: brightness(1.08); background: var(--acento); }
.btn.chico { height: 26px; padding: 0 9px; font-size: 12px; }
.estado { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--gris-bg); color: var(--texto-2); }
.estado.verde { background: var(--verde-bg); color: var(--verde); } .estado.ambar { background: var(--ambar-bg); color: var(--ambar); }
.estado.rojo { background: var(--rojo-bg); color: var(--rojo); } .estado.violeta { background: var(--violeta-bg); color: var(--violeta); }

.checks { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); overflow: hidden; }
.check { display: grid; grid-template-columns: 16px 132px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 14px; border-bottom: 1px solid var(--linea); }
.check:last-child { border-bottom: 0; }
.check .icono { padding-top: 1px; color: var(--texto-3); }
.check .icono.verde { color: var(--verde); } .check .icono.ambar { color: var(--ambar); } .check .icono.rojo { color: var(--rojo); }
.check .nombre { color: var(--texto-2); }
.check .valor small { display: block; color: var(--texto-3); font-size: 12px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--linea); margin: 24px 0 18px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--texto-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--texto); }
.tab[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--acento); font-weight: 500; }
.tab .n { color: var(--texto-3); margin-left: 5px; font-weight: 400; }

.seccion { margin: 0 0 24px; }
.seccion h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
.seccion p { margin: 0; max-width: 72ch; }
.seccion ul, .seccion ol { margin: 0; padding-left: 20px; max-width: 72ch; }
.seccion li + li { margin-top: 4px; }
.lectura .mono { color: var(--texto); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--linea); }
th { font-weight: 500; color: var(--texto-3); font-size: 12px; }
.tabla { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); overflow: auto; }
.tabla tr:last-child td { border-bottom: 0; }
.codigo { display: block; margin-top: 4px; padding: 4px 6px; border-radius: 4px; background: var(--bg); font: 12px/1.4 var(--mono); color: var(--texto-2); overflow-wrap: anywhere; }
pre.mermaid { margin: 0; padding: 16px; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); overflow: auto; font: 12px var(--mono); color: var(--texto-2); }
.sin-dato { color: var(--texto-3); }
.nota-pie { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--linea); color: var(--texto-3); font-size: 12px; }

.pasos { list-style: none; padding: 0; margin: 0; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); }
.pasos li { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--linea); }
.pasos li:last-child { border-bottom: 0; }
.pasos input { margin-top: 3px; }
.pasos input:checked + label { color: var(--texto-3); text-decoration: line-through; }

.decision { display: flex; flex-wrap: wrap; gap: 8px; }
.decision label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); cursor: pointer; }
.decision label:hover { background: var(--hover); }
.decision label:has(input:checked) { border-color: var(--acento); background: var(--sel); }
textarea { width: 100%; min-height: 96px; padding: 8px 10px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); color: var(--texto); font: inherit; resize: vertical; }
.guardado { color: var(--texto-3); font-size: 12px; margin-top: 6px; min-height: 18px; }

.ayuda { margin: 22px 8px 0; color: var(--texto-3); font-size: 12px; display: grid; gap: 6px; }
.volver { display: none; }

.girando { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.senal.azul { color: var(--acento); }
.barra .acciones-barra { display: flex; align-items: center; gap: 8px; }
.barra .acciones-barra .estado-texto { color: var(--texto-3); white-space: nowrap; }
.btn[disabled] { opacity: .55; cursor: default; }
.cambio { display: grid; grid-template-columns: 92px 92px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--linea); }
.cambio .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cambio a { color: inherit; text-decoration: none; }
.cambio a:hover { text-decoration: underline; }

/* Diff */
body[data-enfoque] .app { grid-template-columns: 1fr; }
body[data-sin-lateral] .app { grid-template-columns: minmax(360px, 1fr) minmax(460px, 1.35fr); }
body[data-sin-lateral] .lateral { display: none; }
body[data-enfoque] .btn-lateral { display: none; }
body[data-enfoque] .lateral, body[data-enfoque] .cola { display: none; }
.det.ancho { max-width: none; }
.diff-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; color: var(--texto-2); }
.diff-barra label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.diff-barra .der { margin-left: auto; display: flex; gap: 8px; }
.indice { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); margin-bottom: 14px; }
.indice a { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 12px; color: var(--texto); text-decoration: none; border-bottom: 1px solid var(--linea); }
.indice a:last-child { border-bottom: 0; }
.indice a:hover { background: var(--hover); }
.indice .ruta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.indice .visto { color: var(--texto-3); text-decoration: line-through; }
.barrita { display: inline-flex; gap: 1px; margin-left: 6px; vertical-align: 1px; }
.barrita i { width: 7px; height: 7px; border-radius: 1px; background: var(--linea-fuerte); }
.barrita i.a { background: var(--verde); } .barrita i.d { background: var(--rojo); }
.archivo { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); margin-bottom: 14px; overflow: hidden; }
.archivo-cab { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--lateral); border-bottom: 1px solid var(--linea); }
.archivo-cab button.plegar { border: 0; background: none; padding: 0; cursor: pointer; color: var(--texto-3); display: inline-flex; }
.archivo[data-plegado] .archivo-cab button.plegar svg { transform: rotate(-90deg); }
.archivo[data-plegado] .codigo-diff, .archivo[data-plegado] .aviso-diff { display: none; }
.archivo-cab .ruta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.archivo-cab label { display: inline-flex; align-items: center; gap: 5px; color: var(--texto-2); cursor: pointer; white-space: nowrap; }
.codigo-diff { overflow-x: auto; }
.codigo-diff table { border-collapse: collapse; width: 100%; font: 12px/1.55 var(--mono); }
.codigo-diff td { padding: 0 10px; border: 0; vertical-align: top; }
.codigo-diff td.n { width: 1%; min-width: 44px; text-align: right; color: var(--texto-3); user-select: none; padding: 0 8px; }
.codigo-diff td.c { white-space: pre; }
.ajustar .codigo-diff td.c { white-space: pre-wrap; overflow-wrap: anywhere; }
.codigo-diff tr.add td { background: var(--verde-bg); } .codigo-diff tr.add td.n { color: var(--verde); }
.codigo-diff tr.del td { background: var(--rojo-bg); } .codigo-diff tr.del td.n { color: var(--rojo); }
.n-sel { all: unset; display: block; width: 100%; cursor: pointer; text-align: right; }
.n-sel:hover { color: var(--acento); }
.n-sel:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
.codigo-diff tr.sel td { background: var(--sel); }
.codigo-diff tr.sel td.n { box-shadow: inset 2px 0 0 var(--acento); }
.codigo-diff tr.sel td.n + td.n { box-shadow: none; }
.codigo-diff tr.caja td, .codigo-diff tr.hilo td { padding: 0; background: var(--panel); font-family: var(--sans); white-space: normal; }
.codigo-diff { container-type: inline-size; }
.caja-com, .hilo-com { position: sticky; left: 8px; box-sizing: border-box; width: min(720px, calc(100cqw - 110px)); margin: 6px 10px 8px 0; padding: 10px 12px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); }
.hilo-com { border-color: var(--linea); }
.caja-cab, .hilo-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
.tabs-caja { display: inline-flex; border: 1px solid var(--linea-fuerte); border-radius: 6px; overflow: hidden; }
.tabs-caja button { height: 24px; padding: 0 10px; border: 0; border-right: 1px solid var(--linea-fuerte); background: none; color: var(--texto-2); font-size: 12px; cursor: pointer; }
.tabs-caja button:last-child { border-right: 0; }
.tabs-caja button[aria-pressed="true"] { background: var(--sel); color: var(--texto); font-weight: 500; }
.tabs-caja button:disabled { color: var(--texto-3); cursor: not-allowed; }
.caja-com textarea { display: block; width: 100%; min-height: 64px; padding: 7px 9px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--bg); color: var(--texto); font: 13px/1.5 var(--sans); resize: vertical; }
.caja-com textarea.mono { font: 12px/1.55 var(--mono); white-space: pre; margin-top: 8px; }
.caja-com label { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; cursor: pointer; }
.caja-acciones { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.punto-estado { display: inline-flex; align-items: center; gap: 5px; color: var(--texto-2); font-size: 12px; }
.punto-estado::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--linea-fuerte); }
.punto-estado.azul::before { background: var(--acento); } .punto-estado.verde::before { background: var(--verde); }
.punto-estado.ambar::before { background: var(--ambar); } .punto-estado.rojo::before { background: var(--rojo); } .punto-estado.violeta::before { background: var(--violeta); }
.hilo-cab .der { margin-left: auto; display: inline-flex; gap: 4px; }
.btn-texto { border: 0; background: none; padding: 2px 6px; border-radius: 4px; color: var(--texto-2); font-size: 12px; cursor: pointer; }
.btn-texto:hover { background: var(--hover); color: var(--texto); }
.hilo-texto { white-space: pre-wrap; overflow-wrap: anywhere; }
.hilo-com pre.sugerido { margin: 8px 0 0; padding: 7px 9px; border-radius: 6px; background: var(--verde-bg); font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.hilo-respuesta { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--linea); white-space: pre-wrap; overflow-wrap: anywhere; }
.hilo-motivo { margin-top: 6px; color: var(--rojo); }
.desact { padding: 8px 14px 4px; border-bottom: 1px solid var(--linea); }
.desact table { width: 100%; border-collapse: collapse; }
.barra-pendiente { position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; padding: 10px 14px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); box-shadow: 0 -4px 12px rgb(0 0 0 / .06); }
.barra-pendiente .der { margin-left: auto; display: inline-flex; gap: 8px; }
.codigo-diff tr.hunk td { background: var(--sel); color: var(--texto-2); padding-top: 3px; padding-bottom: 3px; }
.codigo-diff td.c::before { display: inline-block; width: 1.2ch; color: var(--texto-3); }
.codigo-diff tr.add td.c::before { content: '+'; color: var(--verde); }
.codigo-diff tr.del td.c::before { content: '−'; color: var(--rojo); }
.codigo-diff tr.ctx td.c::before { content: ' '; }
.codigo-diff tr.nota td { padding: 6px 10px 8px; background: var(--panel); border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); font-family: var(--sans); white-space: normal; }
.aviso-diff { padding: 10px 14px; color: var(--texto-2); }

@media (max-width: 1180px) {
  .app { grid-template-columns: 200px minmax(320px, 1fr) minmax(400px, 1.2fr); }
  body[data-sin-lateral] .app { grid-template-columns: minmax(320px, 1fr) minmax(400px, 1.2fr); }

}
@media (max-width: 900px) {
  .app { display: block; height: auto; }
  .btn-lateral { display: none; }
  body[data-sin-lateral] .lateral { display: flex; }
  .barra { position: sticky; top: 0; z-index: 3; flex-wrap: wrap; height: auto; padding: 10px 16px; }
  .buscar { order: 3; flex-basis: 100%; max-width: none; margin: 0; }

  .cola { border-right: 0; }
  .detalle { display: none; }
  body[data-vista="detalle"] .cola, body[data-vista="detalle"] .lateral { display: none; }
  body[data-vista="detalle"] .detalle { display: block; }
  .det { padding: 16px; }
  .volver { display: inline-flex; margin-bottom: 10px; }
  .check { grid-template-columns: 16px minmax(0, 1fr); }
  .check .valor { grid-column: 2; }
  .fila { grid-template-columns: 8px minmax(0, 1fr); row-gap: 2px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

OWN-WORLD: neutros cálidos de herramienta, color solo para estado (verde listo, ámbar revisar, rojo bloquea, violeta mergeada), sans del sistema a 13 px, mono solo para ids, ramas y rutas.
STORY: el autor ve qué hacer hoy; el revisor entiende una PR, deja su decisión y la exporta como archivo.
FIRST VIEWPORT: lateral con vistas y conteos, cola agrupada con filas de una línea, detalle con pila de estados y pestañas.
FORM: bandeja de tres columnas (Linear, GitHub) y detalle tipo merge request (GitLab, Graphite); referencias de Mobbin.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<div class="app">

<script>
let FOTO = /*DATOS*/null;
// Con el servidor local (tablero_servir) llega { token } y aparecen las acciones; como archivo suelto es null.
const API = /*API*/null;
// Diffs por PR, ya recortados. En el servidor se piden a /api/diff si faltan.
const DIFFS = /*DIFFS*/null ?? {};

const GRUPOS = {
  pruebas_sin_prod: ['En pruebas, sin salir a producción', 'Código en pruebas que no aparece en producción ni en ninguna PR hacia producción'],
  solo_prod: ['Listo para producción', 'El código ya está en pruebas; falta mergear hacia producción'],
  revisar_diferencias: ['Revisar diferencias con pruebas', 'Pruebas tiene otra versión del cambio'],
  pruebas_abierta: ['Esperando merge en pruebas', 'Su PR hacia pruebas sigue abierta'],
  sin_pruebas: ['Sin pasar por pruebas', 'No hay PR hacia pruebas ni el código está allá'],
  hacia_pruebas: ['Hacia pruebas', 'PRs abiertas contra las ramas de pruebas'],
  pruebas_automaticas: ['Solo pruebas automáticas', 'No cambian el funcionamiento'],
  otra: ['Otras ramas', 'Base fuera de las líneas configuradas'],
  inactiva: ['Ramas que ya no se usan', 'Legado�, pagos-legado del checkout y main del back'],
};
const DECISIONES = {
  aprobada: ['Aprobada', 'verde'],
  probada: ['Probada en pruebas', 'verde'],
  duda: ['Con preguntas', 'ambar'],
  cambios: ['Pide cambios', 'rojo'],
};
const GRUPOS_REVISOR = {
  sin_revisar: ['Sin revisar', 'Aún sin decisión del revisor'],
  cambios: ['Pide cambios', 'El revisor dejó observaciones'],
  duda: ['Con preguntas', 'Falta una aclaración del autor'],
  aprobada: ['Aprobadas', 'Listas desde el punto de vista del revisor'],
  probada: ['Probadas en pruebas', 'Validadas funcionalmente'],
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icono = (nombre, clase = '') => `<svg class="i ${clase}" aria-hidden="true"><use href="#i-${nombre}"/></svg>`;
const almacen = {
  leer(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  escribir(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
const claveRevision = (pr) => `pw-revision:revision:${pr.id}`;
const clavePasos = (pr, sha = pr.headSha) => `pw-revision:probado:${pr.id}:${sha}`;
const revision = (pr) => almacen.leer(claveRevision(pr));
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const gh = (repo, n) => `https://github.com/${FOTO.owner}/${repo}/pull/${n}`;

const estado = {
  rol: almacen.leer('pw-revision:rol', 'autor'),
  vista: 'cola',
  seleccionLineas: null,
  lineasArchivo: [],
  archivosTab: [],
  caja: null,
  confirmarDescarte: false,
  comentariosCargados: new Set(),
  marcasComentarios: {},
  portal: null,
  filtros: new Set(),
  cerrados: new Set(almacen.leer('pw-revision:cerrados', ['pruebas_automaticas'])),
  seleccion: null,
  tab: 'resumen',
  trabajos: new Map(),
  refrescando: false,
  ultimoRefresco: null,
  confirmarPendientes: false,
};
const trabajo = (pr) => estado.trabajos.get(pr.id);
const usd = (n) => `USD ${n.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: n < 0.01 ? 4 : 2 })}`;
const nombreModelo = (m) => (m ?? '').replace(/^claude-/, '').replace(/-\d.*$/, '').replace(/^./, (c) => c.toUpperCase());
const costoTexto = (t) => `${t.modelo ? ` · ${nombreModelo(t.modelo)}` : ''}${t.costo ? ` · ${usd(t.costo)}` : ''}`;
const trabajoActivo = (pr) => ['en_cola', 'en_curso'].includes(trabajo(pr)?.estado);
const pendientesDeAnalisis = () => FOTO.prs.filter((p) => p.ambiente !== 'inactiva' && (!p.explicacion || p.explicacion.desactualizada) && !trabajoActivo(p));

// Un solo tono por PR, el más grave que aplique: rojo bloquea, ámbar pide mirar, verde listo, violeta mergeada.
function tono(pr) {
  const v = pr.verificaciones?.resumen ?? {};
  if (v.bloqueante || (pr.sinProd && pr.seguridad)) return 'rojo';
  if (pr.sinProd || v.alto || pr.estadoPruebas?.estado === 'parcial' || pr.explicacion?.riesgo === 'alto') return 'ambar';
  if (pr.estadoPr === 'MERGED') return 'violeta';
  if (pr.accion === 'solo_prod') return 'verde';
  return '';
}

const definicionGrupos = () => (estado.rol === 'revisor' ? GRUPOS_REVISOR : GRUPOS);
const grupoDe = (pr) => (estado.rol === 'revisor' ? revision(pr)?.decision ?? 'sin_revisar' : pr.accion);
const enVista = (pr) => (estado.vista === 'inactivas' ? pr.ambiente === 'inactiva' : pr.ambiente !== 'inactiva');

function pasaFiltros(pr) {
  if (!enVista(pr)) return false;
  if (estado.portal && pr.portal !== estado.portal) return false;
  const v = pr.verificaciones?.resumen ?? {};
  if (estado.filtros.has('seguridad') && !pr.seguridad) return false;
  if (estado.filtros.has('hallazgos') && !(v.bloqueante || v.alto)) return false;
  if (estado.filtros.has('sinExplicacion') && pr.explicacion && !pr.explicacion.desactualizada) return false;
  if (estado.filtros.has('sinRevisar') && revision(pr)) return false;
  const q = $('buscar').value.trim().toLowerCase();
  if (q) {
    const archivos = [...(pr.explicacion?.orden_lectura ?? []).map((o) => o.archivo), ...(pr.verificaciones?.hallazgos ?? []).map((h) => h.archivo)].join(' ');
    if (!`${pr.numero} #${pr.numero} ${pr.titulo} ${pr.rama} ${pr.repo} ${pr.portal} ${archivos}`.toLowerCase().includes(q)) return false;
  }
  return true;
}

function pintarLateral() {
  const base = FOTO.prs.filter(enVista);
  const portales = [...new Set(base.map((p) => p.portal))].sort();
  const cuenta = (fn) => base.filter(fn).length;
  const inactivas = FOTO.prs.filter((p) => p.ambiente === 'inactiva').length;
  const nav = (attrs, contenido, n, activo) => `<button class="nav" ${attrs} aria-pressed="${activo}">${contenido}<span class="n">${n}</span></button>`;
  const filtro = (clave, texto, n) => nav(`data-filtro="${clave}"`, texto, n, estado.filtros.has(clave));
  $('lateral').innerHTML = `
    <h2>Vistas</h2>
    ${nav('data-vista="cola"', 'Cola de trabajo', FOTO.prs.length - inactivas, estado.vista === 'cola')}
    ${nav('data-vista="inactivas"', 'Ramas que ya no se usan', inactivas, estado.vista === 'inactivas')}
    <h2>Portal</h2>
    ${nav('data-portal=""', 'Todos', base.length, !estado.portal)}
    ${portales.map((p) => nav(`data-portal="${esc(p)}"`, esc(p), cuenta((x) => x.portal === p), estado.portal === p)).join('')}
    <h2>Filtros</h2>
    ${filtro('hallazgos', `${icono('alerta')} Con hallazgos altos`, cuenta((x) => x.verificaciones?.resumen.bloqueante || x.verificaciones?.resumen.alto))}
    ${filtro('seguridad', `${icono('escudo')} Seguridad`, cuenta((x) => x.seguridad))}
    ${filtro('sinExplicacion', `${icono('circulo')} Sin explicación`, cuenta((x) => !x.explicacion || x.explicacion.desactualizada))}
    ${filtro('sinRevisar', `${icono('ojo')} Sin revisar`, cuenta((x) => !revision(x)))}
    ${API ? `<h2>Análisis con IA</h2>
      ${estado.confirmarPendientes
        ? nav('data-accion="analizarPendientes"', `${icono('chispa')} Confirmar: ${plural(pendientesDeAnalisis().length, 'PR', 'PRs')}`, '', true)
        : nav('data-accion="pedirConfirmacion"', `${icono('chispa')} Analizar las que no tienen explicación`, pendientesDeAnalisis().length, false)}
      ${[...estado.trabajos.values()].some((t) => t.estado === 'en_cola') ? nav('data-accion="cancelarCola"', `${icono('bloqueo')} Cancelar los que están en cola`, [...estado.trabajos.values()].filter((t) => t.estado === 'en_cola').length, false) : ''}` : ''}
    <div class="solo-escritorio">
      <h2>Revisión</h2>
      <button class="nav" data-accion="exportar">${icono('descargar')} Exportar revisión</button>
      <button class="nav" data-accion="importar">${icono('subir')} Importar revisión</button>
      <div class="ayuda"><span><kbd>j</kbd> <kbd>k</kbd> moverse en la cola</span><span><kbd>o</kbd> abrir en GitHub</span><span><kbd>/</kbd> buscar</span><span><kbd>[</kbd> menú lateral</span></div>
    </div>`;
}

function senales(pr) {
  const s = [];
  const v = pr.verificaciones?.resumen ?? {};
  if (v.bloqueante) s.push(`<span class="senal rojo" title="${plural(v.bloqueante, 'verificación bloqueante', 'verificaciones bloqueantes')}">${icono('bloqueo')}${v.bloqueante}</span>`);
  else if (v.alto) s.push(`<span class="senal ambar" title="${plural(v.alto, 'hallazgo alto', 'hallazgos altos')}">${icono('alerta')}${v.alto}</span>`);
  const r = revision(pr);
  if (r?.decision) {
    const [txt, cls] = DECISIONES[r.decision] ?? [r.decision, ''];
    s.push(`<span class="senal ${cls}" title="Revisor: ${esc(txt)}">${icono(cls === 'rojo' ? 'bloqueo' : cls === 'ambar' ? 'alerta' : 'ok')}</span>`);
  }
  const t = trabajo(pr);
  if (t?.estado === 'en_curso') s.push(`<span class="senal azul" title="Analizando con IA">${icono('actualizar', 'girando')}</span>`);
  else if (t?.estado === 'en_cola') s.push(`<span class="senal azul" title="En cola para analizar">${icono('reloj')}</span>`);
  else if (t?.estado === 'error') s.push(`<span class="senal rojo" title="El análisis falló">${icono('bloqueo')}</span>`);
  const cs = vivos(pr).length;
  if (cs) s.push(`<span class="senal" title="${plural(cs, 'comentario', 'comentarios')} en el diff">${icono('comentario')}${cs}</span>`);
  if (pr.seguridad) s.push(`<span class="senal" title="Seguridad">${icono('escudo')}</span>`);
  const esfuerzo = pr.explicacion?.esfuerzo ?? pr.esfuerzoTamano;
  if (esfuerzo) s.push(`<span title="Esfuerzo de revisión, de 1 a 5">E${esfuerzo}</span>`);
  s.push(`<span title="Días desde que se abrió">${pr.dias} d</span>`);
  return s.join('');
}

function pintarCola() {
  const prs = FOTO.prs.filter(pasaFiltros);
  if (!prs.length) {
    $('cola').innerHTML = `<div class="vacio"><p>Ninguna PR coincide con la búsqueda y los filtros activos.</p><button class="btn" data-accion="limpiar">Quitar filtros</button></div>`;
    return;
  }
  const defs = definicionGrupos();
  const orden = Object.keys(defs);
  const porGrupo = new Map();
  for (const pr of prs) {
    const g = grupoDe(pr);
    if (!porGrupo.has(g)) porGrupo.set(g, []);
    porGrupo.get(g).push(pr);
  }
  const posicion = (g) => (orden.includes(g) ? orden.indexOf(g) : 99);
  $('cola').innerHTML = seccionCambios() + [...porGrupo.keys()].sort((a, b) => posicion(a) - posicion(b)).map((g) => {
    const [nombre, desc] = defs[g] ?? GRUPOS[g] ?? [FOTO.acciones?.[g] ?? g, ''];
    const filas = porGrupo.get(g).sort((a, b) => a.repo.localeCompare(b.repo) || b.numero - a.numero);
    const cerrado = estado.cerrados.has(g);
    return `<section class="grupo" ${cerrado ? 'data-cerrado' : ''}>
      <button class="grupo-cab" data-grupo-toggle="${g}" aria-expanded="${!cerrado}">${icono('chevron')}<span>${esc(nombre)}</span><span class="n">${filas.length}</span><span class="desc">${esc(desc)}</span></button>
      <div class="filas">${filas.map((pr) => `
        <button class="fila" data-id="${esc(pr.id)}" aria-current="${estado.seleccion === pr.id}">
          <span class="punto ${tono(pr)}"></span>
          <span class="id mono">${esc(pr.repoEtiqueta)} #${pr.numero}</span>
          <span class="titulo" title="${esc(pr.titulo)}">${esc(pr.titulo)}</span>
          <span class="senales">${senales(pr)}</span>
        </button>`).join('')}</div>
    </section>`;
  }).join('');
}

function seccionCambios() {
  const c = FOTO.cambios;
  if (!c || estado.vista !== 'cola') return '';
  const fecha = (f) => new Date(f).toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' });
  const enlace = (x) => `<a href="${gh(x.repo, x.numero)}" target="_blank" rel="noopener" title="${esc(x.titulo)}">${esc(x.titulo)}</a>`;
  const fila = (etiqueta, color, x, extra = '') => `<div class="cambio"><span class="estado ${color}">${etiqueta}</span><span class="mono muy-tenue">${esc(x.repo.replace('core-', ''))} #${x.numero}</span><span class="titulo">${FOTO.prs.some((p) => p.id === x.id) ? `<a href="#" data-ir="${esc(x.id)}">${esc(x.titulo)}</a>` : enlace(x)}${extra}</span></div>`;
  const nombreGrupo = (g) => (GRUPOS[g] ?? [g])[0];
  const filas = [
    ...c.mergeadas.map((x) => fila('Mergeada', 'violeta', x, ` <span class="muy-tenue">en ${esc(x.base)}</span>`)),
    ...c.cerradas.map((x) => fila(x.estado === 'cerrada' ? 'Cerrada' : 'Salió', '', x)),
    ...c.nuevas.map((x) => fila('Nueva', 'verde', x)),
    ...c.movidas.map((x) => fila('Cambió', 'ambar', x, ` <span class="muy-tenue">${esc(nombreGrupo(x.de))} → ${esc(nombreGrupo(x.a))}</span>`)),
  ];
  const n = filas.length;
  const cerrado = estado.cerrados.has('_cambios');
  return `<section class="grupo" ${cerrado ? 'data-cerrado' : ''}>
    <button class="grupo-cab" data-grupo-toggle="_cambios" aria-expanded="${!cerrado}">${icono('chevron')}<span>Cambios detectados</span><span class="n">${n}</span><span class="desc">entre ${fecha(c.desde)} y ${fecha(c.hasta)}</span></button>
    <div class="filas">${filas.join('')}</div>
  </section>`;
}

function check(icon, color, nombre, valor, detalle = '') {
  return `<div class="check"><span class="icono ${color}">${icono(icon)}</span><span class="nombre">${nombre}</span><span class="valor">${valor}${detalle ? `<small>${detalle}</small>` : ''}</span></div>`;
}

function pilaEstados(pr) {
  const filas = [];
  const ep = pr.estadoPruebas;
  if (ep) {
    const metodo = ep.metodo === 'parche' ? 'Comprobado aplicando el cambio sobre la rama de pruebas' : 'Comparado archivo por archivo';
    const mapa = { en_pruebas: ['ok', 'verde', 'El código ya está en pruebas'], parcial: ['alerta', 'ambar', 'Pruebas tiene otra versión del cambio'], no_en_pruebas: ['circulo', '', 'Todavía no está en pruebas'] };
    const [i, c, t] = mapa[ep.estado] ?? ['circulo', '', ep.estado];
    filas.push(check(i, c, 'Pruebas', t, `${ep.iguales} de ${ep.total} archivos iguales${ep.conflicto ? ', con conflicto' : ''}. ${metodo}.`));
  }
  if (pr.estadoProd) {
    const det = `${pr.estadoProd.iguales} de ${pr.estadoProd.total} archivos iguales en producción`;
    filas.push(pr.sinProd
      ? check('bloqueo', pr.seguridad ? 'rojo' : 'ambar', 'Producción', 'Código no encontrado en producción y sin PR hacia producción', det)
      : check('ok', '', 'Producción', pr.cubiertaPor ? `La PR <a href="${gh(pr.repo, pr.cubiertaPor)}" target="_blank" rel="noopener">#${pr.cubiertaPor}</a> hacia producción trae los mismos archivos` : 'Sin alertas', det));
  }
  if (pr.gemela) {
    const txt = { MERGED: 'mergeada', OPEN: 'abierta', CLOSED: 'cerrada sin mergear' }[pr.gemela.estado] ?? pr.gemela.estado;
    filas.push(check(pr.gemela.estado === 'MERGED' ? 'merge' : 'circulo', pr.gemela.estado === 'MERGED' ? 'verde' : '', pr.ambiente === 'prod' ? 'PR hacia pruebas' : 'PR hacia producción',
      `<a href="${gh(pr.repo, pr.gemela.numero)}" target="_blank" rel="noopener">#${pr.gemela.numero}</a> ${txt}`, 'Encontrada por título; el estado de pruebas de arriba es la comprobación'));
  }
  if (pr.hermanas?.length) {
    const faltan = pr.hermanas.some((h) => !h.numero);
    filas.push(check(faltan ? 'alerta' : 'ok', faltan ? 'ambar' : 'verde', 'Otros portales',
      pr.hermanas.map((h) => (h.numero ? `${esc(h.portal)}: <a href="${gh(pr.repo, h.numero)}" target="_blank" rel="noopener">#${h.numero}</a>` : `${esc(h.portal)}: sin PR equivalente`)).join(' · '),
      faltan ? 'Confirmar si el cambio aplica también a ese portal' : ''));
  }
  const v = pr.verificaciones;
  if (v) {
    const r = v.resumen;
    const [i, c] = r.bloqueante ? ['bloqueo', 'rojo'] : r.alto ? ['alerta', 'ambar'] : ['ok', 'verde'];
    const partes = [r.bloqueante && plural(r.bloqueante, 'bloqueante', 'bloqueantes'), r.alto && plural(r.alto, 'alta', 'altas'), r.medio && plural(r.medio, 'media', 'medias'), r.aviso && plural(r.aviso, 'aviso', 'avisos')].filter(Boolean);
    filas.push(check(i, c, 'Verificaciones', partes.length ? partes.join(', ') : 'Sin hallazgos en las líneas agregadas', partes.length ? '<a href="#" data-tab-ir="verificaciones">Ver hallazgos</a>' : ''));
  }
  const tr = trabajo(pr);
  if (tr) {
    const hora = (f) => (f ? new Date(f).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) : '');
    const mapa = {
      en_cola: ['reloj', '', 'En cola para analizar', ''],
      en_curso: ['actualizar', '', 'Analizando la PR', `Desde las ${hora(tr.inicio)}. Suele tardar entre uno y tres minutos.`],
      terminado: ['ok', 'verde', 'Explicación generada', `A las ${hora(tr.fin)}${costoTexto(tr)}`],
      error: ['bloqueo', 'rojo', 'El análisis no se completó', esc(tr.mensaje ?? '')],
      cancelado: ['circulo', '', 'Análisis cancelado', ''],
    };
    const [i, c, txt, det] = mapa[tr.estado] ?? ['circulo', '', tr.estado, ''];
    filas.push(check(i, c, 'Análisis con IA', txt, det).replace('<svg class="i "', tr.estado === 'en_curso' ? '<svg class="i girando"' : '<svg class="i "'));
  }
  const rev = revision(pr);
  if (rev?.decision) {
    const [txt, cls] = DECISIONES[rev.decision] ?? [rev.decision, ''];
    const cambio = rev.headSha && rev.headSha !== pr.headSha ? ' · la PR cambió después de esta revisión' : '';
    filas.push(check(cls === 'rojo' ? 'bloqueo' : cls === 'ambar' ? 'alerta' : 'ok', cls, 'Revisor', esc(txt), `${esc(new Date(rev.fecha).toLocaleDateString('es-CO'))}${cambio}`));
  } else if (pr.revisionGithub) {
    filas.push(check('ojo', '', 'Revisión en GitHub', esc(pr.revisionGithub)));
  }
  return filas.length ? `<div class="checks">${filas.join('')}</div>` : '';
}

const ESTADO_ARCHIVO = { added: 'Agregado', removed: 'Eliminado', modified: 'Modificado', renamed: 'Renombrado', copied: 'Copiado', changed: 'Cambiado' };
const claveVistos = (pr) => `pw-revision:vistos:${pr.id}:${pr.headSha}`;
const idArchivo = (i) => `archivo-${i}`;

function barrita(a, d) {
  const total = a + d;
  if (!total) return '';
  const verdes = Math.round((a / total) * 5);
  return `<span class="barrita" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => `<i class="${i < verdes ? 'a' : 'd'}"></i>`).join('')}</span>`;
}

// Comentarios sobre líneas del diff. Preguntas y pedidos de cambio nacen como borradores y se envían
// juntos; las notas manuales se guardan al agregarlas y viajan en la revisión exportada.
const TIPOS_COMENTARIO = {
  pregunta: { nombre: 'Preguntar', etiqueta: 'Pregunta', ayuda: 'Qué se quiere entender de estas líneas' },
  cambio: { nombre: 'Pedir cambio', etiqueta: 'Pedido de cambio', ayuda: 'Cómo debe quedar este código' },
  nota: { nombre: 'Nota', etiqueta: 'Nota', ayuda: 'Comentario para el autor' },
};
const ESTADOS_COMENTARIO = {
  borrador: ['Borrador', ''], nota: ['Nota guardada', ''], en_cola: ['En cola', 'azul'], en_curso: ['En curso', 'azul'],
  respondido: ['Respondido', 'verde'], propuesta: ['Propuesta lista', 'ambar'], aprobado: ['Aprobado', 'violeta'],
  descartado: ['Descartado', ''], error: ['Error', 'rojo'],
};
const claveComentarios = (pr) => `pw-revision:comentarios:${pr.id}`;
const comentarios = (pr) => almacen.leer(claveComentarios(pr), []);
const vivos = (pr) => comentarios(pr).filter((c) => c.estado !== 'descartado');
const borradores = (pr) => comentarios(pr).filter((c) => c.estado === 'borrador');
const nuevoIdComentario = () => `c-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const rangoTexto = (c) => (c.desde === c.hasta ? `L${c.desde}` : `L${c.desde}–${c.hasta}`);
const cajaVacia = (tipo) => ({ tipo: tipo ?? (API ? 'pregunta' : 'nota'), texto: '', conSugerido: false, sugerido: null, editando: null });

function escribirComentarios(pr, lista) {
  if (!almacen.escribir(claveComentarios(pr), lista)) avisar('No se pudo guardar: el navegador bloquea el almacenamiento local.');
}

function guardarComentario(pr, c) {
  const nuevo = { ...c, actualizado: new Date().toISOString() };
  escribirComentarios(pr, [...comentarios(pr).filter((x) => x.id !== c.id), nuevo]);
  sincronizarComentarios(pr, [nuevo]);
}

function borrarComentarios(pr, ids) {
  escribirComentarios(pr, comentarios(pr).filter((x) => !ids.includes(x.id)));
  sincronizarComentarios(pr, [], ids);
}

// Junta comentarios por id; gana el de actualización más reciente, salvo que el servidor ya lo haya sacado
// de borrador o nota: eso no se revierte desde el navegador.
const DEL_NAVEGADOR = new Set(['borrador', 'nota']);
function fusionarComentarios(actuales, entrantes) {
  const porId = new Map(actuales.map((c) => [c.id, c]));
  for (const c of entrantes) {
    const previo = porId.get(c.id);
    if (previo && !DEL_NAVEGADOR.has(previo.estado) && DEL_NAVEGADOR.has(c.estado)) continue;
    if (!previo || (c.actualizado ?? '') > (previo.actualizado ?? '')) porId.set(c.id, c);
  }
  return [...porId.values()];
}

// Con el tablero servido, los comentarios también viven en disco: no se pierden y la IA los lee.
async function sincronizarComentarios(pr, cambios = [], borrados = []) {
  if (!API) return;
  try {
    const delServidor = cambios.length || borrados.length
      ? await api('/api/comentarios', { id: pr.id, comentarios: cambios, borrados })
      : await api(`/api/comentarios?id=${encodeURIComponent(pr.id)}`);
    const antes = JSON.stringify(comentarios(pr));
    escribirComentarios(pr, fusionarComentarios(comentarios(pr).filter((c) => !borrados.includes(c.id)), delServidor));
    estado.comentariosCargados.add(pr.id);
    if (JSON.stringify(comentarios(pr)) !== antes && estado.seleccion === pr.id && !$('detalle').contains(document.activeElement)) { repintarDetalle(); pintarCola(); }
  } catch (err) { avisar(`Los comentarios quedaron solo en este navegador: ${err.message}`); }
}

function leerCaja() {
  const t = $('cajaTexto');
  if (t) estado.caja.texto = t.value;
  const s = $('cajaSugerido');
  if (s) estado.caja.sugerido = s.value;
}

function cajaHtml(rango) {

       ${sugerible ? '' : ' <span class="muy-tenue">El código sugerido solo aplica a líneas nuevas o sin cambios</span>'}
       ${c.conSugerido && sugerible ? `<textarea id="cajaSugerido" class="mono" rows="${Math.min(14, rango.claves.length + 1)}" spellcheck="false" aria-label="Código sugerido">${esc(c.sugerido ?? rango.texto)}</textarea>` : ''}`

    <textarea id="cajaTexto" rows="3" placeholder="${TIPOS_COMENTARIO[c.tipo].ayuda}" aria-label="${TIPOS_COMENTARIO[c.tipo].ayuda}">${esc(c.texto)}</textarea>
    ${sugerido}
    <div class="caja-acciones">
      <button type="button" class="btn chico primario" data-accion="cajaAgregar">${c.editando ? 'Guardar cambios' : c.tipo === 'nota' ? 'Guardar nota' : 'Agregar a la revisión'}</button>
      <button type="button" class="btn chico" data-accion="cajaCancelar">Cancelar</button>
      <span class="muy-tenue">Ctrl + Enter</span>
    </div>
  </div></td></tr>`;
}

function hiloHtml(c) {
  const [txt, cls] = ESTADOS_COMENTARIO[c.estado] ?? [c.estado, ''];

      ${editable ? `<span class="der"><button type="button" class="btn-texto" data-com-editar="${esc(c.id)}">Editar</button><button type="button" class="btn-texto" data-com-borrar="${esc(c.id)}">Borrar</button></span>` : ''}</div>
    <div class="hilo-texto">${esc(c.texto)}</div>
    ${c.sugerido !== undefined ? `<pre class="sugerido" aria-label="Código sugerido">${esc(c.sugerido)}</pre>` : ''}
    ${c.respuesta ? `<div class="hilo-respuesta">${esc(c.respuesta)}</div>` : ''}
    ${c.estado === 'error' && c.motivo ? `<div class="hilo-motivo">${esc(c.motivo)}</div>` : ''}

function agregarComentario() {
  leerCaja();
  const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
  const rango = rangoSeleccion();
  const c = estado.caja;
  if (!pr || !rango) return;
  if (!c.texto.trim()) { avisar('Escriba el comentario antes de agregarlo.'); return $('cajaTexto')?.focus(); }
  const previo = c.editando ? comentarios(pr).find((x) => x.id === c.editando) : null;
  const conSugerido = c.tipo === 'nota' && c.conSugerido && rango.lado === 'nuevo';
  guardarComentario(pr, {
    ...(previo ?? { id: nuevoIdComentario(), creado: new Date().toISOString() }),
    tipo: c.tipo,
    estado: c.tipo === 'nota' ? 'nota' : 'borrador',
    archivo: estado.archivosTab[estado.seleccionLineas.archivo],
    lado: rango.lado, desde: rango.desde, hasta: rango.hasta, claves: rango.claves,
    textoOriginal: rango.texto,
    texto: c.texto.trim(),
    sugerido: conSugerido ? PWAnclaje.textoSugerido(c.sugerido ?? rango.texto) : undefined,
    headSha: pr.headSha,
  });
  cerrarCaja(c.tipo);
}

function cerrarCaja(tipo) {
  document.querySelectorAll('.codigo-diff tr.caja').forEach((f) => f.remove());
  estado.seleccionLineas = null;
  estado.caja = cajaVacia(tipo ?? estado.caja.tipo);
  repintarDetalle();
  pintarCola();
}

function repintarDetalle() {
  const y = $('detalle').scrollTop;
  pintarDetalle();
  $('detalle').scrollTop = y;
}

function editarComentario(pr, id) {
  const c = comentarios(pr).find((x) => x.id === id);
  const k = estado.archivosTab.indexOf(c?.archivo);
  if (!c || k < 0) return;
  const claves = c.claves?.length ? c.claves : [`${c.lado === 'viejo' ? 'v' : 'n'}${c.desde}`, `${c.lado === 'viejo' ? 'v' : 'n'}${c.hasta}`];
  estado.seleccionLineas = { archivo: k, claveA: claves[0], claveB: claves[claves.length - 1] };
  estado.caja = { tipo: c.tipo, texto: c.texto, conSugerido: c.sugerido !== undefined, sugerido: c.sugerido ?? null, editando: c.id };
  marcarSeleccion();
}

// Filas de un parche unificado con número de línea viejo y nuevo; los hallazgos se cuelgan bajo su línea nueva.
// k: índice del archivo en la pestaña, para ubicar la selección de líneas.
function filasDiff(lineas, hallazgos, k, hilos = new Map()) {
  const filas = [];
  const porLinea = new Map();
  for (const h of hallazgos) {
    if (!porLinea.has(h.linea)) porLinea.set(h.linea, []);
    porLinea.get(h.linea).push(h);
  }
  const color = { bloqueante: 'rojo', alto: 'ambar', medio: '', aviso: '' };
  const sel = estado.seleccionLineas?.archivo === k ? clavesSeleccion() : new Set();
  const num = (n, clave) => (n === null ? '<td class="n"></td>' : `<td class="n"><button class="n-sel" data-sel="${clave}" aria-label="Seleccionar línea ${n}">${n}</button></td>`);
  for (const l of lineas) {
    if (l.tipo === 'hunk') {
      filas.push(`<tr class="hunk"><td class="n"></td><td class="n"></td><td class="c">${esc(l.texto)}</td></tr>`);
      continue;
    }
    const clave = PWAnclaje.claveLinea(l);
    filas.push(`<tr class="${l.tipo}${sel.has(clave) ? ' sel' : ''}" data-clave="${clave}">${num(l.viejo, clave)}${num(l.nuevo, clave)}<td class="c">${esc(l.texto)}</td></tr>`);
    if (l.tipo !== 'del' && porLinea.has(l.nuevo)) {
      for (const x of porLinea.get(l.nuevo)) {
        filas.push(`<tr class="nota"><td class="n"></td><td class="n"></td><td><span class="estado ${color[x.severidad]}">${esc(x.severidad)}</span> <strong>${esc(x.titulo)}</strong> · <span class="tenue">${esc(x.mensaje)}</span></td></tr>`);
      }
    }
    for (const c of hilos.get(clave) ?? []) filas.push(hiloHtml(c));
  }
  return filas.join('');
}

// Selección de líneas del diff: clic marca una línea, Shift + clic extiende el rango dentro del mismo archivo.
function rangoSeleccion() {
  const s = estado.seleccionLineas;
  if (!s) return null;
  return PWAnclaje.normalizarRango(estado.lineasArchivo[s.archivo] ?? [], s.claveA, s.claveB);
}

const clavesSeleccion = () => new Set(rangoSeleccion()?.claves ?? []);

function marcarSeleccion() {
  leerCaja();
  document.querySelectorAll('.codigo-diff tr.sel').forEach((f) => f.classList.remove('sel'));
  document.querySelectorAll('.codigo-diff tr.caja').forEach((f) => f.remove());
  const s = estado.seleccionLineas;
  const rango = rangoSeleccion();
  if (!s || !rango) return;
  const tabla = document.querySelector(`#${idArchivo(s.archivo)} .codigo-diff`);
  if (!tabla) return;
  tabla.closest('.archivo').removeAttribute('data-plegado');
  let ultima = null;
  for (const clave of rango.claves) {
    const fila = tabla.querySelector(`tr[data-clave="${clave}"]`);
    fila?.classList.add('sel');
    ultima = fila ?? ultima;
  }
  ultima?.insertAdjacentHTML('afterend', cajaHtml(rango));
  const t = $('cajaTexto');
  if (t && document.activeElement?.id !== 'cajaSugerido') { t.focus({ preventScroll: true }); t.setSelectionRange(t.value.length, t.value.length); }
}

function seleccionarLinea(boton, extender) {
  const k = +boton.closest('.archivo').dataset.k;
  const clave = boton.dataset.sel;
  const previa = estado.seleccionLineas;
  const extiende = extender && previa?.archivo === k;
  if (!extiende && !estado.caja.editando) { leerCaja(); estado.caja = { ...cajaVacia(estado.caja.tipo), texto: estado.caja.texto }; }
  estado.seleccionLineas = extiende ? { ...previa, claveB: clave } : { archivo: k, claveA: clave, claveB: clave };
  marcarSeleccion();
}

function barraPendiente(pr) {
  const bs = borradores(pr);
  if (!bs.length) return '';
  const preguntas = bs.filter((c) => c.tipo === 'pregunta').length;
  const cambios = bs.filter((c) => c.tipo === 'cambio').length;
  const partes = [preguntas && plural(preguntas, 'pregunta', 'preguntas'), cambios && plural(cambios, 'pedido de cambio', 'pedidos de cambio')].filter(Boolean).join(' · ');
  return `<div class="barra-pendiente" role="region" aria-label="Revisión pendiente">
    <span><strong>Revisión pendiente (${bs.length})</strong> <span class="tenue">${partes}</span></span>
    <span class="der">
      <button type="button" class="btn chico primario" data-accion="enviarRevision" ${API ? '' : 'disabled title="Disponible con el tablero abierto desde Claude Code (tablero_servir)"'}>${icono('chispa')} Enviar revisión</button>
      <button type="button" class="btn chico" data-accion="descartarBorradores">${estado.confirmarDescarte ? `Confirmar: descartar ${plural(bs.length, 'borrador', 'borradores')}` : 'Descartar borradores'}</button>
    </span>
  </div>`;
}

function ordenarArchivos(pr, archivos) {
  const orden = (pr.explicacion?.orden_lectura ?? []).map((o) => o.archivo);
  const pos = (a) => { const i = orden.findIndex((o) => a.filename === o || a.filename.endsWith('/' + o) || o.endsWith(a.filename)); return i < 0 ? orden.length : i; };
  return archivos.map((a, i) => ({ ...a, i })).sort((a, b) => pos(a) - pos(b) || a.i - b.i);
}

let diffPendiente = null;
function tabArchivos(pr) {
  let archivos = DIFFS[pr.id];
  if (!archivos) {
    if (API) {
      if (diffPendiente !== pr.id) {
        diffPendiente = pr.id;
        api(`/api/diff?id=${encodeURIComponent(pr.id)}`).then((d) => { DIFFS[pr.id] = d; if (estado.seleccion === pr.id) pintarDetalle(); }, (e) => avisar(e.message)).finally(() => { diffPendiente = null; });
      }
      return '<p class="tenue">Cargando los cambios de GitHub.</p>';
    }
    return `<p class="tenue">Este tablero no trae el diff de esta PR. Véalo en <a href="${esc(pr.url)}/files" target="_blank" rel="noopener">GitHub</a> o regenere el tablero.</p>`;
  }
  archivos = ordenarArchivos(pr, archivos);
  estado.lineasArchivo = archivos.map((a) => (a.patch !== undefined ? PWAnclaje.lineasDePatch(a.patch) : []));
  estado.archivosTab = archivos.map((a) => a.filename);
  if (API && !estado.comentariosCargados.has(pr.id)) { estado.comentariosCargados.add(pr.id); sincronizarComentarios(pr); }
  const lista = vivos(pr);
  const anclados = archivos.map((_, k) => new Map());
  const sueltos = archivos.map(() => []);
  const fuera = [];
  for (const c of lista) {
    const k = estado.archivosTab.indexOf(c.archivo);
    if (k < 0) { fuera.push(c); continue; }
    const a = PWAnclaje.anclar(c, estado.lineasArchivo[k]);
    if (a.desactualizado) { sueltos[k].push(c); continue; }
    if (!anclados[k].has(a.claveFinal)) anclados[k].set(a.claveFinal, []);
    anclados[k].get(a.claveFinal).push(c);
  }
  const bloqueSuelto = (cs, titulo) => (cs.length ? `<div class="desact"><p class="muy-tenue">${titulo}</p><table>${cs.map(hiloHtml).join('')}</table></div>` : '');
  const vistos = new Set(almacen.leer(claveVistos(pr), []));
  const hallazgos = pr.verificaciones?.hallazgos ?? [];
  const ajustar = almacen.leer('pw-revision:ajustar', false);
  const totalA = archivos.reduce((n, a) => n + a.additions, 0);
  const totalD = archivos.reduce((n, a) => n + a.deletions, 0);
  const plegarDesde = totalA + totalD > 1200 ? 3 : 99;
  const ordenados = !!pr.explicacion?.orden_lectura?.length;
  return `<div class="${ajustar ? 'ajustar' : ''}">
    <div class="diff-barra">
      <span>${plural(archivos.length, 'archivo', 'archivos')} · <span class="mas">+${totalA}</span> <span class="menos">−${totalD}</span> · ${vistos.size} de ${archivos.length} vistos</span>
      ${ordenados ? '<span class="muy-tenue">En el orden de lectura de la explicación</span>' : ''}
      <span class="der">
        <label><input type="checkbox" data-accion-diff="ajustar" ${ajustar ? 'checked' : ''}> Ajustar líneas largas</label>
        <button class="btn chico" data-accion="plegarTodo">Plegar todo</button>
        <button class="btn chico" data-accion="enfoque" title="Esconde la cola y el lateral; Esc para volver">${document.body.hasAttribute('data-enfoque') ? 'Ver la cola' : 'Ampliar'}</button>
        <a class="btn chico" href="${esc(pr.url)}/files" target="_blank" rel="noopener">Ver en GitHub ${icono('externo')}</a>
      </span>
    </div>
    ${bloqueSuelto(fuera, 'Comentarios sobre archivos que ya no están en la PR')}
    <nav class="indice" aria-label="Archivos de la PR">${archivos.map((a, k) => `<a href="#${idArchivo(k)}" data-saltar="${idArchivo(k)}"><span class="mono muy-tenue">${k + 1}</span><span class="ruta mono ${vistos.has(a.filename) ? 'visto' : ''}" title="${esc(a.filename)}"><bdi>${esc(a.filename)}</bdi></span><span class="mono"><span class="mas">+${a.additions}</span> <span class="menos">−${a.deletions}</span>${barrita(a.additions, a.deletions)}</span></a>`).join('')}</nav>
    ${archivos.map((a, k) => {
      const plegado = vistos.has(a.filename) || k >= plegarDesde;
      const propios = hallazgos.filter((h) => h.archivo === a.filename && h.linea);
      const cuerpo = a.patch !== undefined
        ? `<div class="codigo-diff"><table>${filasDiff(estado.lineasArchivo[k], propios, k, anclados[k])}</table></div>${a.recortado ? `<div class="aviso-diff">El resto de este archivo no viene en el tablero. <a href="${esc(pr.url)}/files" target="_blank" rel="noopener">Ver completo en GitHub</a>.</div>` : ''}`
        : `<div class="aviso-diff">${a.recortado ? 'La PR supera el tope de líneas que trae el tablero.' : 'GitHub no muestra el diff de este archivo (binario o demasiado grande).'} <a href="${esc(pr.url)}/files" target="_blank" rel="noopener">Ver en GitHub</a>.</div>`;
      return `<section class="archivo" id="${idArchivo(k)}" data-k="${k}" ${plegado ? 'data-plegado' : ''}>
        <div class="archivo-cab">
          <button class="plegar" data-plegar="${idArchivo(k)}" aria-label="Plegar o desplegar">${icono('chevron')}</button>
          <span class="estado">${ESTADO_ARCHIVO[a.status] ?? esc(a.status)}</span>
          <span class="ruta mono" title="${esc(a.filename)}">${a.previous_filename ? `${esc(a.previous_filename)} → ` : ''}${esc(a.filename)}</span>
          ${propios.length ? `<span class="senal ambar" title="Hallazgos en este archivo">${icono('alerta')}${propios.length}</span>` : ''}
          <span class="mono"><span class="mas">+${a.additions}</span> <span class="menos">−${a.deletions}</span></span>
          <label><input type="checkbox" data-visto="${esc(a.filename)}" ${vistos.has(a.filename) ? 'checked' : ''}> Visto</label>
        </div>
        ${bloqueSuelto(sueltos[k], 'Comentarios sobre líneas que cambiaron')}
        ${cuerpo}
      </section>`;
    }).join('')}
    ${barraPendiente(pr)}
  </div>`;
}

const TABS = [
  ['resumen', 'Resumen', () => null],
  ['archivos', 'Archivos', (pr) => pr.archivos ?? DIFFS[pr.id]?.length ?? null],
  ['verificaciones', 'Verificaciones', (pr) => pr.verificaciones?.hallazgos.length || null],
  ['probar', 'Cómo probar', (pr) => pr.explicacion?.como_probar?.length || null],
  ['revision', 'Revisión', () => null],
];
const CUERPOS = { resumen: tabResumen, archivos: tabArchivos, verificaciones: tabVerificaciones, probar: tabProbar, revision: tabRevision };

function pintarDetalle() {
  leerCaja();
  const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
  if (!pr) {
    $('detalle').innerHTML = `<div class="vacio"><p>Seleccione una PR de la cola para ver dónde está, qué cambia y cómo probarla.</p></div>`;
    return;
  }
  const t = tono(pr);
  const [nombreGrupo] = definicionGrupos()[grupoDe(pr)] ?? GRUPOS[pr.accion] ?? [pr.accion];
  const etiqueta = pr.estadoPr === 'MERGED'
    ? `<span class="estado violeta">${icono('merge')} Mergeada en pruebas</span>`
    : `<span class="estado ${t}">${esc(nombreGrupo)}</span>`;
  $('detalle').innerHTML = `<article class="det ${estado.tab === 'archivos' ? 'ancho' : ''}">
    <button class="btn chico volver" data-accion="volver">${icono('flecha')} Cola</button>
    <div class="det-meta">${etiqueta}<span class="mono">${esc(pr.repo)} #${pr.numero}</span><span>${esc(pr.portal)}</span></div>
    <h2>${esc(pr.titulo)}</h2>
    <div class="det-meta">
      <span class="mono">${esc(pr.base)} ← ${esc(pr.rama)}</span>
      ${pr.adiciones !== undefined ? `<span class="mono"><span class="mas">+${pr.adiciones}</span> <span class="menos">−${pr.eliminaciones}</span> · ${plural(pr.archivos, 'archivo', 'archivos')}</span>` : ''}
      <span>${icono('reloj')} hace ${plural(pr.dias, 'día', 'días')}</span>
    </div>
    <div class="acciones">
      <a class="btn primario" href="${esc(pr.url)}" target="_blank" rel="noopener">Abrir en GitHub ${icono('externo')}</a>
      <button class="btn" data-copiar="/plannotator-review ${esc(pr.url)}">${icono('copiar')} Revisar línea por línea</button>
      ${API
        ? `<button class="btn" data-accion="analizar" ${trabajoActivo(pr) ? 'disabled' : ''}>${icono('chispa')} ${trabajoActivo(pr) ? 'Analizando' : pr.explicacion ? 'Volver a analizar con IA' : 'Analizar con IA'}</button>`
        : `<button class="btn" data-copiar="/pw-revision:revisar-prs explicar ${esc(pr.repo)}#${pr.numero}">${icono('copiar')} ${pr.explicacion ? 'Regenerar explicación' : 'Explicar'}</button>`}
    </div>
    ${pilaEstados(pr)}
    <div class="tabs" role="tablist">${TABS.map(([k, nombre, n]) => { const c = n(pr); return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${estado.tab === k}">${nombre}${c ? `<span class="n">${c}</span>` : ''}</button>`; }).join('')}</div>
    <div role="tabpanel">${CUERPOS[estado.tab](pr)}</div>
  </article>`;
  if (estado.tab === 'archivos') marcarSeleccion();
  pintarDiagramas();
}

// Mermaid se carga del CDN solo cuando hay un diagrama a la vista; sin red queda el texto del diagrama.
let mermaidListo = null;
function pintarDiagramas() {
  const nodos = $('detalle').querySelectorAll('pre.mermaid');
  if (!nodos.length) return;
  mermaidListo ??= new Promise((ok, falla) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
    s.onload = () => {
      const oscuro = getComputedStyle(document.documentElement).colorScheme === 'dark';
      window.mermaid.initialize({ startOnLoad: false, theme: oscuro ? 'dark' : 'neutral', securityLevel: 'strict' });
      ok(window.mermaid);
    };
    s.onerror = falla;
    document.head.appendChild(s);
  });
  mermaidListo.then((m) => m.run({ nodes: nodos })).catch(() => {});
}

function pintarBarra() {
  if (!API) return;
  const r = estado.ultimoRefresco;
  const gasto = estado.costoHoy?.trabajos ? `Gasto de IA hoy: ${usd(estado.costoHoy.total)} · ${plural(estado.costoHoy.trabajos, 'trabajo', 'trabajos')}` : '';
  const texto = estado.refrescando ? 'Consultando GitHub y git' : r && !r.ok ? 'La última actualización falló' : gasto;
  $('accionesBarra').innerHTML = `<span class="estado-texto">${texto}</span>
    <button class="btn chico" data-accion="refrescar" ${estado.refrescando ? 'disabled' : ''} title="${esc(r && !r.ok ? r.mensaje : 'Vuelve a consultar GitHub y git: qué se mergeó, qué es nuevo y dónde está cada PR')}">${icono('actualizar', estado.refrescando ? 'girando' : '')} ${estado.refrescando ? 'Actualizando' : 'Actualizar estado'}</button>`;
}

async function api(ruta, cuerpo) {
  const r = await fetch(ruta, {
    method: cuerpo === undefined ? 'GET' : 'POST',
    headers: { 'X-PW-Token': API.token, 'Content-Type': 'application/json' },
    body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error ?? `HTTP ${r.status}`);
  return r.json();
}

let sondeo = null;
async function sondear() {
  clearTimeout(sondeo);
  try {
    const previo = new Map([...estado.trabajos].map(([k, t]) => [k, t.estado]));
    const eraRefresco = estado.refrescando;
    const e = await api('/api/estado');
    estado.trabajos = new Map(e.trabajos.map((t) => [t.id, t]));
    estado.refrescando = e.refrescando;
    estado.ultimoRefresco = e.ultimoRefresco;
    estado.costoHoy = e.costoHoy;
    const marcas = e.comentarios ?? {};
    for (const [id, marca] of Object.entries(marcas)) {
      const pr = FOTO.prs.find((x) => x.id === id);
      if (pr && estado.marcasComentarios[id] !== marca && estado.comentariosCargados.has(id)) sincronizarComentarios(pr);
    }
    estado.marcasComentarios = marcas;
    const termino = e.trabajos.some((t) => t.estado === 'terminado' && previo.get(t.id) !== 'terminado') || (eraRefresco && !e.refrescando);
    if (termino) FOTO = await api('/api/foto');
    // Si la persona está escribiendo en el detalle, no se repinta: perdería el foco y el texto a medio escribir.
    pintarTodo({ detalle: !$('detalle').contains(document.activeElement) });
    const activo = e.refrescando || e.trabajos.some((t) => t.estado === 'en_cola' || t.estado === 'en_curso');
    if (activo) sondeo = setTimeout(sondear, 3000);
  } catch (err) {
    estado.ultimoRefresco = { ok: false, mensaje: `Sin conexión con el servidor local: ${err.message}. Vuelva a abrirlo con tablero_servir.` };
    pintarBarra();
  }
}

async function accionApi(ruta, cuerpo) {
  try { await api(ruta, cuerpo); } catch (err) { avisar(err.message); }
  sondear();
}

function pintarTodo({ detalle = true } = {}) {
  pintarBarra();
  pintarLateral();
  pintarCola();
  if (detalle) pintarDetalle();
}

function seleccionar(id, { enfocar = false } = {}) {
  if (estado.seleccion !== id) estado.seleccionLineas = null;
  estado.seleccion = id;
  history.replaceState(null, '', `#${encodeURIComponent(id)}/${estado.tab}`);
  document.body.dataset.vista = 'detalle';
  document.querySelectorAll('.fila').forEach((f) => f.setAttribute('aria-current', String(f.dataset.id === id)));
  pintarDetalle();
  $('detalle').scrollTop = 0;
  const fila = document.querySelector(`.fila[data-id="${CSS.escape(id)}"]`);
  if (fila) { fila.scrollIntoView({ block: 'nearest' }); if (enfocar) fila.focus(); }
}

function guardarRevision(pr, cambios) {
  const nueva = { ...(revision(pr) ?? {}), ...cambios, fecha: new Date().toISOString(), headSha: pr.headSha };
  const ok = almacen.escribir(claveRevision(pr), nueva);
  const g = $('guardado');
  if (g) g.textContent = ok ? `Guardado el ${new Date(nueva.fecha).toLocaleString('es-CO')}` : 'No se pudo guardar: el navegador bloquea el almacenamiento local.';
  pintarLateral();
  pintarCola();
}

function revisionesExportables() {
  return FOTO.prs.map((pr) => {
    const r = revision(pr);
    const pasos = almacen.leer(clavePasos(pr), []);
    const cs = comentarios(pr);
    if (!r && !pasos.length && !cs.length) return null;
    return { id: pr.id, repo: pr.repo, numero: pr.numero, titulo: pr.titulo, url: pr.url, headSha: pr.headSha, ...r, pasosProbados: pasos, comentarios: cs };
  }).filter(Boolean);
}

function exportar() {
  const datos = { proyecto: FOTO.proyecto, exportado: new Date().toISOString(), revisiones: revisionesExportables() };
  if (!datos.revisiones.length) return avisar('Todavía no hay decisiones, pasos marcados ni comentarios para exportar.');
  const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `revision-prs-${datos.exportado.slice(0, 10)}.json` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  avisar(`${plural(datos.revisiones.length, 'revisión exportada', 'revisiones exportadas')}.`);
}

function resumenTexto() {
  const notasDe = (r) => (r.comentarios ?? []).filter((c) => c.tipo === 'nota' && c.estado !== 'descartado');
  const rs = revisionesExportables().filter((r) => r.decision || notasDe(r).length);
  if (!rs.length) return 'Sin decisiones de revisión ni notas registradas.';
  const nota = (c) => `  · ${c.archivo}:${rangoTexto(c)} · ${c.texto.replace(/\s+/g, ' ')}${c.sugerido !== undefined ? `\n    Código sugerido:\n${c.sugerido.split('\n').map((l) => `      ${l}`).join('\n')}` : ''}`;
  return rs.map((r) => {
    const cab = `- ${r.repo}#${r.numero} ${r.titulo}${r.decision ? `: ${(DECISIONES[r.decision] ?? [r.decision])[0]}${r.nota ? `. ${r.nota.replace(/\s+/g, ' ')}` : ''}` : ''}\n  ${r.url}`;
    return [cab, ...notasDe(r).map(nota)].join('\n');
  }).join('\n');
}

function importar(archivo) {
  archivo.text().then((t) => {
    const datos = JSON.parse(t);
    let n = 0;
    for (const r of datos.revisiones ?? []) {
      const pr = FOTO.prs.find((p) => p.id === r.id);
      if (!pr) continue;
      const { pasosProbados, comentarios: cs, id, repo, numero, titulo, url, ...decision } = r;
      if (decision.decision) almacen.escribir(claveRevision(pr), decision);
      if (cs?.length) escribirComentarios(pr, fusionarComentarios(comentarios(pr), cs));
      if (pasosProbados?.length) almacen.escribir(clavePasos(pr, r.headSha), pasosProbados);
      n++;
    }
    pintarTodo();
    avisar(`${plural(n, 'revisión importada', 'revisiones importadas')}.`);
  }).catch(() => avisar('El archivo no es una revisión exportada desde este tablero.'));
}

const prSel = () => FOTO.prs.find((p) => p.id === estado.seleccion);

async function enviarRevision(pr) {
  const ids = borradores(pr).map((c) => c.id);
  if (!ids.length) return;
  try {
    await api('/api/enviar-revision', { id: pr.id, ids });
    escribirComentarios(pr, comentarios(pr).map((c) => (ids.includes(c.id) ? { ...c, estado: 'en_cola', actualizado: new Date().toISOString() } : c)));
    repintarDetalle();
    pintarCola();
  } catch (err) { avisar(err.message); }
  sondear();
}

function aplicarLateral(oculto) {
  document.body.toggleAttribute('data-sin-lateral', oculto);
  document.querySelector('[data-accion="lateral"]').setAttribute('aria-pressed', String(!oculto));
}

function alternarLateral() {
  const oculto = !document.body.hasAttribute('data-sin-lateral');
  almacen.escribir('pw-revision:sin-lateral', oculto);
  aplicarLateral(oculto);
}

function avisar(texto) {
  const destino = $('guardado') ?? $('foto');
  const previo = destino.textContent;
  destino.textContent = texto;
  setTimeout(() => { if (destino.textContent === texto) destino.textContent = previo; }, 3500);
}

function copiar(boton, texto) {
  const original = boton.innerHTML;
  const fin = (t) => { boton.textContent = t; setTimeout(() => { boton.innerHTML = original; }, 1400); };
  (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject()).then(() => fin('Copiado'), () => fin('No se pudo copiar'));
}

document.addEventListener('click', (ev) => {
  const salto = ev.target.closest('a[data-saltar]');
  if (salto) { ev.preventDefault(); const a = $(salto.dataset.saltar); a.removeAttribute('data-plegado'); a.scrollIntoView({ block: 'start' }); return; }
  const ir = ev.target.closest('a[data-ir]');
  if (ir) { ev.preventDefault(); return seleccionar(ir.dataset.ir); }
  const casilla = ev.target.closest('[data-caja-sugerido]');
  if (casilla) { leerCaja(); estado.caja.conSugerido = casilla.checked; return marcarSeleccion(); }
  const nSel = ev.target.closest('.n-sel');
  if (nSel) return seleccionarLinea(nSel, ev.shiftKey);
  const t = ev.target.closest('button, a[data-tab-ir]');
  if (!t) return;
  const d = t.dataset;
  if (d.id) return seleccionar(d.id);
  if (d.grupoToggle) {
    estado.cerrados.has(d.grupoToggle) ? estado.cerrados.delete(d.grupoToggle) : estado.cerrados.add(d.grupoToggle);
    almacen.escribir('pw-revision:cerrados', [...estado.cerrados]);
    t.closest('.grupo').toggleAttribute('data-cerrado');
    t.setAttribute('aria-expanded', String(!estado.cerrados.has(d.grupoToggle)));
    return;
  }
  if (d.vista) { estado.vista = d.vista; return pintarTodo(); }
  if (d.portal !== undefined) { estado.portal = d.portal || null; return pintarTodo(); }
  if (d.filtro) { estado.filtros.has(d.filtro) ? estado.filtros.delete(d.filtro) : estado.filtros.add(d.filtro); return pintarTodo(); }
  if (d.rol) {
    estado.rol = d.rol;
    almacen.escribir('pw-revision:rol', estado.rol);
    document.querySelectorAll('[data-rol]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.rol === estado.rol)));
    return pintarTodo();
  }
  if (d.tab) { estado.tab = d.tab; history.replaceState(null, '', `#${encodeURIComponent(estado.seleccion)}/${estado.tab}`); return pintarDetalle(); }
  if (d.tabIr) { ev.preventDefault(); estado.tab = d.tabIr; return pintarDetalle(); }
  if (d.copiar) return copiar(t, d.copiar);
  if (d.accion === 'limpiar') { estado.filtros.clear(); estado.portal = null; $('buscar').value = ''; return pintarTodo(); }
  if (d.accion === 'volver') { document.body.dataset.vista = 'cola'; return; }
  if (d.accion === 'exportar') return exportar();
  if (d.accion === 'importar') return $('archivoRevision').click();
  if (d.accion === 'copiarResumen') return copiar(t, resumenTexto());
  if (d.plegar) return $(d.plegar).toggleAttribute('data-plegado');
  if (d.accion === 'lateral') return alternarLateral();
  if (d.cajaTipo) { leerCaja(); estado.caja.tipo = d.cajaTipo; return marcarSeleccion(); }
  if (d.accion === 'cajaAgregar') return agregarComentario();
  if (d.accion === 'cajaCancelar') return cerrarCaja();
  if (d.comEditar) return editarComentario(prSel(), d.comEditar);
  if (d.comBorrar) { borrarComentarios(prSel(), [d.comBorrar]); repintarDetalle(); return pintarCola(); }
  if (d.accion === 'descartarBorradores') {
    if (!estado.confirmarDescarte) { estado.confirmarDescarte = true; return repintarDetalle(); }
    estado.confirmarDescarte = false;
    const pr = prSel();
    borrarComentarios(pr, borradores(pr).map((c) => c.id));
    repintarDetalle();
    return pintarCola();
  }
  if (d.accion === 'enviarRevision') return enviarRevision(prSel());
  if (d.accion === 'enfoque') { document.body.toggleAttribute('data-enfoque'); return pintarDetalle(); }
  if (d.accion === 'plegarTodo') { document.querySelectorAll('.archivo').forEach((a) => a.setAttribute('data-plegado', '')); return; }
  if (d.accion === 'refrescar') { estado.refrescando = true; pintarBarra(); return accionApi('/api/refrescar', {}); }
  if (d.accion === 'analizar') {
    const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
    estado.trabajos.set(pr.id, { id: pr.id, estado: 'en_cola' });
    pintarTodo();
    return accionApi('/api/analizar', { prs: [{ repo: pr.repo, numero: pr.numero }] });
  }
  if (d.accion === 'pedirConfirmacion') { estado.confirmarPendientes = true; pintarLateral(); setTimeout(() => { estado.confirmarPendientes = false; pintarLateral(); }, 6000); return; }
  if (d.accion === 'analizarPendientes') {
    estado.confirmarPendientes = false;
    const prs = pendientesDeAnalisis().sort((a, b) => Number(b.seguridad) - Number(a.seguridad)).map((p) => ({ repo: p.repo, numero: p.numero }));
    return accionApi('/api/analizar', { prs });
  }
  if (d.accion === 'cancelarCola') return accionApi('/api/cancelar-cola', {});
});

document.addEventListener('change', (ev) => {
  if (ev.target.id === 'archivoRevision') {
    if (ev.target.files[0]) importar(ev.target.files[0]);
    ev.target.value = '';
    return;
  }
  const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
  if (!pr) return;
  if (ev.target.name === 'decision') return guardarRevision(pr, { decision: ev.target.value });
  if (ev.target.dataset.visto !== undefined) {
    const vistos = new Set(almacen.leer(claveVistos(pr), []));
    ev.target.checked ? vistos.add(ev.target.dataset.visto) : vistos.delete(ev.target.dataset.visto);
    almacen.escribir(claveVistos(pr), [...vistos]);
    const seccion = ev.target.closest('.archivo');
    if (ev.target.checked) seccion.setAttribute('data-plegado', ''); else seccion.removeAttribute('data-plegado');
    const scroll = $('detalle').scrollTop;
    pintarDetalle();
    $('detalle').scrollTop = scroll;
    return;
  }
  if (ev.target.dataset.accionDiff === 'ajustar') { almacen.escribir('pw-revision:ajustar', ev.target.checked); return pintarDetalle(); }
  if (ev.target.dataset.paso !== undefined) {
    const marcados = [...document.querySelectorAll('[data-paso]:checked')].map((x) => +x.dataset.paso);
    almacen.escribir(clavePasos(pr), marcados);
    pintarDetalle();
  }
});

let temporizadorNota;
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'buscar') return pintarCola();
  if (ev.target.id === 'notaRevision') {
    const pr = FOTO.prs.find((p) => p.id === estado.seleccion);
    clearTimeout(temporizadorNota);
    temporizadorNota = setTimeout(() => guardarRevision(pr, { nota: ev.target.value }), 400);
  }
});

document.addEventListener('keydown', (ev) => {
  if ((ev.target.id === 'cajaTexto' || ev.target.id === 'cajaSugerido') && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); return agregarComentario(); }
  if (ev.target.matches('input, textarea, select')) {
    if (ev.key === 'Escape') ev.target.blur();
    return;
  }
  if (ev.key === 'Escape' && estado.seleccionLineas) { estado.seleccionLineas = null; return marcarSeleccion(); }
  if (ev.key === 'Escape' && document.body.hasAttribute('data-enfoque')) { document.body.removeAttribute('data-enfoque'); return pintarDetalle(); }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const filas = [...document.querySelectorAll('.grupo:not([data-cerrado]) .fila')];
  const i = filas.findIndex((f) => f.dataset.id === estado.seleccion);
  const ir = (f) => f && seleccionar(f.dataset.id, { enfocar: true });
  if (ev.key === 'j' || ev.key === 'ArrowDown') { ev.preventDefault(); ir(filas[i + 1] ?? filas[i]); }
  if (ev.key === 'k' || ev.key === 'ArrowUp') { ev.preventDefault(); ir(filas[Math.max(i - 1, 0)]); }
  if (ev.key === '/') { ev.preventDefault(); $('buscar').focus(); }
  if (ev.key === '[') { ev.preventDefault(); alternarLateral(); }
  if (ev.key === 'o') { const pr = FOTO.prs.find((p) => p.id === estado.seleccion); if (pr) window.open(pr.url, '_blank', 'noopener'); }
});

$('titulo').textContent = `Revisión de PRs · ${FOTO.proyecto}`;
$('foto').textContent = `Datos de GitHub del ${new Date(FOTO.generado).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' })}`;
document.querySelectorAll('[data-rol]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.rol === estado.rol)));
aplicarLateral(almacen.leer('pw-revision:sin-lateral', false));
estado.caja = cajaVacia();
const [inicial, tabInicial] = decodeURIComponent(location.hash.slice(1)).split('/');
if (CUERPOS[tabInicial]) estado.tab = tabInicial;
pintarTodo();
if (FOTO.prs.some((p) => p.id === inicial)) seleccionar(inicial);
if (API) sondear();
</script>

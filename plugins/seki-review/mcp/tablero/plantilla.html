<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seki Review</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --lateral: #f4f4f2; --hover: #efefec; --sel: #e9eef8;
  --linea: #e4e4e0; --linea-fuerte: #d3d3ce;
  --texto: #1d1f22; --texto-2: #5b5f66; --texto-3: #80848b;
  --acento: #2f5bd3; --acento-texto: #ffffff;
  --verde: #1f7a4a; --verde-bg: #e6f2eb; --ambar: #8f5b00; --ambar-bg: #f8eedb;
  --rojo: #b42318; --rojo-bg: #fbe9e7; --violeta: #6941c6; --violeta-bg: #efeafb; --gris-bg: #efefec;
  --sombra: 0 1px 2px rgba(20, 22, 26, .06), 0 4px 12px rgba(20, 22, 26, .04);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --panel: #1a1b1e; --lateral: #17181a; --hover: #222327; --sel: #1f2a40;
    --linea: #2a2b30; --linea-fuerte: #36383e;
    --texto: #e7e8ea; --texto-2: #a3a7ae; --texto-3: #7d818a;
    --acento: #7a9cff; --acento-texto: #0d1530;
    --verde: #5cc68c; --verde-bg: #15291e; --ambar: #e0b25c; --ambar-bg: #2e2412;
    --rojo: #ff8a7a; --rojo-bg: #351816; --violeta: #b49cff; --violeta-bg: #261e3d; --gris-bg: #232428;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141517; --panel: #1a1b1e; --lateral: #17181a; --hover: #222327; --sel: #1f2a40;
  --linea: #2a2b30; --linea-fuerte: #36383e;
  --texto: #e7e8ea; --texto-2: #a3a7ae; --texto-3: #7d818a;
  --acento: #7a9cff; --acento-texto: #0d1530;
  --verde: #5cc68c; --verde-bg: #15291e; --ambar: #e0b25c; --ambar-bg: #2e2412;
  --rojo: #ff8a7a; --rojo-bg: #351816; --violeta: #b49cff; --violeta-bg: #261e3d; --gris-bg: #232428;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--texto); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
::selection { background: var(--sel); color: var(--texto); }
* { scrollbar-width: thin; scrollbar-color: var(--linea-fuerte) transparent; }
a { color: var(--acento); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; border-radius: 4px; }
input[type=checkbox], input[type=radio] { accent-color: var(--acento); }
.mono { font-family: var(--mono); font-size: 12px; }
.tenue { color: var(--texto-2); }
.muy-tenue { color: var(--texto-3); }
svg.i { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }

/* Layout: top bar + sidebar + queue + detail */
.app { --ancho-lateral: 232px; --ancho-cola: clamp(300px, 27vw, 440px); display: grid; grid-template-columns: var(--ancho-lateral) var(--ancho-cola) minmax(0, 1fr); grid-template-rows: 48px 1fr; height: 100vh; }
.barra { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--linea); background: var(--panel); }
.btn-lateral { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-left: -6px; border: 0; border-radius: 6px; background: none; color: var(--texto-2); cursor: pointer; }
.btn-lateral:hover { background: var(--hover); color: var(--texto); }
.barra h1 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
.barra .foto { color: var(--texto-3); white-space: nowrap; }
.buscar { flex: 1; min-width: 240px; max-width: 420px; margin-left: auto; position: relative; }
.buscar input { width: 100%; height: 30px; padding: 0 30px; border: 1px solid var(--linea); border-radius: 6px; background: var(--bg); }
.buscar input:hover { border-color: var(--linea-fuerte); }
.buscar svg { position: absolute; left: 9px; top: 8px; color: var(--texto-3); }
.buscar kbd { position: absolute; right: 8px; top: 6px; }
kbd { font: 12px/1.2 var(--mono); padding: 1px 5px; border: 1px solid var(--linea-fuerte); border-bottom-width: 2px; border-radius: 4px; color: var(--texto-2); background: var(--panel); }
.rol { display: inline-flex; border: 1px solid var(--linea); border-radius: 6px; padding: 2px; background: var(--bg); }
.rol button { border: 0; background: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; color: var(--texto-2); }
.rol button:hover { color: var(--texto); }
.rol button[aria-pressed="true"] { background: var(--panel); color: var(--texto); box-shadow: var(--sombra); }

.lateral { background: var(--lateral); border-right: 1px solid var(--linea); overflow: auto; padding: 12px 8px 24px; }
.lateral h2 { font-size: 12px; font-weight: 600; color: var(--texto-3); margin: 18px 8px 4px; }
.lateral h2:first-child { margin-top: 4px; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; text-align: left; color: var(--texto-2); }
.nav:hover { background: var(--hover); color: var(--texto); }
.nav[aria-pressed="true"] { background: var(--panel); color: var(--texto); box-shadow: var(--sombra); font-weight: 500; }
.nav .n { margin-left: auto; color: var(--texto-3); font-size: 12px; font-weight: 400; }
.punto { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--linea-fuerte); }
.punto.rojo { background: var(--rojo); } .punto.ambar { background: var(--ambar); } .punto.verde { background: var(--verde); } .punto.violeta { background: var(--violeta); }

/* Queue */
.cola { overflow: auto; border-right: 1px solid var(--linea); background: var(--panel); }
.grupo-cab { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 14px; background: var(--lateral); border: 0; border-bottom: 1px solid var(--linea); cursor: pointer; text-align: left; font-weight: 600; }
.grupo-cab:hover { background: var(--hover); }
.grupo-cab > span:nth-of-type(1) { white-space: nowrap; }
.grupo-cab .n { color: var(--texto-3); font-weight: 400; }
.grupo-cab .desc { flex: 1; color: var(--texto-3); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grupo-cab svg { color: var(--texto-3); transition: transform .15s ease-out; }
.grupo[data-cerrado] .grupo-cab svg { transform: rotate(-90deg); }
.grupo[data-cerrado] .filas { display: none; }
.fila { display: grid; grid-template-columns: 8px 92px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 6px 14px; border: 0; border-bottom: 1px solid var(--linea); background: none; cursor: pointer; text-align: left; }
.fila:hover { background: var(--hover); }
.fila[aria-current="true"] { background: var(--sel); }
.fila .id { color: var(--texto-3); white-space: nowrap; }
.fila .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .motivo-ia { grid-column: 3 / -1; margin-top: -4px; font-size: 12px; color: var(--texto-2); white-space: normal; }
.filtro-ia { margin: 10px 14px; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 6px; background: var(--gris-bg); font-size: 13px; display: grid; gap: 4px; }
.filtro-ia.error { border-color: var(--ambar); }
.filtro-ia p { margin: 0; }
.filtro-ia .progreso { margin: 2px 0; }
.filtro-ia .i { vertical-align: -2px; }
.etiqueta-relacionada { padding: 0 5px; border: 1px solid var(--linea-fuerte); border-radius: 3px; font-size: 11px; color: var(--texto-3); }
.filtrar-ia { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.vista-ia { display: flex; align-items: center; }
.vista-ia .nav { min-width: 0; }
.vista-ia .recorte { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quitar-vista { flex: none; padding: 2px 6px; color: var(--texto-3); }
@media (max-width: 900px) { .filtrar-ia span { display: none; } }
.fila .senales { display: flex; align-items: center; gap: 10px; color: var(--texto-3); font-size: 12px; white-space: nowrap; }
.senal { display: inline-flex; align-items: center; gap: 3px; }
.senal.rojo { color: var(--rojo); } .senal.ambar { color: var(--ambar); } .senal.verde { color: var(--verde); }
.vacio { padding: 48px 24px; text-align: center; color: var(--texto-2); }
.vacio p { max-width: 40ch; margin: 0 auto; }
.vacio button { margin-top: 12px; }

/* Detail */
.detalle { overflow: auto; background: var(--bg); }
.det { max-width: 820px; padding: 20px 28px 56px; }
.det-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--texto-2); }
.det h2 { font-size: 20px; line-height: 1.35; font-weight: 600; margin: 10px 0 8px; text-wrap: balance; }
.mas { color: var(--verde); } .menos { color: var(--rojo); }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 18px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); cursor: pointer; text-decoration: none; color: var(--texto); white-space: nowrap; transition: background-color .15s ease-out; }
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.btn.primario { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
.btn.primario:hover { filter: brightness(1.08); background: var(--acento); }
.btn.chico { height: 26px; padding: 0 9px; font-size: 12px; }
.estado { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--gris-bg); color: var(--texto-2); }
.estado.verde { background: var(--verde-bg); color: var(--verde); } .estado.ambar { background: var(--ambar-bg); color: var(--ambar); }
.estado.rojo { background: var(--rojo-bg); color: var(--rojo); } .estado.violeta { background: var(--violeta-bg); color: var(--violeta); }

.checks { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); overflow: hidden; }
.check { display: grid; grid-template-columns: 16px 132px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 14px; border-bottom: 1px solid var(--linea); }
.check:last-child { border-bottom: 0; }
.check .icono { padding-top: 1px; color: var(--texto-3); }
.check .icono.verde { color: var(--verde); } .check .icono.ambar { color: var(--ambar); } .check .icono.rojo { color: var(--rojo); }
.check .nombre { color: var(--texto-2); }
.check .valor small { display: block; color: var(--texto-3); font-size: 12px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--linea); margin: 24px 0 18px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--texto-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--texto); }
.tab[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--acento); font-weight: 500; }
.tab .n { color: var(--texto-3); margin-left: 5px; font-weight: 400; }

.seccion { margin: 0 0 24px; }
.seccion h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
.seccion p { margin: 0; max-width: 72ch; }
.seccion ul, .seccion ol { margin: 0; padding-left: 20px; max-width: 72ch; }
.seccion li + li { margin-top: 4px; }
.lectura .mono { color: var(--texto); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--linea); }
th { font-weight: 500; color: var(--texto-3); font-size: 12px; }
.tabla { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); overflow: auto; }
.tabla tr:last-child td { border-bottom: 0; }
.codigo { display: block; margin-top: 4px; padding: 4px 6px; border-radius: 4px; background: var(--bg); font: 12px/1.4 var(--mono); color: var(--texto-2); overflow-wrap: anywhere; }
pre.mermaid { margin: 0; padding: 16px; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); overflow: auto; font: 12px var(--mono); color: var(--texto-2); }
.sin-dato { color: var(--texto-3); }
.nota-pie { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--linea); color: var(--texto-3); font-size: 12px; }

.pasos { list-style: none; padding: 0; margin: 0; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); }
.pasos li { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--linea); }
.pasos li:last-child { border-bottom: 0; }
.pasos input { margin-top: 3px; }
.pasos input:checked + label { color: var(--texto-3); text-decoration: line-through; }

.decision { display: flex; flex-wrap: wrap; gap: 8px; }
.decision label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); cursor: pointer; }
.decision label:hover { background: var(--hover); }
.decision label:has(input:checked) { border-color: var(--acento); background: var(--sel); }
textarea { width: 100%; min-height: 96px; padding: 8px 10px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); color: var(--texto); font: inherit; resize: vertical; }
.guardado { color: var(--texto-3); font-size: 12px; margin-top: 6px; min-height: 18px; }

.ayuda { margin: 22px 8px 0; color: var(--texto-3); font-size: 12px; display: grid; gap: 6px; }
.volver { display: none; }

.girando { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
/* AI work in progress: indeterminate bar, elapsed time and explanation skeleton */
.progreso { position: relative; height: 3px; margin-top: 8px; border-radius: 2px; background: var(--sel); overflow: hidden; }
.progreso::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; border-radius: 2px; background: var(--acento); animation: progreso 1.6s cubic-bezier(.4, 0, .2, 1) infinite; }
@keyframes progreso { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
.transcurrido { font-variant-numeric: tabular-nums; color: var(--texto-2); }
.esqueleto { display: grid; gap: 10px; margin-top: 14px; }
.esqueleto span { display: block; height: 11px; border-radius: 4px; background: linear-gradient(90deg, var(--gris-bg) 0%, var(--hover) 40%, var(--sel) 50%, var(--hover) 60%, var(--gris-bg) 100%); background-size: 300% 100%; animation: brillo 1.8s ease-in-out infinite; }
.esqueleto span:nth-child(1) { width: 92%; } .esqueleto span:nth-child(2) { width: 78%; } .esqueleto span:nth-child(3) { width: 85%; }
.esqueleto span:nth-child(4) { width: 55%; margin-top: 8px; } .esqueleto span:nth-child(5) { width: 70%; }
@keyframes brillo { from { background-position: 100% 0; } to { background-position: 0 0; } }
.trabajando { display: flex; align-items: center; gap: 8px; color: var(--texto-2); }
.trabajando .i { color: var(--acento); }
.senal.azul { color: var(--acento); }
.barra .acciones-barra { display: flex; align-items: center; gap: 8px; min-width: 0; }
.barra .acciones-barra .estado-texto { color: var(--texto-3); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.btn[disabled] { opacity: .55; cursor: default; }
.cambio { display: grid; grid-template-columns: 92px 92px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--linea); }
.cambio .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cambio a { color: inherit; text-decoration: none; }
.cambio a:hover { text-decoration: underline; }

/* Diff */
body[data-enfoque] .app { grid-template-columns: 1fr; }
body[data-sin-lateral] .app { grid-template-columns: var(--ancho-cola) minmax(0, 1fr); }
body[data-sin-cola] .app { grid-template-columns: var(--ancho-lateral) minmax(0, 1fr); }
body[data-sin-lateral][data-sin-cola] .app { grid-template-columns: minmax(0, 1fr); }
body[data-sin-lateral] .lateral, body[data-sin-cola] .cola { display: none; }
body[data-enfoque] .btn-lateral { display: none; }
body[data-enfoque] .lateral, body[data-enfoque] .cola { display: none; }
.det.ancho { max-width: none; }
.diff-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; color: var(--texto-2); }
.diff-barra label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.diff-barra .der { margin-left: auto; display: flex; gap: 8px; }
.indice { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); margin-bottom: 14px; }
.indice a { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 12px; color: var(--texto); text-decoration: none; border-bottom: 1px solid var(--linea); }
.indice a:last-child { border-bottom: 0; }
.indice a:hover { background: var(--hover); }
.indice .ruta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.indice .visto { color: var(--texto-3); text-decoration: line-through; }
.barrita { display: inline-flex; gap: 1px; margin-left: 6px; vertical-align: 1px; }
.barrita i { width: 7px; height: 7px; border-radius: 1px; background: var(--linea-fuerte); }
.barrita i.a { background: var(--verde); } .barrita i.d { background: var(--rojo); }
.archivo { border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); margin-bottom: 14px; overflow: hidden; }
.archivo-cab { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--lateral); border-bottom: 1px solid var(--linea); }
.archivo-cab button.plegar { border: 0; background: none; padding: 0; cursor: pointer; color: var(--texto-3); display: inline-flex; }
.archivo[data-plegado] .archivo-cab button.plegar svg { transform: rotate(-90deg); }
.archivo[data-plegado] .codigo-diff, .archivo[data-plegado] .aviso-diff { display: none; }
.archivo-cab .ruta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.archivo-cab label { display: inline-flex; align-items: center; gap: 5px; color: var(--texto-2); cursor: pointer; white-space: nowrap; }
.codigo-diff { overflow-x: auto; }
.codigo-diff table { border-collapse: collapse; width: 100%; font: 12px/1.55 var(--mono); }
.codigo-diff td { padding: 0 10px; border: 0; vertical-align: top; }
.codigo-diff td.n { width: 1%; min-width: 44px; text-align: right; color: var(--texto-3); user-select: none; padding: 0 8px; }
.codigo-diff td.c { white-space: pre; }
.ajustar .codigo-diff td.c { white-space: pre-wrap; overflow-wrap: anywhere; }
.codigo-diff tr.add td { background: var(--verde-bg); } .codigo-diff tr.add td.n { color: var(--verde); }
.codigo-diff tr.del td { background: var(--rojo-bg); } .codigo-diff tr.del td.n { color: var(--rojo); }
.n-sel { all: unset; display: block; width: 100%; cursor: pointer; text-align: right; }
.n-sel:hover { color: var(--acento); }
.n-sel:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
.codigo-diff tr.sel td { background: var(--sel); }
.codigo-diff tr.sel td.n { box-shadow: inset 2px 0 0 var(--acento); }
.codigo-diff tr.sel td.n + td.n { box-shadow: none; }
.codigo-diff tr.caja td, .codigo-diff tr.hilo td { padding: 0; background: var(--panel); font-family: var(--sans); white-space: normal; }
.codigo-diff { container-type: inline-size; }
.caja-com, .hilo-com { position: sticky; left: 8px; box-sizing: border-box; width: min(720px, calc(100cqw - 110px)); margin: 6px 10px 8px 0; padding: 10px 12px; border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--panel); }
.hilo-com { border-color: var(--linea); }
.hilos-pr { display: grid; gap: 8px; margin-top: 10px; }
.respuesta-a { border-left: 3px solid var(--linea-fuerte); }
.respondiendo { margin: 6px 0; padding: 4px 8px; border-radius: 6px; background: var(--sel); color: var(--texto-2); font-size: .92em; }
.leido { margin: 4px 0 0; font-size: .85em; }
.leido summary { cursor: pointer; }
.leido ul { margin: 4px 0 0; padding-left: 18px; }
.origen { display: inline-flex; gap: 6px; align-items: center; margin: 0 0 14px; font-size: 12px; color: var(--texto-3); }

OWN-WORLD: warm tool neutrals, color only for status (green ready, amber review, red blocks, violet merged), system sans at 13 px, mono only for ids, branches and paths.
STORY: the author sees what to do today; the reviewer understands a PR, records a decision and exports it as a file.
FIRST VIEWPORT: sidebar with views and counts, grouped queue with one-line rows, detail with status stack and tabs.

const costoTexto = (t) => `${t.modelo ? ` · ${nombreModelo(t.modelo)}` : ''}${t.costo ? ` · ${usd(t.costo)}` : ''}`;
const trabajoActivo = (pr) => ['en_cola', 'en_curso'].includes(trabajo(pr)?.estado);
const pendientesDeAnalisis = () => FOTO.prs.filter((p) => p.ambiente !== 'inactiva' && (!p.explicacion || p.explicacion.desactualizada) && !trabajoActivo(p));

// One tone per PR, the most severe that applies: red blocks, amber needs a look, green ready, violet merged.
function tono(pr) {
  const v = pr.verificaciones?.resumen ?? {};
  if (v.bloqueante || (pr.sinProd && pr.seguridad)) return 'rojo';
  if (pr.sinProd || v.alto || pr.estadoPruebas?.estado === 'parcial' || pr.explicacion?.riesgo === 'alto') return 'ambar';
  if (pr.estadoPr === 'MERGED') return 'violeta';
  if (pr.accion === 'solo_prod') return 'verde';
  return '';
}

const definicionGrupos = () => (estado.rol === 'revisor' ? GRUPOS_REVISOR : GRUPOS);
const grupoDe = (pr) => (estado.rol === 'revisor' ? revision(pr)?.decision ?? 'sin_revisar' : pr.accion);
const enVista = (pr) => (estado.vista === 'inactivas' ? pr.ambiente === 'inactiva' : pr.ambiente !== 'inactiva');

function pasaFiltros(pr) {
  if (!enVista(pr)) return false;
  if (estado.filtroIa?.estado === 'listo' && !incluidaEnFiltro(estado.filtroIa, pr.id)) return false;
  if (estado.portal && pr.portal !== estado.portal) return false;
  const v = pr.verificaciones?.resumen ?? {};
  if (estado.filtros.has('seguridad') && !pr.seguridad) return false;
  if (estado.filtros.has('hallazgos') && !(v.bloqueante || v.alto)) return false;
  if (estado.filtros.has('sinExplicacion') && pr.explicacion && !pr.explicacion.desactualizada) return false;
  if (estado.filtros.has('sinRevisar') && revision(pr)) return false;
  const q = $('buscar').value.trim().toLowerCase();
  if (q) {
    const archivos = [...(pr.explicacion?.orden_lectura ?? []).map((o) => o.archivo), ...(pr.verificaciones?.hallazgos ?? []).map((h) => h.archivo)].join(' ');
    if (!`${pr.numero} #${pr.numero} ${pr.titulo} ${pr.rama} ${pr.repo} ${pr.portal} ${archivos}`.toLowerCase().includes(q)) return false;
  }
  return true;
}

function pintarLateral() {
  const base = FOTO.prs.filter(enVista);
  const portales = [...new Set(base.map((p) => p.portal))].sort();
  const cuenta = (fn) => base.filter(fn).length;
  const inactivas = FOTO.prs.filter((p) => p.ambiente === 'inactiva').length;
  const nav = (attrs, contenido, n, activo) => `<button class="nav" ${attrs} aria-pressed="${activo}">${contenido}<span class="n">${n}</span></button>`;
  const filtro = (clave, texto, n) => nav(`data-filtro="${clave}"`, texto, n, estado.filtros.has(clave));
  $('lateral').innerHTML = `
    <h2>Views</h2>
    ${nav('data-vista="cola"', 'Work queue', FOTO.prs.length - inactivas, estado.vista === 'cola')}
    ${nav('data-vista="inactivas"', 'Branches no longer in use', inactivas, estado.vista === 'inactivas')}
    <h2>Portal</h2>
    ${nav('data-portal=""', 'All', base.length, !estado.portal)}
    ${portales.map((p) => nav(`data-portal="${esc(p)}"`, esc(p), cuenta((x) => x.portal === p), estado.portal === p)).join('')}
    <h2>Filters</h2>
    ${filtro('hallazgos', `${icono('alerta')} High findings`, cuenta((x) => x.verificaciones?.resumen.bloqueante || x.verificaciones?.resumen.alto))}
    ${filtro('seguridad', `${icono('escudo')} Security`, cuenta((x) => x.seguridad))}
    ${filtro('sinExplicacion', `${icono('circulo')} No explanation`, cuenta((x) => !x.explicacion || x.explicacion.desactualizada))}
    ${filtro('sinRevisar', `${icono('ojo')} Not reviewed`, cuenta((x) => !revision(x)))}
    ${API && vistasIa().length ? `<h2>AI views</h2>${vistasIa().map((v, i) => {
      const activa = mismaConsulta(estado.filtroIa?.consulta, v);
      return `<div class="vista-ia">${nav(`data-vista-ia="${i}" title="${esc(v)}"`, `${icono('chispa')}<span class="recorte">${esc(v)}</span>`, activa && estado.filtroIa.estado === 'listo' ? cuentaFiltro(estado.filtroIa).directas : '', activa)}<button type="button" class="btn-texto quitar-vista" data-quitar-vista-ia="${i}" aria-label="Remove the view ${esc(v)}" title="Remove the view">×</button></div>`;
    }).join('')}` : ''}
    ${API ? `<h2>AI analysis</h2>
      ${estado.confirmarPendientes
        ? nav('data-accion="analizarPendientes"', `${icono('chispa')} Confirm: ${plural(pendientesDeAnalisis().length, 'PR', 'PRs')}`, '', true)
        : nav('data-accion="pedirConfirmacion"', `${icono('chispa')} Analyze those without an explanation`, pendientesDeAnalisis().length, false)}
      ${[...estado.trabajos.values()].some((t) => t.estado === 'en_cola') ? nav('data-accion="cancelarCola"', `${icono('bloqueo')} Cancel queued ones`, [...estado.trabajos.values()].filter((t) => t.estado === 'en_cola').length, false) : ''}` : ''}
    <div class="solo-escritorio">
      <h2>Review</h2>
      <button class="nav" data-accion="exportar">${icono('descargar')} Export review</button>
      <button class="nav" data-accion="importar">${icono('subir')} Import review</button>
      <div class="ayuda"><span><kbd>j</kbd> <kbd>k</kbd> move through the queue</span><span><kbd>o</kbd> open in GitHub</span><span><kbd>/</kbd> search</span><span><kbd>[</kbd> sidebar</span><span><kbd>]</kbd> queue</span></div>
    </div>`;
}

function senales(pr) {
  const s = [];
  const v = pr.verificaciones?.resumen ?? {};
  if (v.bloqueante) s.push(`<span class="senal rojo" title="${plural(v.bloqueante, 'blocking check', 'blocking checks')}">${icono('bloqueo')}${v.bloqueante}</span>`);
  else if (v.alto) s.push(`<span class="senal ambar" title="${plural(v.alto, 'high finding', 'high findings')}">${icono('alerta')}${v.alto}</span>`);
  const r = revision(pr);
  if (r?.decision) {
    const [txt, cls] = DECISIONES[r.decision] ?? [r.decision, ''];
    s.push(`<span class="senal ${cls}" title="Reviewer: ${esc(txt)}">${icono(cls === 'rojo' ? 'bloqueo' : cls === 'ambar' ? 'alerta' : 'ok')}</span>`);
  }
  const t = trabajo(pr);
  if (t?.estado === 'en_curso') s.push(`<span class="senal azul" title="Analyzing with AI">${icono('actualizar', 'girando')}</span>`);
  else if (t?.estado === 'en_cola') s.push(`<span class="senal azul" title="Queued for analysis">${icono('reloj')}</span>`);
  else if (t?.estado === 'error') s.push(`<span class="senal rojo" title="The analysis failed">${icono('bloqueo')}</span>`);
  const cs = vivos(pr).length;
  if (cs) s.push(`<span class="senal" title="${plural(cs, 'comment', 'comments')} on the diff">${icono('comentario')}${cs}</span>`);
  if (pr.seguridad) s.push(`<span class="senal" title="Security">${icono('escudo')}</span>`);
  const esfuerzo = pr.explicacion?.esfuerzo ?? pr.esfuerzoTamano;
  if (esfuerzo) s.push(`<span title="Review effort, 1 to 5">E${esfuerzo}</span>`);
  s.push(`<span title="Days since it was opened">${pr.dias} d</span>`);
  return s.join('');
}

function pintarCola() {
  const prs = FOTO.prs.filter(pasaFiltros);
  if (!prs.length) {
    $('cola').innerHTML = `${avisoVersion()}${bannerFiltroIa()}<div class="vacio"><p>No PRs match the search and active filters.</p><button class="btn" data-accion="limpiar">Clear filters</button></div>`;
    return;
  }
  const defs = definicionGrupos();
  const orden = Object.keys(defs);
  const porGrupo = new Map();
  for (const pr of prs) {
    const g = grupoDe(pr);
    if (!porGrupo.has(g)) porGrupo.set(g, []);
    porGrupo.get(g).push(pr);
  }
  const posicion = (g) => (orden.includes(g) ? orden.indexOf(g) : 99);
  $('cola').innerHTML = avisoVersion() + bannerFiltroIa() + (estado.filtroIa ? '' : seccionCambios()) + [...porGrupo.keys()].sort((a, b) => posicion(a) - posicion(b)).map((g) => {
    const [nombre, desc] = defs[g] ?? GRUPOS[g] ?? [FOTO.acciones?.[g] ?? g, ''];
    const filas = porGrupo.get(g).sort((a, b) => a.repo.localeCompare(b.repo) || b.numero - a.numero);
    const cerrado = estado.cerrados.has(g);
    return `<section class="grupo" ${cerrado ? 'data-cerrado' : ''}>
      <button class="grupo-cab" data-grupo-toggle="${g}" aria-expanded="${!cerrado}">${icono('chevron')}<span>${esc(nombre)}</span><span class="n">${filas.length}</span><span class="desc">${esc(desc)}</span></button>
      <div class="filas">${filas.map((pr) => `
        <button class="fila" data-id="${esc(pr.id)}" aria-current="${estado.seleccion === pr.id}">
          <span class="punto ${tono(pr)}"></span>
          <span class="id mono">${esc(pr.repoEtiqueta)} #${pr.numero}</span>
          <span class="titulo" title="${esc(pr.titulo)}">${esc(pr.titulo)}</span>
          <span class="senales">${senales(pr)}</span>
          ${estado.filtroIa?.estado === 'listo' ? motivoHtml(estado.filtroIa.motivos.get(pr.id)) : ''}
        </button>`).join('')}</div>
    </section>`;
  }).join('');
}

// AI filter: the need is typed in the search box. Needs saved as views live in this browser.
const claveVistasIa = () => `seki-review:vistas-ia:${FOTO.proyecto}`;
const vistasIa = () => almacen.leer(claveVistasIa(), []);
const mismaConsulta = (a, b) => a?.toLowerCase() === b?.toLowerCase();
// Direct: the PR’s purpose is the need. Related: touches the area with another purpose; shown only on request.
const incluidaEnFiltro = (f, id) => { const m = f.motivos.get(id); return !!m && (m.relacion !== 'relacionada' || f.conRelacionadas); };
const cuentaFiltro = (f) => {
  const todas = [...f.motivos.values()];
  return { directas: todas.filter((m) => m.relacion !== 'relacionada').length, relacionadas: todas.filter((m) => m.relacion === 'relacionada').length };
};
const motivoHtml = (m) => (m ? `<span class="motivo-ia">${m.relacion === 'relacionada' ? '<span class="etiqueta-relacionada">Related</span> ' : ''}${esc(m.motivo)}</span>` : '');
const firmaFoto = () => FOTO.prs.map((x) => `${x.id}@${x.headSha}`).sort().join('|');

async function filtrarConIa(consulta) {
  const q = (consulta ?? $('buscar').value).replace(/\s+/g, ' ').trim();
  if (!q) { avisar('Type in the search box which PRs you are looking for, for example “cybersecurity PRs”.'); return $('buscar').focus(); }
  if (servidorDesfasado()) return avisar('Restart Claude Code: the dashboard server is from an older version and does not have Filter with AI yet.');
  if (estado.filtroIa?.estado === 'cargando' && mismaConsulta(estado.filtroIa.consulta, q)) return;
  const pedido = { consulta: q, estado: 'cargando', inicio: new Date().toISOString(), firma: firmaFoto() };
  estado.filtroIa = pedido;
  $('buscar').value = '';
  pintarTodo({ detalle: false });
  let siguiente;
  try {
    const r = await api('/api/filtrar', { consulta: q });
    siguiente = { ...pedido, estado: 'listo', motivos: new Map(r.coincidencias.map((c) => [c.id, c])), conRelacionadas: false, costo: r.costo, desdeCache: r.desdeCache };
  } catch (err) {
    siguiente = { ...pedido, estado: 'error', mensaje: err.message };
  }
  // If the filter was removed or another one requested meanwhile, this response no longer applies.
  if (estado.filtroIa !== pedido) return;
  estado.filtroIa = siguiente;
  pintarTodo({ detalle: false });
  if (siguiente.estado === 'listo' && !siguiente.desdeCache) sondear();
}

const servidorDesfasado = () => !!(API && VERSION_PAGINA && estado.versionServidor && estado.versionServidor !== VERSION_PAGINA);
function avisoVersion() {
  if (!servidorDesfasado()) return '';
  return `<div class="filtro-ia error" role="alert"><p>${icono('alerta')} The plugin was updated to version ${esc(VERSION_PAGINA)}, but the dashboard server is still on ${esc(estado.versionServidor)}. New features (such as Filter with AI) won’t respond until you restart Claude Code.</p></div>`;
}

function bannerFiltroIa() {
  const f = estado.filtroIa;
  if (!f) return '';
  const q = `“${esc(f.consulta)}”`;
  const quitar = '<button type="button" class="btn-texto" data-accion="quitarFiltroIa">Remove filter</button>';
  if (f.estado === 'cargando') {
    return `<div class="filtro-ia" role="status"><p class="trabajando">${icono('actualizar', 'girando')}<span>AI is reviewing ${plural(FOTO.prs.length, 'PR', 'PRs')} for ${q} · ${transcurrido(f.inicio)}</span></p>
      <div class="progreso" aria-hidden="true"></div><p class="muy-tenue">Uses each PR’s title, branch and files; usually takes 10 to 40 seconds. ${quitar}</p></div>`;
  }
  if (f.estado === 'error') {
    return `<div class="filtro-ia error" role="alert"><p>${icono('alerta')} ${esc(f.mensaje)}</p>
      <p><button type="button" class="btn chico" data-accion="reintentarFiltroIa">Retry</button> ${quitar}</p></div>`;
  }
  const visibles = FOTO.prs.filter(pasaFiltros).length;
  const { directas, relacionadas } = cuentaFiltro(f);
  const ocultas = (f.conRelacionadas ? directas + relacionadas : directas) - visibles;
  const verRelacionadas = relacionadas
    ? ` · <button type="button" class="btn-texto" data-accion="relacionadasFiltroIa" aria-pressed="${f.conRelacionadas}" title="PRs that touch the area but have a different purpose (copy, a visual tweak, a feature)">${f.conRelacionadas ? 'Hide' : 'Show'} ${plural(relacionadas, 'related', 'related')}</button>` : '';
  const guardada = vistasIa().some((v) => mismaConsulta(v, f.consulta));
  const cambio = f.firma !== firmaFoto()
    ? `<p class="aviso-lento">${icono('reloj')} The queue changed after filtering. <button type="button" class="btn-texto" data-accion="reintentarFiltroIa">Filter again</button></p>` : '';
  return `<div class="filtro-ia" role="status">
    <p><strong>${icono('chispa')} AI filter</strong> ${q}: ${directas ? plural(directas, 'PR is about this', 'PRs are about this') : 'no PR is about this'}${verRelacionadas}${ocultas > 0 ? ` · ${plural(ocultas, 'hidden', 'hidden')} by the other filters or the view` : ''}</p>
    <p class="muy-tenue">${f.desdeCache ? 'Saved result, no cost' : usd(f.costo)} · decided by title, branch and files: check the reason for each one.</p>
    <p>${guardada ? '' : '<button type="button" class="btn-texto" data-accion="guardarFiltroIa">Save as view</button> · '}${quitar}</p>${cambio}</div>`;
}

function seccionCambios() {
  const c = FOTO.cambios;
  if (!c || estado.vista !== 'cola') return '';
  const fecha = (f) => new Date(f).toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' });
  const enlace = (x) => `<a href="${gh(x.repo, x.numero)}" target="_blank" rel="noopener" title="${esc(x.titulo)}">${esc(x.titulo)}</a>`;
  const fila = (etiqueta, color, x, extra = '') => `<div class="cambio"><span class="estado ${color}">${etiqueta}</span><span class="mono muy-tenue">${esc(x.repo.replace('core-', ''))} #${x.numero}</span><span class="titulo">${FOTO.prs.some((p) => p.id === x.id) ? `<a href="#" data-ir="${esc(x.id)}">${esc(x.titulo)}</a>` : enlace(x)}${extra}</span></div>`;
  const nombreGrupo = (g) => (GRUPOS[g] ?? [g])[0];
  const filas = [
    ...c.mergeadas.map((x) => fila('Merged', 'violeta', x, ` <span class="muy-tenue">into ${esc(x.base)}</span>`)),
    ...c.cerradas.map((x) => fila(x.estado === 'cerrada' ? 'Closed' : 'Left', '', x)),
    ...c.nuevas.map((x) => fila('New', 'verde', x)),
    ...c.movidas.map((x) => fila('Changed', 'ambar', x, ` <span class="muy-tenue">${esc(nombreGrupo(x.de))} → ${esc(nombreGrupo(x.a))}</span>`)),
  ];
  const n = filas.length;
  const cerrado = estado.cerrados.has('_cambios');
  return `<section class="grupo" ${cerrado ? 'data-cerrado' : ''}>
    <button class="grupo-cab" data-grupo-toggle="_cambios" aria-expanded="${!cerrado}">${icono('chevron')}<span>Detected changes</span><span class="n">${n}</span><span class="desc">between ${fecha(c.desde)} and ${fecha(c.hasta)}</span></button>
    <div class="filas">${filas.join('')}</div>
  </section>`;
}

// Elapsed time that updates every second without repainting the view.
const reloj = (desde) => { const s = Math.max(0, Math.floor((Date.now() - new Date(desde)) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
// aria-live="off": inside a live region, the clock would be announced every second.
const transcurrido = (desde) => (desde ? `<span class="transcurrido" data-desde="${esc(desde)}" aria-live="off">${reloj(desde)}</span>` : '');
setInterval(() => { for (const el of document.querySelectorAll('[data-desde]')) el.textContent = reloj(el.dataset.desde); }, 1000);

function check(icon, color, nombre, valor, detalle = '') {
  return `<div class="check"><span class="icono ${color}">${icono(icon)}</span><span class="nombre">${nombre}</span><span class="valor">${valor}${detalle ? `<small>${detalle}</small>` : ''}</span></div>`;
}

function pilaEstados(pr) {
  const filas = [];
  const ep = pr.estadoPruebas;
  if (ep) {
    const metodo = ep.metodo === 'parche' ? 'Checked by applying the change to the testing branch' : 'Compared file by file';
    const mapa = { en_pruebas: ['ok', 'verde', 'The code is already in testing'], parcial: ['alerta', 'ambar', 'Testing has a different version of the change'], no_en_pruebas: ['circulo', '', 'Not in testing yet'] };
    const [i, c, t] = mapa[ep.estado] ?? ['circulo', '', ep.estado];
    filas.push(check(i, c, 'Testing', t, `${ep.iguales} of ${ep.total} files identical${ep.conflicto ? ', with conflict' : ''}. ${metodo}.`));
  }
  if (pr.estadoProd) {
    const det = `${pr.estadoProd.iguales} of ${pr.estadoProd.total} files identical in production`;
    filas.push(pr.sinProd
      ? check('bloqueo', pr.seguridad ? 'rojo' : 'ambar', 'Production', 'Code not found in production and no PR to production', det)
      : check('ok', '', 'Production', pr.cubiertaPor ? `PR <a href="${gh(pr.repo, pr.cubiertaPor)}" target="_blank" rel="noopener">#${pr.cubiertaPor}</a> to production brings the same files` : 'No alerts', det));
  }
  if (pr.gemela) {
    const txt = { MERGED: 'merged', OPEN: 'open', CLOSED: 'closed without merging' }[pr.gemela.estado] ?? pr.gemela.estado;
    filas.push(check(pr.gemela.estado === 'MERGED' ? 'merge' : 'circulo', pr.gemela.estado === 'MERGED' ? 'verde' : '', pr.ambiente === 'prod' ? 'PR to testing' : 'PR to production',
      `<a href="${gh(pr.repo, pr.gemela.numero)}" target="_blank" rel="noopener">#${pr.gemela.numero}</a> ${txt}`, 'Found by title; the testing status above is the actual check'));
  }
  if (pr.hermanas?.length) {
    const faltan = pr.hermanas.some((h) => !h.numero);
    filas.push(check(faltan ? 'alerta' : 'ok', faltan ? 'ambar' : 'verde', 'Other portals',
      pr.hermanas.map((h) => (h.numero ? `${esc(h.portal)}: <a href="${gh(pr.repo, h.numero)}" target="_blank" rel="noopener">#${h.numero}</a>` : `${esc(h.portal)}: no equivalent PR`)).join(' · '),
      faltan ? 'Confirm whether the change also applies to that portal' : ''));
  }
  const v = pr.verificaciones;
  if (v) {
    const r = v.resumen;
    const [i, c] = r.bloqueante ? ['bloqueo', 'rojo'] : r.alto ? ['alerta', 'ambar'] : ['ok', 'verde'];
    const partes = [r.bloqueante && plural(r.bloqueante, 'blocking', 'blocking'), r.alto && plural(r.alto, 'high', 'high'), r.medio && plural(r.medio, 'medium', 'medium'), r.aviso && plural(r.aviso, 'warning', 'warnings')].filter(Boolean);
    filas.push(check(i, c, 'Checks', partes.length ? partes.join(', ') : 'No findings in the added lines', partes.length ? '<a href="#" data-tab-ir="verificaciones">View findings</a>' : ''));
  }
  const tr = trabajo(pr);
  if (tr) {
    const hora = (f) => (f ? new Date(f).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '');
    const mapa = {
      en_cola: ['reloj', '', 'Queued for analysis', ''],
      en_curso: ['actualizar', '', 'Analyzing the PR', `${transcurrido(tr.inicio)} · since ${hora(tr.inicio)} · usually takes one to three minutes<div class="progreso" role="progressbar" aria-label="Analysis in progress"></div>`],
      terminado: ['ok', 'verde', 'Explanation generated', `At ${hora(tr.fin)}${costoTexto(tr)}`],
      error: ['bloqueo', 'rojo', 'The analysis did not complete', esc(tr.mensaje ?? '')],
      cancelado: ['circulo', '', 'Analysis canceled', ''],
    };
    const [i, c, txt, det] = mapa[tr.estado] ?? ['circulo', '', tr.estado, ''];
    filas.push(check(i, c, 'AI analysis', txt, det).replace('<svg class="i "', tr.estado === 'en_curso' ? '<svg class="i girando"' : '<svg class="i "'));
  }
  const rev = revision(pr);
  if (rev?.decision) {
    const [txt, cls] = DECISIONES[rev.decision] ?? [rev.decision, ''];
    const cambio = rev.headSha && rev.headSha !== pr.headSha ? ' · the PR changed after this review' : '';
    filas.push(check(cls === 'rojo' ? 'bloqueo' : cls === 'ambar' ? 'alerta' : 'ok', cls, 'Reviewer', esc(txt), `${esc(new Date(rev.fecha).toLocaleDateString('en-US'))}${cambio}`));
  } else if (pr.revisionGithub) {
    filas.push(check('ojo', '', 'GitHub review', esc(pr.revisionGithub)));
  }
  return filas.length ? `<div class="checks">${filas.join('')}</div>` : '';
}

const lista = (items) => (items?.length ? `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : '<p class="sin-dato">No data.</p>');
const sec = (titulo, cuerpo, clave) => {
  if (!clave || !API) return `<div class="seccion"><h3>${titulo}</h3>${cuerpo}</div>`;
  const pr = prSel();
  const hilos = pr ? dePr(pr, clave) : [];
  return `<div class="seccion" data-seccion="${clave}"><h3 class="con-accion">${titulo}<button type="button" class="btn-texto" data-ampliar="${clave}" title="AI expands this section with examples from the diff">${icono('chispa')} Expand</button></h3>${cuerpo}
    ${hilos.length ? `<div class="hilos-pr">${hilosDiv(hilos)}</div>` : ''}</div>`;
};

function preguntaPrHtml(pr) {
  if (!API) return '';
  const generales = dePr(pr, null);
  const opciones = Object.entries(SECCIONES).filter(([k]) => pr.explicacion?.[k]?.length || k === 'resumen')
    .map(([k, t]) => `<option value="${k}">${esc(t)}</option>`).join('');
  return `<div class="seccion pregunta-pr"><h3>Ask about this PR</h3>
    ${generales.length ? `<div class="hilos-pr">${hilosDiv(generales)}</div>` : ''}
    ${estado.respondeA?.ambito === 'pr' ? `<div class="respondiendo">Continues the conversation from: “${esc(estado.respondeA.resumen)}” <button type="button" class="btn-texto" data-accion="quitarRespondeA">Remove</button></div>` : ''}
    <textarea id="preguntaPr" rows="3" placeholder="For example: what happens to the webhooks already configured in production?" aria-label="Question about the PR"></textarea>
    <div class="prop-acciones"><select id="preguntaPrSeccion" aria-label="Which part"><option value="">Whole PR</option>${opciones}</select>
      <label class="muy-tenue"><input type="checkbox" id="preguntaPrCodigo"> Check the code</label>
      <button type="button" class="btn chico primario" data-accion="preguntarPr">Ask</button><button type="button" class="btn chico" data-accion="agregarPreguntaPr">Add to review</button><span class="muy-tenue">Ctrl + Enter asks · you can also select text in the explanation or in an answer to ask about that part · the answer is more useful if the question doesn’t suggest the conclusion</span></div></div>`;
}

function coberturaHtml(e, pr) {
  const c = e.cobertura;
  if (!c) return '';
  const gen = c.generados ?? [];
  const aparte = c.leidosAparte ?? [];
  const extra = [aparte.length ? `${plural(aparte.length, 'file read', 'files read')} outside the message` : '', gen.length ? `${plural(gen.length, 'generated file skipped', 'generated files skipped')}` : ''].filter(Boolean).join(' · ');
  if (c.completa) return extra ? `<p class="origen">${icono('ok')} <span>AI reviewed the whole diff (${extra}).</span></p>` : '';
  const sin = c.sinDiff ?? [];
  const rec = c.recortados ?? [];
  const items = [...sin.map((a) => `<li><span class="mono">${esc(a)}</span> · not reviewed</li>`), ...rec.map((a) => `<li><span class="mono">${esc(a)}</span> · partly reviewed</li>`), ...gen.map((a) => `<li><span class="mono">${esc(a)}</span> · generated, not reviewed</li>`)];
  const boton = API ? `<p style="margin-top:8px"><button type="button" class="btn chico" data-accion="completarCobertura" ${trabajoActivo(pr) ? 'disabled' : ''}>${icono('chispa')} Review what was missed</button> <span class="muy-tenue">Analyzes only those files and extends the explanation</span></p>` : '';
  return `<details class="seccion cobertura"><summary><span class="estado ambar">${icono('alerta')} Partial coverage: AI did not see the full diff (${plural(sin.length, 'file not reviewed', 'files not reviewed')}${rec.length ? `, ${plural(rec.length, 'truncated', 'truncated')}` : ''})</span>${extra ? ` <span class="muy-tenue">${extra}</span>` : ''}</summary>
    ${boton}${items.length ? `<ul class="tenue">${items.slice(0, 80).join('')}</ul>` : ''}</details>`;
}

function tabResumen(pr) {
  const e = pr.explicacion;
  if (!e) {
    const tr = trabajo(pr);
    if (API && tr?.estado === 'en_curso') return `<div class="seccion" aria-live="polite"><p class="trabajando">${icono('actualizar', 'girando')}<span>AI is reading the diff and related code · ${transcurrido(tr.inicio)}</span></p>
      <div class="progreso" aria-hidden="true"></div>${avanceHtml('explicar', estado.avances[`pr:${pr.id}`], tr.inicio)}
      <div class="esqueleto" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></div>`;
    if (API && tr?.estado === 'en_cola') return `<div class="seccion"><p class="trabajando">${icono('reloj')} Queued: starts when the current analysis finishes.</p></div>`;
    if (API) return `<div class="seccion"><p class="tenue">This PR doesn’t have an explanation yet.</p>
      <p style="margin-top:12px"><button class="btn chico" data-accion="analizar" ${trabajoActivo(pr) ? 'disabled' : ''}>${trabajoActivo(pr) ? `${icono('actualizar', 'girando')} Analyzing` : `${icono('chispa')} Analyze with AI`}</button></p></div>`;
    return `<div class="seccion"><p class="tenue">This PR doesn’t have an explanation yet. It is generated from Claude Code and appears here when the dashboard is regenerated.</p>
      <p style="margin-top:12px"><button class="btn chico" data-copiar="/seki-review:revisar-prs explicar ${esc(pr.repo)}#${pr.numero}">${icono('copiar')} Copy the command</button></p></div>`;
  }
  return `
    <p class="origen">${icono('chispa')} <span><strong>AI explanation.</strong> A reading aid for the PR; it does not replace reviewing the diff. The fixed rules are under Checks.</span></p>
    ${e.desactualizada ? `<div class="seccion"><span class="estado ambar">${icono('alerta')} The PR received commits after this explanation</span></div>` : ''}
    ${coberturaHtml(e, pr)}
    ${sec('What it solves', `<p>${esc(e.resumen)}</p>`, 'resumen')}
    ${sec('Why', `<p>${esc(e.por_que)}</p>`, 'por_que')}
    ${e.impacto_usuario ? sec('What users notice', `<p>${esc(e.impacto_usuario)}</p>`, 'impacto_usuario') : ''}
    ${sec('What changes', lista(e.que_cambia), 'que_cambia')}
    ${e.orden_lectura?.length ? sec('Reading order', `<ol class="lectura">${e.orden_lectura.map((o) => `<li><span class="mono">${esc(o.archivo)}</span><br><span class="tenue">${esc(o.motivo)}</span></li>`).join('')}</ol>`, 'orden_lectura') : ''}
    ${e.diagrama ? sec('Flow', `<pre class="mermaid">${esc(e.diagrama.replace(/#(?!\d+;)/g, '#35;'))}</pre>`, 'diagrama') : ''}
    ${e.tecnologias?.length ? sec('Technologies', `<div class="tabla"><table><thead><tr><th>Technology</th><th>Use in this change</th><th>Why this one</th><th>Ruled out</th></tr></thead><tbody>
      ${e.tecnologias.map((t) => `<tr><td><strong>${esc(t.nombre)}</strong></td><td>${esc(t.uso)}</td><td>${esc(t.por_que)}</td><td class="tenue">${esc((t.alternativas_descartadas ?? []).join(' '))}</td></tr>`).join('')}
      </tbody></table></div>`, 'tecnologias') : ''}
    ${e.alternativas?.length ? sec('Alternatives considered', lista(e.alternativas), 'alternativas') : ''}
    ${e.dependencias?.length ? sec('Must go first', lista(e.dependencias), 'dependencias') : ''}
    ${e.riesgos?.length ? sec('Risks', lista(e.riesgos), 'riesgos') : ''}
    ${barraPendiente(pr)}
    ${preguntaPrHtml(pr)}
    <p class="nota-pie">Explanation from ${esc(e.fecha?.slice(0, 10))} on commit <span class="mono">${esc(e.headSha?.slice(0, 7))}</span>${e.riesgo ? ` · ${esc(nivel(e.riesgo))} risk` : ''}${e.esfuerzo ? ` · effort ${e.esfuerzo} of 5` : ''}.${API ? ` <button type="button" class="btn-texto" data-accion="analizar" ${trabajoActivo(pr) ? 'disabled' : ''}>Analyze again with AI</button>` : ''}</p>`;
}

function tabVerificaciones(pr) {
  const v = pr.verificaciones;
  if (!v) return '<p class="sin-dato">No checks for this PR.</p>';
  if (!v.hallazgos.length) return '<p class="tenue">The added lines pass all rules.</p>';
  const color = { bloqueante: 'rojo', alto: 'ambar', medio: '', aviso: '' };
  return `<div class="tabla"><table><thead><tr><th>Severity</th><th>Finding</th><th>Where</th></tr></thead><tbody>
    ${v.hallazgos.map((h) => `<tr>
      <td><span class="estado ${color[h.severidad]}">${esc(nivel(h.severidad))}</span></td>
      <td><strong>${esc(h.titulo)}</strong><br><span class="tenue">${esc(h.mensaje)}</span><br><span class="muy-tenue">${esc(h.origen)}</span></td>
      <td><a class="mono" href="${esc(pr.url)}/files" target="_blank" rel="noopener">${esc(h.archivo)}${h.linea ? ':' + h.linea : ''}</a>${h.texto ? `<code class="codigo">${esc(h.texto)}</code>` : ''}</td>
    </tr>`).join('')}
  </tbody></table></div>
  <p class="nota-pie">Fixed rules over the added lines, no AI: they flag patterns, they don’t confirm there is a problem. A line is excluded from a rule with the comment <span class="mono">seki-review: ignore &lt;rule&gt;</span>.</p>`;
}

function tabDescripcion(pr) {
  const texto = (pr.descripcion ?? '').replace(/<!--[\s\S]*?-->/g, '').trim();
  let cuerpo = `<div class="md-desc lectura">${md(texto)}</div>`;
  if (pr.descripcion === undefined) cuerpo = '<p class="sin-dato">This data doesn’t include the description. Use “Refresh status”.</p>';
  else if (!texto) cuerpo = `<p class="sin-dato">The PR has no description.${pr.seguridad ? ' This is a security PR: ask the author what changes, why, and in what order it is deployed.' : ''}</p>`;
  const commits = pr.commits ?? [];
  const lista = commits.length
    ? `<ol class="commits">${commits.map((c) => `<li>
        <a class="mono" href="${esc(pr.url)}/commits/${esc(c.sha)}" target="_blank" rel="noopener">${esc(c.sha.slice(0, 7))}</a>
        ${esc(c.titulo)}
        <span class="muy-tenue">${esc(c.autor ?? '')}${c.fecha ? ` · ${esc(new Date(c.fecha).toLocaleString('en-US'))}` : ''}</span>
        ${c.cuerpo ? `<details><summary class="muy-tenue">Full message</summary><div class="tenue">${md(c.cuerpo)}</div></details>` : ''}
      </li>`).join('')}</ol>`
    : '<p class="sin-dato">No commits in this data.</p>';
  return `${sec('Author’s description', cuerpo)}${sec('Commits', lista)}`;
}

function tabProbar(pr) {
  const pasos = pr.explicacion?.como_probar ?? [];
  if (!pasos.length) return '<p class="sin-dato">The explanation has no test steps.</p>';
  const marcados = almacen.leer(clavePasos(pr), []);
  return `<ul class="pasos">${pasos.map((p, i) => `<li><input type="checkbox" id="paso${i}" data-paso="${i}" ${marcados.includes(i) ? 'checked' : ''}><label for="paso${i}">${esc(p)}</label></li>`).join('')}</ul>
    <p class="nota-pie">${marcados.length} of ${plural(pasos.length, 'step checked', 'steps checked')}. Saved in this browser and included in the exported review.</p>`;
}

function tabRevision(pr) {
  const r = revision(pr) ?? {};
  return `${sec('Decision', `<div class="decision" role="radiogroup">${Object.entries(DECISIONES).map(([k, [t]]) => `<label><input type="radio" name="decision" value="${k}" ${r.decision === k ? 'checked' : ''}> ${t}</label>`).join('')}</div>`)}
    ${sec('Feedback for the author', `<textarea id="notaRevision" placeholder="What’s missing, what was tested, what needs clarifying">${esc(r.nota ?? '')}</textarea>
      <div class="guardado" id="guardado">${r.fecha ? `Saved ${esc(new Date(r.fecha).toLocaleString('en-US'))}` : ''}</div>`)}
    <p class="tenue">The review stays in this browser. To send it to the author:</p>
    <div class="acciones"><button class="btn" data-accion="exportar">${icono('descargar')} Export review</button><button class="btn" data-accion="copiarResumen">${icono('copiar')} Copy summary</button></div>`;
}

const ESTADO_ARCHIVO = { added: 'Added', removed: 'Removed', modified: 'Modified', renamed: 'Renamed', copied: 'Copied', changed: 'Changed' };
const claveVistos = (pr) => `seki-review:vistos:${pr.id}:${pr.headSha}`;
const idArchivo = (i) => `archivo-${i}`;

function barrita(a, d) {
  const total = a + d;
  if (!total) return '';
  const verdes = Math.round((a / total) * 5);
  return `<span class="barrita" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => `<i class="${i < verdes ? 'a' : 'd'}"></i>`).join('')}</span>`;
}

// Comments on diff lines. Questions and change requests start as drafts and are sent
// together; manual notes are saved when added and travel in the exported review.
const TIPOS_COMENTARIO = {
  pregunta: { nombre: 'Ask', etiqueta: 'Question', ayuda: 'What you want to understand about these lines. “What happens if…?” beats “Is this OK?”' },
  cambio: { nombre: 'Request change', etiqueta: 'Change request', ayuda: 'How this code should end up' },
  nota: { nombre: 'Note', etiqueta: 'Note', ayuda: 'Comment for the author' },
};
const ESTADOS_COMENTARIO = {
  borrador: ['Draft', ''], nota: ['Note saved', ''], en_cola: ['Queued', 'azul'], en_curso: ['In progress', 'azul'],
  respondido: ['Answered', 'verde'], propuesta: ['Proposal ready', 'ambar'], aprobado: ['Approved', 'violeta'],
  descartado: ['Discarded', ''], error: ['Error', 'rojo'],
};
const claveComentarios = (pr) => `seki-review:comentarios:${pr.id}`;
const comentarios = (pr) => almacen.leer(claveComentarios(pr), []);
const vivos = (pr) => comentarios(pr).filter((c) => c.estado !== 'descartado');
const deLineas = (pr) => vivos(pr).filter((c) => !c.ambito);
const dePr = (pr, seccion) => vivos(pr).filter((c) => c.ambito === 'pr' && (c.seccion ?? null) === (seccion ?? null));
// Display labels for values the server stores in Spanish.
const NIVELES = { bloqueante: 'blocking', alto: 'high', medio: 'medium', aviso: 'notice', bajo: 'low' };
const nivel = (v) => NIVELES[v] ?? v;

const SECCIONES = {
  resumen: 'What it solves', por_que: 'Why', impacto_usuario: 'What users notice', que_cambia: 'What changes',
  orden_lectura: 'Reading order', diagrama: 'Flow', tecnologias: 'Technologies', alternativas: 'Alternatives considered',
  dependencias: 'Must go first', riesgos: 'Risks', como_probar: 'How to test',
};

// Questions about the PR or a section of the explanation: sent right away, without going through "Pending review".
// A second click on the same option removes the rating.
async function valorar(pr, id, util) {
  const c = comentarios(pr).find((x) => x.id === id);
  const valor = c?.valoracion === util ? null : util;
  try {
    await api('/api/valorar', { id: pr.id, comentario: id, util: valor });
    escribirComentarios(pr, comentarios(pr).map((x) => (x.id === id ? { ...x, valoracion: valor ?? undefined } : x)));
    repintarDetalle();
  } catch (err) { avisar(err.message); }
}

async function investigar(pr, id) {
  try {
    await api('/api/investigar', { id: pr.id, comentario: id });
    escribirComentarios(pr, comentarios(pr).map((c) => (c.id === id ? { ...c, estado: 'en_cola', investigar: true } : c)));
    repintarDetalle();
  } catch (err) { avisar(err.message); }
  sondear();
}

async function preguntarPr(pr, seccion, textoFijo, { citado, enviar = true, investigar } = {}) {
  const caja = $('preguntaPr');
  const texto = (textoFijo ?? caja?.value ?? '').trim();
  if (!texto) { avisar('Write the question before sending it.'); return caja?.focus(); }
  const sobre = seccion ?? ($('preguntaPrSeccion')?.value || undefined);
  const respondeA = !textoFijo && estado.respondeA?.ambito === 'pr' ? estado.respondeA.id : undefined;
  const conCodigo = investigar ?? (!textoFijo && !!$('preguntaPrCodigo')?.checked);
  const c = { id: nuevoIdComentario(), creado: new Date().toISOString(), tipo: 'pregunta', estado: 'borrador', ambito: 'pr', seccion: sobre, citado: citado || undefined, respondeA, investigar: conCodigo || undefined, texto, headSha: pr.headSha };
  guardarComentario(pr, c);
  if (respondeA) estado.respondeA = null;
  if (caja && !textoFijo) caja.value = '';
  if (enviar) await enviarRevision(pr, [c.id]);
  else { repintarDetalle(); pintarCola(); }
}

// Text selection in the Summary: floating bar to ask about the fragment (as in Plannotator).
const RAPIDAS = [
  ['Why?', 'Why was it done this way and not another?'],
  ['Give an example', 'Give a concrete example taken from the diff.'],
  ['Expand', 'Expand this point with more detail and examples from the diff.'],
];
const RAPIDAS_RESPUESTA = [
  ['Why?', 'What is this part based on? Point to the file and lines.'],
  ['Give an example', 'Give a concrete example of this part taken from the diff.'],
  ['Expand', 'Expand this part with more detail.'],
];
let seleccionResumen = null;

function cerrarBarraSel() {
  $('barraSel')?.remove();
  seleccionResumen = null;
}

// Text selected with the mouse inside the diff: mapped to the rows it touches so those lines can be commented on.
function lineasDeSeleccion(rango) {
  const fila = (n) => (n.nodeType === 1 ? n : n.parentElement)?.closest('tr[data-clave]');
  const a = fila(rango.startContainer);
  const b = fila(rango.endContainer);
  const archivo = a?.closest('.archivo');
  if (!a || !b || !archivo || archivo !== b.closest('.archivo') || a.closest('tr.hilo, tr.caja')) return null;
  return { archivo: +archivo.dataset.k, claveA: a.dataset.clave, claveB: b.dataset.clave };
}

function abrirCajaDeSeleccion(tipo) {
  const s = seleccionResumen?.lineas;
  cerrarBarraSel();
  if (!s) return;
  window.getSelection()?.removeAllRanges();
  leerCaja();
  estado.caja = { ...cajaVacia(tipo), texto: '' };
  estado.seleccionLineas = s;
  marcarSeleccion();
}

function colocarBarra(barra, caja) {
  document.body.append(barra);
  const ancho = Math.min(420, window.innerWidth - 24);
  barra.style.width = `${ancho}px`;
  barra.style.left = `${Math.max(12, Math.min(caja.left, window.innerWidth - ancho - 12))}px`;
  const abajo = caja.bottom + 8;
  barra.style.top = `${abajo + 170 > window.innerHeight ? Math.max(12, caja.top - 8 - barra.offsetHeight) : abajo}px`;
}

function abrirBarraSel() {
  const sel = window.getSelection();
  const texto = sel?.toString().replace(/\s+/g, ' ').trim();
  if (!texto || sel.rangeCount === 0) return;
  if (API && barraEnRespuesta(sel, texto)) return;
  if (estado.tab === 'archivos') {
    const lineas = lineasDeSeleccion(sel.getRangeAt(0));
    if (!lineas) return;
    seleccionResumen = { lineas, tab: 'archivos' };
    $('barraSel')?.remove();
    const barra = document.createElement('div');
    barra.id = 'barraSel';
    barra.className = 'barra-sel';
    barra.setAttribute('role', 'dialog');
    barra.setAttribute('aria-label', 'Comment on the selected lines');
    barra.innerHTML = `<div class="barra-sel-botones">
      ${API ? `<button type="button" class="btn chico primario" data-bsel-lineas="pregunta">${icono('chispa')} Ask</button>` : ''}
      ${API && prSel()?.estadoPr === 'OPEN' ? '<button type="button" class="btn chico" data-bsel-lineas="cambio">Request change</button>' : ''}
      <button type="button" class="btn chico${API ? '' : ' primario'}" data-bsel-lineas="nota">Note</button>
      <button type="button" class="btn-texto" data-bsel="cerrar" aria-label="Close">Esc</button></div>`;
    colocarBarra(barra, sel.getRangeAt(0).getBoundingClientRect());
    barra.style.width = 'auto';
    return;
  }
  if (!API || estado.tab !== 'resumen') return;
  const rango = sel.getRangeAt(0);
  const nodo = rango.commonAncestorContainer.nodeType === 1 ? rango.commonAncestorContainer : rango.commonAncestorContainer.parentElement;
  const seccion = nodo?.closest('[data-seccion]');
  if (!seccion || nodo.closest('.hilos-pr, textarea, button')) return;
  seleccionResumen = { seccion: seccion.dataset.seccion, citado: texto.slice(0, 2000), tab: 'resumen' };
  ponerBarraPregunta(rango.getBoundingClientRect(), 'Ask about the selected text', 'Question or comment about this fragment');
}

// Text selected in the AI answer of a thread (Summary or Files): a follow-up is asked in that thread about that part.
function barraEnRespuesta(sel, texto) {
  const rango = sel.getRangeAt(0);
  const nodo = rango.commonAncestorContainer.nodeType === 1 ? rango.commonAncestorContainer : rango.commonAncestorContainer.parentElement;
  const md = nodo?.closest('.hilo-respuesta .md');
  const hilo = md?.closest('[data-hilo]');
  const c = hilo && comentarios(prSel() ?? {}).find((x) => x.id === hilo.dataset.hilo);
  if (!c?.respuesta || c.estado === 'en_cola' || c.estado === 'en_curso') return false;
  seleccionResumen = { hilo: c.id, citado: texto.slice(0, 2000), tab: estado.tab };
  ponerBarraPregunta(rango.getBoundingClientRect(), 'Follow up on this part of the answer', 'What do you want to know about this part of the answer');
  return true;
}

function ponerBarraPregunta(caja, etiqueta, ayuda) {
  $('barraSel')?.remove();
  const barra = document.createElement('div');
  barra.id = 'barraSel';
  barra.className = 'barra-sel';
  barra.setAttribute('role', 'dialog');
  barra.setAttribute('aria-label', etiqueta);
  barra.innerHTML = `<div class="barra-sel-botones">
      <button type="button" class="btn chico primario" data-bsel="preguntar">${icono('chispa')} Ask</button>
      ${(seleccionResumen.hilo ? RAPIDAS_RESPUESTA : RAPIDAS).map(([e], i) => `<button type="button" class="btn chico" data-bsel-rapida="${i}">${esc(e)}</button>`).join('')}
      <button type="button" class="btn-texto" data-bsel="cerrar" aria-label="Close">Esc</button>
    </div>
    <div class="barra-sel-caja" hidden>
      <blockquote class="cita">${esc(seleccionResumen.citado.length > 180 ? `${seleccionResumen.citado.slice(0, 180)}…` : seleccionResumen.citado)}</blockquote>
      <textarea id="barraSelTexto" rows="3" placeholder="${esc(ayuda)}" aria-label="${esc(ayuda)}"></textarea>
      <label class="muy-tenue" style="display:block;margin-bottom:6px"><input type="checkbox" id="barraSelCodigo"> Check the repository code</label>
      <div class="prop-acciones"><button type="button" class="btn chico primario" data-bsel="enviar">Send now</button><button type="button" class="btn chico" data-bsel="agregar">Add to review</button><span class="muy-tenue">Ctrl + Enter adds</span></div>
    </div>`;
  colocarBarra(barra, caja);
}

function accionBarraSel(accion, rapida) {
  const pr = prSel();
  const s = seleccionResumen;
  if (!pr || !s) return cerrarBarraSel();
  const preguntar = (texto, opciones) => (s.hilo ? preguntarSobreRespuesta(pr, s.hilo, texto, opciones) : preguntarPr(pr, s.seccion, texto, opciones));
  if (rapida !== undefined) { cerrarBarraSel(); return preguntar((s.hilo ? RAPIDAS_RESPUESTA : RAPIDAS)[rapida][1], { citado: s.citado, enviar: false }); }
  if (accion === 'cerrar') return cerrarBarraSel();
  if (accion === 'preguntar') { $('barraSel').querySelector('.barra-sel-caja').hidden = false; return $('barraSelTexto').focus(); }
  const texto = $('barraSelTexto')?.value.trim();
  if (!texto) { avisar('Write the question before adding it.'); return $('barraSelTexto')?.focus(); }
  const investigar = !!$('barraSelCodigo')?.checked;
  cerrarBarraSel();
  window.getSelection()?.removeAllRanges();
  return preguntar(texto, { citado: s.citado, enviar: accion === 'enviar', investigar });
}

// The follow-up inherits where the thread lives (PR section or diff lines) so it hangs off it.
async function preguntarSobreRespuesta(pr, padreId, texto, { citado, enviar, investigar }) {
  const padre = comentarios(pr).find((x) => x.id === padreId);
  if (!padre) return;
  const lugar = padre.ambito === 'pr'
    ? { ambito: 'pr', seccion: padre.seccion }
    : { archivo: padre.archivo, lado: padre.lado, desde: padre.desde, hasta: padre.hasta, claves: padre.claves, textoOriginal: padre.textoOriginal };
  const c = { id: nuevoIdComentario(), creado: new Date().toISOString(), tipo: 'pregunta', estado: 'borrador', ...lugar, citado, citadoDe: 'respuesta', respondeA: padre.id, investigar: investigar || undefined, texto, headSha: pr.headSha };
  guardarComentario(pr, c);
  if (enviar) await enviarRevision(pr, [c.id]);
  else { repintarDetalle(); pintarCola(); }
}

// Highlights in the explanation the fragments quoted by questions (CSS Highlight API; without it nothing is highlighted).
function resaltarCitas(pr) {
  if (!globalThis.CSS?.highlights || !globalThis.Highlight) return;
  const rangos = [];
  for (const c of vivos(pr).filter((x) => x.citado && (x.ambito === 'pr' || x.citadoDe === 'respuesta'))) {
    const el = c.citadoDe === 'respuesta'
      ? document.querySelector(`[data-hilo="${CSS.escape(c.respondeA)}"] > .hilo-respuesta .md, [data-hilo="${CSS.escape(c.respondeA)}"] > .anterior .md`)
      : document.querySelector(`[data-seccion="${c.seccion}"]`);
    const rg = el && rangoDeTexto(el, c.citado);
    if (rg) rangos.push(rg);
  }
  CSS.highlights.set('seki-citado', new Highlight(...rangos));
}

function rangoDeTexto(el, buscado) {
  const nodos = [];
  const andar = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: (n) => {
    const fuera = n.parentElement.closest('.hilos-pr, h3');
    return fuera && el.contains(fuera) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
  } });
  let texto = '';
  const mapa = [];
  for (let n = andar.nextNode(); n; n = andar.nextNode()) {
    for (let i = 0; i < n.data.length; i++) {
      const ch = /\s/.test(n.data[i]) ? ' ' : n.data[i];
      if (ch === ' ' && texto.endsWith(' ')) continue;
      texto += ch;
      mapa.push([n, i]);
    }
    nodos.push(n);
  }
  const ini = texto.indexOf(buscado);
  if (ini < 0) return null;
  const [na, ia] = mapa[ini];
  const [nb, ib] = mapa[ini + buscado.length - 1];
  const rg = document.createRange();
  rg.setStart(na, ia);
  rg.setEnd(nb, ib + 1);
  return rg;
}
const borradores = (pr) => comentarios(pr).filter((c) => c.estado === 'borrador');
// The server does not send comments made on another commit; editing them anchors them to the current commit.
const deOtroCommit = (pr, c) => !!c.headSha && c.headSha !== pr.headSha;
const nuevoIdComentario = () => `c-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const rangoTexto = (c) => esc(c.desde === c.hasta ? `L${c.desde}` : `L${c.desde}–${c.hasta}`);
const cajaVacia = (tipo) => ({ tipo: tipo ?? (API ? 'pregunta' : 'nota'), texto: '', conSugerido: false, sugerido: null, editando: null });

function escribirComentarios(pr, lista) {
  if (!almacen.escribir(claveComentarios(pr), lista)) avisar('Could not save: the browser is blocking local storage.');
}

function guardarComentario(pr, c) {
  const nuevo = { ...c, actualizado: new Date().toISOString() };
  escribirComentarios(pr, [...comentarios(pr).filter((x) => x.id !== c.id), nuevo]);
  sincronizarComentarios(pr, [nuevo]);
}

function borrarComentarios(pr, ids) {
  escribirComentarios(pr, comentarios(pr).filter((x) => !ids.includes(x.id)));
  sincronizarComentarios(pr, [], ids);
}

// Merges comments by id; the most recently updated wins, unless the server already moved it out
// of draft or note: that is not reverted from the browser.
const DEL_NAVEGADOR = new Set(['borrador', 'nota']);
function fusionarComentarios(actuales, entrantes) {
  const porId = new Map(actuales.map((c) => [c.id, c]));
  for (const c of entrantes) {
    const previo = porId.get(c.id);
    if (previo && !DEL_NAVEGADOR.has(previo.estado) && DEL_NAVEGADOR.has(c.estado)) continue;
    if (!previo || (c.actualizado ?? '') > (previo.actualizado ?? '')) porId.set(c.id, c);
  }
  return [...porId.values()];
}

// With the served dashboard, comments also live on disk: they are not lost and the AI reads them.
async function sincronizarComentarios(pr, cambios = [], borrados = []) {
  if (!API) return;
  try {
    let delServidor = cambios.length || borrados.length
      ? await api('/api/comentarios', { id: pr.id, comentarios: cambios, borrados })
      : await api(`/api/comentarios?id=${encodeURIComponent(pr.id)}`);
    // Drafts and notes that only exist in this browser (no server when created, or imported) are uploaded.
    const enServidor = new Set(delServidor.map((c) => c.id));
    const faltan = comentarios(pr).filter((c) => DEL_NAVEGADOR.has(c.estado) && !enServidor.has(c.id) && !borrados.includes(c.id));
    if (faltan.length) delServidor = await api('/api/comentarios', { id: pr.id, comentarios: faltan });
    const antes = JSON.stringify(comentarios(pr));
    escribirComentarios(pr, fusionarComentarios(comentarios(pr).filter((c) => !borrados.includes(c.id)), delServidor));
    estado.comentariosCargados.add(pr.id);
    if (JSON.stringify(comentarios(pr)) !== antes && estado.seleccion === pr.id && !$('detalle').contains(document.activeElement)) { repintarDetalle(); pintarCola(); }
  } catch (err) { avisar(`The comments were saved only in this browser: ${err.message}`); }
}

// Orders a list of comments as a conversation: each follow-up below the question it replies to.
function enHilo(cs) {
  const ids = new Set(cs.map((c) => c.id));
  const hijos = new Map();
  for (const c of cs) if (c.respondeA && ids.has(c.respondeA)) hijos.set(c.respondeA, [...(hijos.get(c.respondeA) ?? []), c]);
  const salida = [];
  const poner = (c, n) => { salida.push([c, n]); for (const h of hijos.get(c.id) ?? []) poner(h, n + 1); };
  for (const c of cs) if (!(c.respondeA && ids.has(c.respondeA))) poner(c, 0);
  return salida;
}
const hilosDiv = (cs) => enHilo(cs).map(([c, n]) => hiloCuerpo(c, n)).join('');

// Minimal formatting for AI answers: code blocks, inline code, bold, lists and paragraphs.
function md(texto) {
  return String(texto ?? '').replace(/\r/g, '').split('```').map((b, i) => (i % 2
    ? `<pre class="md-codigo">${esc(b.replace(/^[a-zA-Z]*\n/, '').replace(/\n$/, ''))}</pre>`
    : mdTexto(b))).join('');
}
// Only http(s) links: esc() already removed the quotes, so the href cannot break out of the attribute.
const mdEnLinea = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
function mdTexto(t) {
  return t.split(/\n\s*\n/).map((par) => {
    const partes = [];
    let lista = null;
    const agregar = (tipo, valor) => {
      if (!lista || lista.tipo !== tipo) { lista = { tipo, items: [] }; partes.push(lista); }
      lista.items.push(valor);
    };
    for (const linea of par.split('\n')) {
      const item = /^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/.exec(linea);
      const titulo = /^\s*#{1,6}\s+(.*)$/.exec(linea);
      if (/^\s*\|/.test(linea)) {
        agregar('pre', linea);
      } else if (item) {
        agregar(item[1] ? 'ol' : 'ul', item[2]);
      } else if (titulo) {
        lista = null;
        partes.push({ tipo: 'h', items: [titulo[1]] });
      } else if (linea.trim()) {
        lista = null;
        partes.push(linea);
      }
    }
    return partes.map((x) => {
      if (typeof x === 'string') return `<p>${mdEnLinea(x)}</p>`;
      if (x.tipo === 'pre') return `<pre class="md-codigo">${esc(x.items.join('\n'))}</pre>`;
      if (x.tipo === 'h') return `<h4 class="md-titulo">${mdEnLinea(x.items[0])}</h4>`;
      return `<${x.tipo}>${x.items.map((i) => `<li>${mdEnLinea(i)}</li>`).join('')}</${x.tipo}>`;
    }).join('');
  }).join('');
}

// What the AI is doing while working on a comment, with elapsed time: a static dot looks like a frozen app.
const PROGRESO = {
  investigar: ['AI is searching and reading the code of the PR and the other repos', 'Usually takes 30 seconds to 2 minutes.'],
  pregunta: ['AI is writing the answer', 'Usually takes a few seconds.'],
  cambio: ['AI is applying the change to a copy and running the checks', 'Usually takes 1 to 3 minutes.'],
};
// Stages reported by the server (mcp/lib/avance.mjs). The fix-up stages only appear if the first check failed.
const PASOS = {
  investigar: [['copias', 'Prepare copies of the code'], ['leyendo', 'Read the code and write the answer']],
  cambio: [['editando', 'Apply the change to a copy'], ['comprobando', 'Run the checks'], ['corrigiendo', 'Fix what failed'], ['recomprobando', 'Check again']],
  explicar: [['preparando', 'Fetch the diff and description'], ['leyendo', 'Read the diff and related code'], ['completando', 'Read what was missed and extend the explanation']],
};
// Seconds after which a "taking longer than usual" notice is shown.
const LENTO = { investigar: 150, pregunta: 60, cambio: 240, explicar: 240 };

function avanceHtml(tipo, av, desde) {
  let pasos = PASOS[tipo] ?? [];
  if (!av?.corrigio) pasos = pasos.filter(([f]) => f !== 'corrigiendo' && f !== 'recomprobando');
  const actual = pasos.findIndex(([f]) => f === av?.fase);
  const lista = av && pasos.length > 1 ? `<ol class="etapas">${pasos.map(([, nombre], i) => {
    const clase = i < actual ? 'hecho' : i === actual ? 'actual' : '';
    return `<li class="${clase}"${i === actual ? ' aria-current="step"' : ''}>${icono(i < actual ? 'ok' : i === actual ? 'actualizar' : 'circulo', i === actual ? 'girando' : '')} ${nombre}</li>`;
  }).join('')}</ol>` : '';
  const cuentas = [
    av?.archivos ? plural(av.archivos, 'file read', 'files read') : '',
    av?.busquedas ? plural(av.busquedas, 'search', 'searches') : '',
    av?.ediciones ? plural(av.ediciones, 'edit', 'edits') : '',
  ].filter(Boolean).join(' · ');
  const leido = cuentas ? `<p class="muy-tenue avance-cuenta">${cuentas}${av.ultimo ? ` · last: <code>${esc(av.ultimo)}</code>` : ''}</p>` : '';
  const seg = desde ? (Date.now() - new Date(desde)) / 1000 : 0;
  const lento = seg > (LENTO[tipo] ?? 120)
    ? `<p class="aviso-lento">${icono('reloj')} Taking longer than usual, but still running. If it reaches 10 minutes it stops and is marked as an error.</p>` : '';
  return lista + leido + lento;
}

function progresoHtml(c) {
  if (c.estado === 'en_cola') return `<div class="hilo-progreso" aria-live="polite"><p class="trabajando">${icono('reloj')} Queued: starts when the current job finishes.</p></div>`;
  const tipo = c.investigar ? 'investigar' : c.tipo;
  const [texto, ayuda] = PROGRESO[tipo] ?? PROGRESO.pregunta;

function hiloCuerpo(c, nivel = 0) {
  const revisando = c.investigar && (c.estado === 'en_cola' || c.estado === 'en_curso');
  const trabajando = c.estado === 'en_cola' || c.estado === 'en_curso';

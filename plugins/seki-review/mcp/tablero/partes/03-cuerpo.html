<body>
<!--
THESIS: a work inbox ordered by the next action, not a wall of cards; rejects big-number tiles and tag soup.
OWN-WORLD: warm tool neutrals, color only for status (green ready, amber review, red blocks, violet merged), system sans at 13 px, mono only for ids, branches and paths.
STORY: the author sees what to do today; the reviewer understands a PR, records a decision and exports it as a file.
FIRST VIEWPORT: sidebar with views and counts, grouped queue with one-line rows, detail with status stack and tabs.
FORM: three-column inbox (Linear, GitHub) and merge-request-style detail (GitLab, Graphite); Mobbin references.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<div class="app">
  <header class="barra">
    <button class="btn-lateral" data-accion="lateral" aria-label="Show or hide the sidebar" aria-pressed="true" title="Sidebar ( [ )"><svg class="i" aria-hidden="true"><use href="#i-lateral"/></svg></button>
    <button class="btn-lateral" data-accion="cola" aria-label="Show or hide the PR queue" aria-pressed="true" title="PR queue ( ] )" style="margin-left:-12px"><svg class="i" aria-hidden="true"><use href="#i-cola"/></svg></button>
    <h1 id="titulo">Seki Review</h1>
    <div class="rol pestanas" role="group" aria-label="Board">
      <button type="button" data-pestana="entregas" aria-pressed="true">Deliveries</button>
      <button type="button" data-pestana="prs" aria-pressed="false">PRs</button>
    </div>
    <span class="foto" id="foto"></span>
    <label class="buscar">
      <svg class="i" aria-hidden="true"><use href="#i-buscar"/></svg>
      <input type="search" id="buscar" placeholder="Search by number, title, branch or file" aria-label="Search PRs">
      <kbd>/</kbd>
    </label>
    <button type="button" class="btn chico filtrar-ia" id="filtrarIa" data-accion="filtrarIa" hidden aria-label="Filter with AI using the search text" title="AI keeps only the PRs that match what you typed, for example “cybersecurity PRs” (Ctrl + Enter in the search box)"><svg class="i" aria-hidden="true"><use href="#i-chispa"/></svg><span>Filter with AI</span></button>
    <div class="acciones-barra" id="accionesBarra"></div>
    <div class="rol" role="group" aria-label="View">
      <button data-rol="autor" aria-pressed="true">Author</button>
      <button data-rol="revisor" aria-pressed="false">Reviewer</button>
    </div>
  </header>

  <nav class="lateral" id="lateral" aria-label="Views and filters"></nav>

  <main class="cola" id="cola" aria-label="PR queue"></main>

  <section class="detalle" id="detalle" aria-label="PR detail"></section>

  <section class="entregas" id="entregas" aria-label="Deliveries" hidden></section>
</div>
<input type="file" id="archivoRevision" accept="application/json,.json" hidden>
